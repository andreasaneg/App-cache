<script>

let db;
let ocultarValores = false;
let idParaExcluir = null;

const request =
indexedDB.open(
    "CacheFinal_V30",
    1
);

request.onupgradeneeded = (e)=>{

    let d = e.target.result;

    if(!d.objectStoreNames.contains("jobs")){

        d.createObjectStore(
            "jobs",
            {
                keyPath:"id",
                autoIncrement:true
            }
        );

    }

};

request.onsuccess = (e)=>{

    db = e.target.result;

    atualizarTela();

};

function toggleValores(){

    ocultarValores =
    !ocultarValores;

    atualizarTela();

}

function formatarValor(v){

    if(ocultarValores){

        return "R$ •••••";

    }

    return v.toLocaleString(
        'pt-BR',
        {
            style:'currency',
            currency:'BRL'
        }
    );

}

function salvarJob(){

    let dt =
    document.getElementById(
        'dataJob'
    ).value;

    if(!dt){

        return alert(
            "Selecione a data"
        );

    }

    let empresa =
    document.getElementById(
        'empresaJob'
    ).value || "Sem empresa";

    let job =
    document.getElementById(
        'nomeJob'
    ).value || "Sem nome";

    let cache =
    parseFloat(
        document.getElementById(
            'vCacheBase'
        ).value
    ) || 0;

    let diaria =
    parseFloat(
        document.getElementById(
            'vDiaria'
        ).value
    ) || 0;

    let nf =
    parseFloat(
        document.getElementById(
            'nfPercentual'
        ).value
    ) || 0;

    let inicio =
    document.getElementById(
        'inicio'
    ).value;

    let fim =
    document.getElementById(
        'fim'
    ).value;

    let ini =
    inicio.split(':');

    let end =
    fim.split(':');

    let min =
    (
        parseInt(end[0])*60
        +
        parseInt(end[1])
    )
    -
    (
        parseInt(ini[0])*60
        +
        parseInt(ini[1])
    );

    if(min < 0){

        min += 1440;

    }

    let horas =
    (min / 60);

    let extraHoras =
    Math.max(
        0,
        horas - 12
    );

    let extra =
    extraHoras *
    (cache / 12);

    let total =
    cache +
    diaria +
    extra;

    let valorNF =
    total *
    (nf / 100);

    const registro = {

        data:dt,
        empresa:empresa,
        job:job,
        cache:cache,
        diaria:diaria,
        extra:extra,
        total:total,
        nf:nf,
        valorNF:valorNF,
        inicio:inicio,
        fim:fim,
        horas:horas.toFixed(1)

    };

    db.transaction(
        "jobs",
        "readwrite"
    )
    .objectStore("jobs")
    .add(registro)
    .onsuccess = ()=>{

        atualizarTela();

    };

}

function atualizarTela(){

    if(!db) return;

    let total = 0;
    let totalNF = 0;

    const lista =
    document.getElementById(
        'listaHistorico'
    );

    lista.innerHTML = "";

    let empresas = {};

    db.transaction("jobs")
    .objectStore("jobs")
    .openCursor(null,'prev')
    .onsuccess = (e)=>{

        const cursor =
        e.target.result;

        if(cursor){

            const d =
            cursor.value;

            total += d.total;

            totalNF +=
            (d.valorNF || 0);

            if(!empresas[d.empresa]){

                empresas[d.empresa] = 0;

            }

            empresas[d.empresa] +=
            d.total;

            const card =
            document.createElement(
                'div'
            );

            card.className =
            'history-card';

            card.innerHTML = `

                <div style="
                color:#94a3b8;
                font-size:0.8em;
                margin-bottom:5px;">

                    🏢 ${d.empresa}

                </div>

                <b>

                ${d.data
                .split('-')
                .reverse()
                .join('/')}

                </b>

                - ${d.job}

                <br><br>

                🕒
                ${d.inicio}
                às
                ${d.fim}

                •
                ${d.horas}h

                <br><br>

                💰
                ${formatarValor(d.total)}

                <br>

                <span style="color:#ef4444;">
                NF:
                ${formatarValor(d.valorNF || 0)}
                </span>

                <button
                class="btn-del"
                onclick="abrirModal(${d.id})">
                ×
                </button>

            `;

            lista.appendChild(card);

            cursor.continue();

        }else{

            document.getElementById(
                'vTotalSemana'
            ).innerHTML = `

                <div>
                    ${formatarValor(total)}
                </div>

                <div style="
                color:#ef4444;
                font-size:0.45em;
                margin-top:10px;">

                    - ${formatarValor(totalNF)}

                </div>

            `;

            renderGrafico(
                empresas
            );

        }

    };

}

function renderGrafico(empresas){

    const ctx =
    document.getElementById(
        'graficoEmpresas'
    );

    const existente =
    Chart.getChart(ctx);

    if(existente){

        existente.destroy();

    }

    const labels =
    Object.keys(empresas);

    const valores =
    Object.values(empresas);

    const cores = [

        '#10b981',
        '#0ea5e9',
        '#f59e0b',
        '#ef4444',
        '#8b5cf6',
        '#ec4899',
        '#14b8a6',
        '#f97316',
        '#22c55e',
        '#3b82f6'

    ];

    new Chart(ctx, {

        type:'bar',

        data:{

            labels:labels,

            datasets:[{

                label:'Valor por Empresa',

                data:valores,

                backgroundColor:
                labels.map((_,i)=>
                    cores[i % cores.length]
                ),

                borderRadius:12,

                borderWidth:0

            }]

        },

        options:{

            responsive:true,

            maintainAspectRatio:false,

            plugins:{

                legend:{
                    display:false
                }

            },

            scales:{

                y:{

                    ticks:{
                        color:'#ffffff'
                    },

                    grid:{
                        color:'rgba(255,255,255,0.08)'
                    }

                },

                x:{

                    ticks:{
                        color:'#ffffff'
                    },

                    grid:{
                        display:false
                    }

                }

            }

        }

    });

}

</script>
