<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FADER LIVRE - CACHÊ CONTROL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{

--primary:#10b981;
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--danger:#ef4444;
--muted:#94a3b8;
--blue:#38bdf8;

}

*{

box-sizing:border-box;

}

body{

margin:0;
padding:15px;
padding-bottom:60px;

background:var(--bg);

color:var(--text);

font-family:Arial, Helvetica, sans-serif;

}

.header{

text-align:center;

border-bottom:2px solid var(--primary);

padding-bottom:15px;

margin-bottom:20px;

}

.header img{

width:140px;
height:140px;

border-radius:18px;

border:2px solid var(--primary);

object-fit:cover;

}

.dashboard{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

margin-bottom:20px;

}

.dashboard-card{

background:var(--card);

border-radius:18px;

padding:20px;

border:1px solid #334155;

position:relative;

}

.dashboard-title{

font-size:.8em;

text-transform:uppercase;

margin-bottom:10px;

letter-spacing:1px;

}

.total-geral{

font-size:2em;

font-weight:bold;

color:var(--blue);

}

.total-nf{

font-size:2em;

font-weight:bold;

color:var(--danger);

}

.total-horas{

font-size:2em;

font-weight:bold;

color:var(--primary);

}

.eye-button{

position:absolute;

top:15px;
right:15px;

width:60px;
height:60px;

border:none;

border-radius:18px;

background:#334155;

color:white;

font-size:1.8em;

cursor:pointer;

transition:.2s;

}

.eye-button:hover{

transform:scale(1.08);

}

.input-group{

background:var(--card);

border:1px solid #334155;

border-radius:16px;

padding:16px;

margin-bottom:15px;

}

label{

display:block;

margin-bottom:5px;

color:var(--muted);

font-size:0.75em;

text-transform:uppercase;

}

input,
select{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #334155;

background:#0f172a;

color:white;

margin-bottom:12px;

font-size:16px;

}

.btn{

width:100%;

border:none;

padding:16px;

border-radius:14px;

font-weight:bold;

cursor:pointer;

margin-bottom:10px;

font-size:1em;

transition:.2s;

}

.btn:hover{

transform:translateY(-2px);

}

.btn-save{

background:var(--primary);

color:#000;

}

.btn-export{

background:#475569;

color:white;

}

.btn-whats{

background:#25D366;

color:#000;

}

.btn-search{

background:#0ea5e9;

color:white;

}

.history-card{

background:var(--card);

border-radius:16px;

padding:18px;

margin-bottom:15px;

position:relative;

border-left:6px solid var(--primary);

}

.empresa-title{

font-size:1.3em;

font-weight:bold;

margin-bottom:10px;

}

.extra-box{

margin-top:10px;

padding:10px;

border-radius:10px;

background:#082f49;

color:#38bdf8;

font-weight:bold;

}

.btn-del{

position:absolute;

top:10px;
right:12px;

background:none;

border:none;

color:var(--danger);

font-size:1.5em;

cursor:pointer;

}

.chart-container{

height:320px;

margin-top:20px;

}

.search-box{

display:none;

margin-bottom:15px;

}

.empresa-group{

margin-bottom:30px;

}

.section-title{

font-size:1.3em;

font-weight:bold;

margin:25px 0 15px;

}

@media print{

.btn,
.search-box,
.btn-del{

display:none !important;

}

}

</style>

</head>

<body>
<div id="loginScreen"
style="
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;">

<div style="
background:#1e293b;
padding:30px;
border-radius:20px;
width:90%;
max-width:360px;">

<div style="text-align:center;">

<img
src="FaderLivreIcon.png"
style="
width:120px;
height:120px;
border-radius:20px;
border:2px solid #10b981;
object-fit:cover;
margin-bottom:20px;">

</div>

<h2 style="
text-align:center;
margin-bottom:20px;">

🔒 Login

</h2>

<input
type="password"
id="senhaInput"
placeholder="Digite sua senha">

<div
id="novaSenhaBox"
style="
display:none;
margin-top:10px;">

<input
type="password"
id="novaSenha"
placeholder="Nova senha">

<input
type="email"
id="emailRecuperacao"
placeholder="Email para recuperação">

<button
class="btn btn-save"
onclick="cadastrarSenha()">

SALVAR SENHA

</button>

</div>

<button
class="btn btn-save"
onclick="login()">

ENTRAR

</button>

<button
class="btn btn-search"
onclick="toggleCadastroSenha()">

CADASTRAR SENHA

</button>

<button
class="btn btn-export"
onclick="recuperarSenha()">

RECUPERAR SENHA

</button>

</div>

</div>

<div class="header">

<img src="FaderLivreIcon.png">

<h2>
Cachê Control
</h2>

</div>

<div class="dashboard">

<div class="dashboard-card">

<button
class="eye-button"
id="eyeButton"
onclick="toggleValores()">

👁️

</button>

<div class="dashboard-title"
style="color:var(--blue)">

TOTAL GERAL

</div>

<div id="vTotalSemana"
class="total-geral">

R$ 0,00

</div>

</div>

<div class="dashboard-card">

<div class="dashboard-title"
style="color:var(--danger)">

NOTA FISCAL

</div>

<div id="vTotalNF"
class="total-nf">

- R$ 0,00

</div>

</div>

<div class="dashboard-card">

<div class="dashboard-title"
style="color:var(--primary)">

HORAS TRABALHADAS

</div>

<div id="vTotalHoras"
class="total-horas">

0h

</div>

</div>

</div>

<div class="input-group">

<label>Data</label>

<input type="date"
id="dataJob">

<label>Empresa</label>

<input type="text"
id="empresaJob"
placeholder="Fader Livre">

<label>Nome do Job</label>

<input type="text"
id="nomeJob"
placeholder="Ex: Comercial">

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<div>

<label>Cachê</label>

<input type="number"
id="vCacheBase">

</div>

<div>

<label>Diária</label>

<input type="number"
id="vDiaria">

</div>

</div>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<div>

<label>Início</label>

<input type="time"
id="inicio"
value="08:00">

</div>

<div>

<label>Fim</label>

<input type="time"
id="fim"
value="20:00">

</div>

</div>

<label>Tipo de Pagamento</label>

<select
id="tipoPagamento"
onchange="alterarPeriodoPagamento()">

<option value="Semanal">
Semanal
</option>

<option value="Quinzenal">
Quinzenal
</option>

<option value="Mensal">
Mensal
</option>

</select>

<div
id="periodoPersonalizado"
style="display:none;">

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<div>

<label>Início do período</label>

<input type="number"
id="inicioPeriodo"
min="1"
max="31"
placeholder="1">

</div>

<div>

<label>Fim do período</label>

<input type="number"
id="fimPeriodo"
min="1"
max="31"
placeholder="15">

</div>

</div>

</div>

<label>
Dias após fechamento
</label>

<input type="number"
id="diasPagamento"
value="5">

<label>NF (%)</label>

<input type="number"
id="nfPercentual"
value="0">

<button
class="btn btn-save"
onclick="salvarJob()">

💾 SALVAR JOB

</button>

<button
class="btn btn-export"
onclick="limparCampos()">

🧹 LIMPAR

</button>

</div>
<div class="input-group">

<h2 style="margin-bottom:15px;">

Financeiro

</h2>

<div class="chart-container">

<canvas id="graficoEmpresas"></canvas>

</div>

</div>

<div class="input-group">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;">

<div class="section-title">

Todos os Jobs

</div>

</div>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<button
class="btn btn-search"
onclick="abrirBusca()">

🔍 BUSCAR

</button>

<button
class="btn btn-export"
onclick="limparBusca()">

❌ LIMPAR BUSCA

</button>

</div>

<div
id="searchBox"
class="search-box">

<input
type="text"
id="inputBusca"
onkeyup="filtrarTabela()"
placeholder="Buscar empresa, job ou data...">

</div>

<div id="listaHistorico"></div>

</div>

<div class="input-group">

<h2>

Exportações e Backup

</h2>

<button
class="btn btn-whats"
onclick="enviarRelatorioWhatsApp()">

WHATSAPP

</button>

<button
class="btn btn-export"
onclick="baixarExcelCompleto()">

EXPORTAR CSV

</button>

<button
class="btn btn-export"
onclick="fazerBackup()">

BACKUP

</button>

<button
class="btn btn-export"
onclick="document.getElementById('restoreFile').click()">

RESTAURAR BACKUP

</button>

<input
type="file"
id="restoreFile"
accept=".json"
style="display:none;">

</div>
<script>

let db;
let ocultarValores = false;
let mapaCores = {};
let coresGrafico = [
'#38bdf8','#10b981','#f59e0b','#ef4444',
'#8b5cf6','#ec4899','#14b8a6','#f97316'
];

let senhaSalva = localStorage.getItem("senha_cache_control");
let emailRecuperacao = localStorage.getItem("email_cache_control");

if(!senhaSalva){
document.getElementById("senhaInput").placeholder =
"Defina sua senha (primeiro acesso)";
}

function toggleCadastroSenha(){

const box =
document.getElementById("novaSenhaBox");

box.style.display =
box.style.display === "none" ? "block" : "none";

}

function cadastrarSenha(){

const novaSenha =
document.getElementById("novaSenha").value;

const email =
document.getElementById("emailRecuperacao").value;

if(!novaSenha || !email){
alert("Preencha senha e email");
return;
}

localStorage.setItem("senha_cache_control", novaSenha);
localStorage.setItem("email_cache_control", email);

alert("Senha cadastrada com sucesso");
document.getElementById("novaSenhaBox").style.display="none";

}

function login(){

const senha =
document.getElementById("senhaInput").value;

if(!senhaSalva){

// primeiro acesso
localStorage.setItem("senha_cache_control", senha);
document.getElementById("loginScreen").style.display="none";
return;

}

if(senha === senhaSalva){
document.getElementById("loginScreen").style.display="none";
}else{
alert("Senha incorreta");
}

}

function recuperarSenha(){

const email = localStorage.getItem("email_cache_control");

if(!email){
alert("Nenhum email cadastrado");
return;
}

alert("Senha enviada para: " + email);

}

const request = indexedDB.open("CacheFinal_V33",1);

request.onupgradeneeded = e=>{
let d = e.target.result;
if(!d.objectStoreNames.contains("jobs")){
d.createObjectStore("jobs",{keyPath:"id",autoIncrement:true});
}
};

request.onsuccess = e=>{
db = e.target.result;
atualizarTela();
};

function toggleValores(){

ocultarValores = !ocultarValores;

document.getElementById("eyeButton").innerHTML =
ocultarValores ? "🙈" : "👁️";

atualizarTela();

}

function formatarValor(v){

if(ocultarValores) return "R$ •••••";

return Number(v).toLocaleString("pt-BR",{
style:"currency",currency:"BRL"
});

}

/* ================= BACKUP ================= */

function fazerBackup(){

db.transaction("jobs").objectStore("jobs").getAll().onsuccess = e=>{

const data = e.target.result;

const blob = new Blob([JSON.stringify(data,null,2)],{
type:"application/json"
});

const nome = "cache_control_backup_" +
new Date().toISOString().split("T")[0] + ".json";

const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = nome;
a.click();

};

}

document.getElementById("restoreFile").addEventListener("change",function(e){

const file = e.target.files[0];

const reader = new FileReader();

reader.onload = function(){

const data = JSON.parse(reader.result);

const tx = db.transaction("jobs","readwrite");
const store = tx.objectStore("jobs");

data.forEach(item=>{
store.put(item);
});

tx.oncomplete = ()=>{
alert("Backup restaurado");
atualizarTela();
};

};

reader.readAsText(file);

});

/* ================= RESTANTE ================= */

function alterarPeriodoPagamento(){

const tipo = document.getElementById("tipoPagamento").value;

document.getElementById("periodoPersonalizado").style.display =
(tipo==="Quinzenal"||tipo==="Mensal") ? "block":"none";

}

function calcularPagamento(dataBase,tipo,dias,inicioPeriodo,fimPeriodo){

let data = new Date(dataBase+"T00:00:00");
let fechamento;

if(tipo==="Semanal"){

fechamento = new Date(data);
fechamento.setDate(data.getDate()+(7-data.getDay()));

}else{

let dia = data.getDate();

fechamento = (dia>=inicioPeriodo && dia<=fimPeriodo)
? new Date(data.getFullYear(),data.getMonth(),fimPeriodo)
: new Date(data.getFullYear(),data.getMonth()+1,fimPeriodo);

}

fechamento.setDate(fechamento.getDate()+Number(dias));

return fechamento.toLocaleDateString("pt-BR");

}

/* ================= CRUD ================= */

function salvarJob(){

const dt = dataJob.value;
if(!dt) return alert("Selecione data");

const cache = parseFloat(vCacheBase.value||0);
const diaria = parseFloat(vDiaria.value||0);
const nf = parseFloat(nfPercentual.value||0);

const inicio = inicio.value;
const fim = fim.value;

const ini = inicio.split(":");
const end = fim.split(":");

let min =
(parseInt(end[0])*60+parseInt(end[1])) -
(parseInt(ini[0])*60+parseInt(ini[1]));

if(min<0) min+=1440;

const horas = min/60;
const extraHoras = Math.max(0,horas-12);
const extra = extraHoras*(cache/12);

const total = cache+diaria+extra;

const item = {
data:dt,
empresa:empresaJob.value||"Fader Livre",
job:nomeJob.value||"",
cache,diaria,extra,total,
valorNF: total*(nf/100),
horas:horas.toFixed(1),
inicio,fim,
tipoPagamento:tipoPagamento.value,
diasPagamento:parseInt(diasPagamento.value||0),
inicioPeriodo:parseInt(inicioPeriodo.value||1),
fimPeriodo:parseInt(fimPeriodo.value||15),
previsaoPagamento:
calcularPagamento(dt,tipoPagamento.value,diasPagamento.value,inicioPeriodo.value,fimPeriodo.value)
};

db.transaction("jobs","readwrite")
.objectStore("jobs")
.add(item)
.onsuccess = ()=> atualizarTela();

}

</script>

</body>
</html>
<script>

/* ================= ATUALIZAÇÃO DA TELA ================= */

function atualizarTela(){

if(!db) return;

const lista = document.getElementById("listaHistorico");

lista.innerHTML = "";

let total = 0;
let totalNF = 0;
let totalHoras = 0;

let empresas = {};

const tx = db.transaction("jobs","readonly");
const store = tx.objectStore("jobs");

store.getAll().onsuccess = e=>{

const dados = e.target.result.reverse();

dados.forEach(d=>{

total += d.total || 0;
totalNF += d.valorNF || 0;
totalHoras += parseFloat(d.horas || 0);

if(!empresas[d.empresa]){
empresas[d.empresa] = 0;
}

empresas[d.empresa] += d.total;

if(!mapaCores[d.empresa]){
mapaCores[d.empresa] =
coresGrafico[Object.keys(mapaCores).length % coresGrafico.length];
}

/* CARD */

const card = document.createElement("div");
card.className = "history-card";
card.style.borderLeft = "6px solid " + mapaCores[d.empresa];

card.innerHTML = `
<div class="empresa-title" style="color:${mapaCores[d.empresa]}">
${d.empresa}
</div>

<b>${d.data.split("-").reverse().join("/")}</b> - ${d.job}

<br><br>

🕒 ${d.inicio} às ${d.fim} • ${d.horas}h

<br><br>

💰 Total: ${formatarValor(d.total)}

<div class="extra-box">
Hora Extra: ${formatarValor(d.extra)}
</div>

<p style="color:#ef4444">
NF: - ${formatarValor(d.valorNF)}
</p>
`;

lista.appendChild(card);

});

/* DASHBOARD */

document.getElementById("vTotalSemana").innerText =
formatarValor(total);

document.getElementById("vTotalNF").innerText =
"- " + formatarValor(totalNF);

document.getElementById("vTotalHoras").innerText =
totalHoras.toFixed(1) + "h";

renderGrafico(empresas);

};

}

/* ================= GRÁFICO ================= */

function renderGrafico(empresas){

const ctx = document.getElementById("graficoEmpresas");

const labels = Object.keys(empresas);
const values = Object.values(empresas);

const colors = labels.map(e=>mapaCores[e]);

if(window.chartInstance){
window.chartInstance.destroy();
}

window.chartInstance = new Chart(ctx,{

type:"bar",

data:{
labels:labels,
datasets:[{
data:values,
backgroundColor:colors,
borderRadius:12
}]
},

options:{
responsive:true,
maintainAspectRatio:false,
plugins:{legend:{display:false}},
scales:{
y:{display:false},
x:{ticks:{color:"#fff"},grid:{display:false}}
}
},

plugins:[{
id:"values",
afterDatasetsDraw(chart){

if(ocultarValores) return;

const {ctx} = chart;

chart.data.datasets[0].data.forEach((v,i)=>{

const meta = chart.getDatasetMeta(0);
const x = meta.data[i].x;
const y = meta.data[i].y;

ctx.fillStyle = "#fff";
ctx.textAlign = "center";
ctx.font = "bold 13px Arial";

ctx.fillText(formatarValor(v),x,y-10);

});

}
}]

});

}

/* ================= BUSCA ================= */

function filtrarTabela(){

const f = inputBusca.value.toUpperCase();

document.querySelectorAll(".history-card").forEach(card=>{

card.style.display =
card.innerText.toUpperCase().includes(f)
? "block":"none";

});

}

/* ================= LIMPAR ================= */

function limparCampos(){

dataJob.value="";
empresaJob.value="";
nomeJob.value="";
vCacheBase.value="";
vDiaria.value="";
inicio.value="08:00";
fim.value="20:00";
tipoPagamento.value="Semanal";
diasPagamento.value="5";
nfPercentual.value="0";

document.getElementById("periodoPersonalizado").style.display="none";

}

</script>

</body>
</html>
