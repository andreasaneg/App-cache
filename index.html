<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>FADER LIVRE - CACHÊ CONTROL v3.2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-glow: rgba(16, 185, 129, 0.2);
            --bg: #0f172a;
            --card: #1e293b;
            --card-hover: #24334c;
            --text: #f8fafc;
            --text-secondary: #cbd5e1;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-glow: rgba(239, 68, 68, 0.15);
            --muted: #94a3b8;
            --blue: #38bdf8;
            --blue-hover: #0ea5e9;
            --blue-glow: rgba(56, 189, 248, 0.2);
            --warning: #f59e0b;
            --success: #16a34a;
            --dark-pure: #020617;
            --border-color: #334155;
            --border-hover: #475569;
            --gold: #c9a96e;
        }

        body.light-mode {
            --primary: #0277bd;
            --primary-hover: #01579b;
            --primary-glow: rgba(2, 119, 189, 0.2);
            --bg: #f5f5f5;
            --card: #ffffff;
            --card-hover: #e8e8e8;
            --text: #212121;
            --text-secondary: #616161;
            --danger: #d32f2f;
            --danger-hover: #c62828;
            --danger-glow: rgba(211, 47, 47, 0.15);
            --muted: #757575;
            --blue: #1976d2;
            --blue-hover: #1565c0;
            --blue-glow: rgba(25, 118, 210, 0.2);
            --warning: #fbc02d;
            --success: #388e3c;
            --dark-pure: #e0e0e0;
            --border-color: #bdbdbd;
            --border-hover: #9e9e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        body {
            padding: 15px;
            padding-bottom: 100px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 1.6em;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text);
            text-transform: uppercase;
        }

        .header p {
            color: var(--primary);
            font-size: 0.85em;
            font-weight: 700;
            margin-top: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .login-logo svg {
            width: 80px;
            height: 80px;
            margin-bottom: 8px;
        }

        .login-logo h3 {
            color: var(--text);
            font-size: 1.2em;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.2em;
            padding: 5px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media(min-width: 600px) {
            .dashboard { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        }

        .dashboard-card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 4px 15px -3px rgba(0,0,0,0.3);
        }

        .dashboard-title {
            font-size: .7em;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .total-geral { font-size: 1.7em; font-weight: 900; color: var(--blue); }
        .total-nf { font-size: 1.7em; font-weight: 900; color: var(--danger); }
        .total-horas { font-size: 1.7em; font-weight: 900; color: var(--primary); }
        .total-liquido { font-size: 1.7em; font-weight: 900; color: var(--success); }

        .eye-button {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 14px;
            background: var(--border-color);
            color: var(--text);
            font-size: 1.3em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group {
            background: var(--card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 4px 15px -3px rgba(0,0,0,0.2);
        }

        .input-group h2, .input-group h3 {
            font-size: 1.2em;
            margin-bottom: 18px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--dark-pure);
            color: var(--text);
            margin-bottom: 15px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-save { background: var(--primary); color: #fff; }
        .btn-export { background: var(--border-color); color: var(--text); }
        .btn-whats { background: #25D366; color: #fff; }
        .btn-search { background: var(--blue); color: #fff; }
        .btn-cancel { background: var(--card-hover); color: var(--text); }
        .btn-danger { background: var(--danger); color: #fff; }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-row .btn {
            margin-bottom: 0;
            font-size: 0.8em;
            padding: 12px;
        }

        .history-card {
            background: var(--card);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            position: relative;
            border-left: 6px solid var(--primary);
            box-shadow: 0 4px 10px -1px rgba(0,0,0,0.2);
        }

        .empresa-title {
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 8px;
            padding-right: 100px;
            color: var(--primary);
        }

        .btn-del {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger-glow);
            border: none;
            color: var(--danger);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-edit-inline {
            position: absolute;
            top: 15px;
            right: 58px;
            background: var(--blue-glow);
            border: none;
            color: var(--blue);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-reopen {
            position: absolute;
            top: 60px;
            right: 15px;
            background: rgba(245, 158, 11, 0.15);
            border: none;
            color: var(--warning);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 700;
            z-index: 10;
        }

        .btn-paid {
            position: absolute;
            top: 60px;
            right: 15px;
            background: rgba(22, 163, 74, 0.15);
            border: none;
            color: var(--success);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 700;
            z-index: 10;
        }

        .chart-container {
            height: 300px;
            margin-top: 15px;
            position: relative;
        }

        .search-box {
            display: none;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 800;
            margin: 25px 0 15px;
            color: var(--text);
        }

        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            background: var(--dark-pure);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .tab-button {
            flex: 1;
            padding: 14px 8px;
            background: transparent;
            color: var(--muted);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .tab-button.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .app-section { display: none; }
        .app-section.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .autocomplete-list {
            position: absolute;
            z-index: 100;
            background: var(--card);
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            width: calc(100% - 40px);
            max-height: 200px;
            overflow-y: auto;
            margin-top: -12px;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7);
        }

        .autocomplete-item {
            padding: 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: var(--text);
        }

        .autocomplete-item:hover { background: var(--card-hover); }

        .badge-status {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .status-aberto { background: rgba(2, 132, 199, 0.15); color: #38bdf8; border: 1px solid rgba(2, 132, 199, 0.3); }
        .status-fechado { background: rgba(234, 88, 12, 0.15); color: #fb923c; border: 1px solid rgba(234, 88, 12, 0.3); }
        .status-pago { background: rgba(22, 163, 74, 0.15); color: #4ade80; border: 1px solid rgba(22, 163, 74, 0.3); }

        .toggle-filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--dark-pure);
            padding: 6px;
            border-radius: 12px;
        }

        .btn-filter {
            flex: 1;
            padding: 12px 6px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
            font-size: 0.85em;
            cursor: pointer;
        }

        .btn-filter.active { background: #334155; color: #ffffff; }

        .meta-text {
            font-size: 0.9em;
            color: var(--text);
            line-height: 1.6;
            margin: 4px 0;
        }

        .meta-text b { color: var(--primary); }

        .config-group {
            background: var(--dark-pure);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .config-group h4 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 1em;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        .icon-svg { width: 18px; height: 18px; vertical-align: middle; fill: currentColor; }
        .icon-btn { width: 20px; height: 20px; fill: currentColor; }

        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideUp 0.3s ease;
            cursor: pointer;
            max-width: 90%;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .periodo-selector {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            align-items: center;
        }

        .periodo-selector span {
            text-align: center;
            font-weight: 700;
            color: var(--muted);
        }

        .month-chart-container {
            height: 250px;
            margin-top: 10px;
        }

        input[type="time"] {
            font-size: 16px;
            padding: 10px;
            min-height: 44px;
        }

        @media(max-width: 360px) {
            .dashboard { grid-template-columns: 1fr 1fr !important; }
        }
    </style>
</head>

<!-- TELA DE LOGIN COM LOGO -->
<div id="loginScreen" style="position:fixed; inset:0; background:var(--dark-pure); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; padding:15px;">
    <button onclick="emergencyReset()" style="background:var(--danger); color:white; border:none; padding:10px 15px; border-radius:10px; font-weight:bold; font-size:0.8em; margin-bottom:20px; width:100%; max-width:400px;">
        <svg class="icon-svg" style="margin-right:6px;"><use href="#icon-alert"/></svg> Forçar Reset de Emergência
    </button>
    <div style="background:var(--card); padding:25px; border-radius:28px; width:100%; max-width:400px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6); border: 1px solid var(--border-color);">
        <!-- LOGO FADER LIVRE -->
        <div class="login-logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" stroke="var(--primary)" stroke-width="4"/>
                <text x="50" y="38" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="900" font-family="sans-serif">FADER</text>
                <text x="50" y="60" text-anchor="middle" fill="var(--primary)" font-size="14" font-weight="700" font-family="sans-serif">LIVRE</text>
                <line x1="20" y1="68" x2="80" y2="68" stroke="var(--gold)" stroke-width="2"/>
                <text x="50" y="82" text-anchor="middle" fill="var(--gold)" font-size="9" font-weight="600" font-family="sans-serif">CACHÊ CONTROL</text>
            </svg>
            <h3>FADER LIVRE</h3>
            <p style="color:var(--primary); font-size:0.7em; letter-spacing:1px;">CACHÊ CONTROL ERP</p>
        </div>
        
        <label>Chave de Segurança</label>
        <div class="password-container">
            <input type="password" id="senhaInput" placeholder="••••••••" style="text-align:center; letter-spacing:6px; font-size:20px;">
            <button class="toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/ocultar senha">
                <svg class="icon-svg"><use href="#icon-eye"/></svg>
            </button>
        </div>
        
        <div id="novaSenhaBox" style="display:none; margin-top:5px; padding-top:15px; border-top:1px dashed var(--border-color);">

];

const coresGrafico = [

// ==========================================
// SEGURANÇA
// ==========================================
function codificarSenha(senha) {
    let hash = 0;
    const str = senha.split('').reverse().join('') + '_fader_x9';
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return 'fx_' + Math.abs(hash).toString(36);
}

function validarEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// ==========================================
// VERIFICA FERIADOS
// ==========================================
function isFeriado(data) {
    const mes = String(data.getMonth() + 1).padStart(2, '0');
    const dia = String(data.getDate()).padStart(2, '0');
    const dataStr = `${dia}-${mes}`;
    
    // Feriados nacionais fixos
    if (FERIADOS_NACIONAIS.includes(dataStr)) return true;
    
    // Carnaval (aproximado: 47 dias antes da Páscoa - estimativa)
    // Aqui você pode adicionar uma lista mais completa
    
    return false;
}

function isDiaUtil(data) {
    const diaSemana = data.getDay();
    // 0 = domingo, 6 = sábado
    if (diaSemana === 0 || diaSemana === 6) return false;
    if (isFeriado(data)) return false;
    return true;
}

function adicionarDiasUteis(dataInicial, dias) {
    let data = new Date(dataInicial);
    let diasAdicionados = 0;
    
    while (diasAdicionados < dias) {
        data.setDate(data.getDate() + 1);
        if (isDiaUtil(data)) {
            diasAdicionados++;
        }
    }
    
    data.setHours(0, 0, 0, 0);
    return data;
}

// ==========================================
// FORMATAR HORAS (10:17h)
// ==========================================
function formatarHoras(horasDecimais) {
    const horas = Math.floor(horasDecimais);
    const minutos = Math.round((horasDecimais - horas) * 60);
    return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}h`;
}

// ==========================================
// FORMATAR DATA SEM EMOJIS
// ==========================================
function formatarDataComDiaSemana(dataISO) {
    const partes = dataISO.split("-");
    const data = new Date(partes[0], partes[1] - 1, partes[2]);
    const diasSemana = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
    const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
    return `${diasSemana[data.getDay()]}, ${partes[2]}/${partes[1]}/${partes[0]}`;
}

function formatarDataExtenso(dataISO) {
    const partes = dataISO.split("-");
    const data = new Date(partes[0], partes[1] - 1, partes[2]);
    const diasSemana = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
    return `${partes[2]}/${partes[1]}/${partes[0]} - ${diasSemana[data.getDay()]}`;
}

function emergencyReset() {

function cadastrarSenha(){
    const novaSenha = document.getElementById("novaSenha").value;
    const confirmarSenha = document.getElementById("confirmarSenha").value;
    const email = document.getElementById("emailRecuperacao").value.trim();
    const telefone = document.getElementById("telefoneRecuperacao").value.trim();

    if(!novaSenha || !email) { alert("Chave e e-mail são obrigatórios."); return; }
    if(!validarEmail(email)) { alert("E-mail inválido."); return; }
    if(novaSenha.length < 6) { alert("Mínimo 6 caracteres."); return; }
    if(novaSenha !== confirmarSenha) { alert("Chaves não conferem."); return; }

    localStorage.setItem("senha_cache_control", codificarSenha(novaSenha));
    localStorage.setItem("email_cache_control", email);
    localStorage.setItem("telefone_cache_control", telefone);
    alert("✅ Credenciais registradas!");
    window.location.reload();
}

function login(){
    const senha = document.getElementById("senhaInput").value;
    const senhaSalva = localStorage.getItem("senha_cache_control");

    if(!senhaSalva){
        if(senha.length < 4) { alert("Mínimo 4 caracteres."); return; }
        localStorage.setItem("senha_cache_control", codificarSenha(senha));
        localStorage.setItem("email_cache_control", "suporte@faderlivre.com");
        document.getElementById("loginScreen").style.display = "none";
        initializeApp();
        return;
    }

    if(codificarSenha(senha) === senhaSalva){
        document.getElementById("loginScreen").style.display = "none";
        initializeApp();
    } else {
        alert("🚨 Chave Incorreta.");
    }

function executarBackupAutomatico() {
    if(!db) return;
    const txJ = db.transaction("jobs", "readonly");
    txJ.objectStore("jobs").getAll().onsuccess = function(e_jobs) {
        const txE = db.transaction("empresas", "readonly");
        txE.objectStore("empresas").getAll().onsuccess = function(e_empresas) {
            const payload = { jobs: e_jobs.target.result, empresas: e_empresas.target.result, dataBackup: new Date().toISOString() };
            localStorage.setItem("fader_livre_auto_backup", JSON.stringify(payload));
        };
    };
}

function fazerBackup(){
    const txJ = db.transaction("jobs", "readonly");
    txJ.objectStore("jobs").getAll().onsuccess = function(e_jobs) {
        const txE = db.transaction("empresas", "readonly");
        txE.objectStore("empresas").getAll().onsuccess = function(e_empresas) {
            const pacote = { jobs: e_jobs.target.result, empresas: e_empresas.target.result, exportadoEm: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(pacote, null, 2)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `fader_livre_backup_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            mostrarToast("✅ Backup local gerado!");
        };
    };
}

function backupNuvem() {
    if(!db) { alert("Banco de dados não disponível."); return; }
    
    const txJ = db.transaction("jobs", "readonly");
    txJ.objectStore("jobs").getAll().onsuccess = function(e_jobs) {
        const txE = db.transaction("empresas", "readonly");
        txE.objectStore("empresas").getAll().onsuccess = function(e_empresas) {
            const dados = {
                jobs: e_jobs.target.result,
                empresas: e_empresas.target.result,
                dispositivo: navigator.userAgent,
                timestamp: new Date().toISOString()
            };
            
            // Salva no localStorage como "nuvem simulada"
            const backupsNuvem = JSON.parse(localStorage.getItem('fader_backups_nuvem') || '[]');
            backupsNuvem.push(dados);
            if (backupsNuvem.length > 5) backupsNuvem.shift(); // Mantém só os 5 últimos
            localStorage.setItem('fader_backups_nuvem', JSON.stringify(backupsNuvem));
            
            mostrarToast("☁️ Backup salvo na nuvem!");
            alert("✅ Backup enviado para a nuvem com sucesso!\n\nTotal de backups: " + backupsNuvem.length);
        };
    };
}

function restaurarNuvem() {
    const backupsNuvem = JSON.parse(localStorage.getItem('fader_backups_nuvem') || '[]');
    if (backupsNuvem.length === 0) {
        alert("Nenhum backup na nuvem encontrado.");
        return;
    }
    
    const ultimo = backupsNuvem[backupsNuvem.length - 1];
    if (!confirm(`Restaurar backup de ${new Date(ultimo.timestamp).toLocaleString('pt-BR')}?`)) return;
    
    const txClearJ = db.transaction("jobs", "readwrite");
    txClearJ.objectStore("jobs").clear().onsuccess = () => {
        const txJ = db.transaction("jobs", "readwrite");
        ultimo.jobs.forEach(item => txJ.objectStore("jobs").put(item));
        txJ.oncomplete = function() {
            const txClearE = db.transaction("empresas", "readwrite");
            txClearE.objectStore("empresas").clear().onsuccess = () => {
                const txE = db.transaction("empresas", "readwrite");
                ultimo.empresas.forEach(item => txE.objectStore("empresas").put(item));
                txE.oncomplete = function() {
                    alert("✅ Backup restaurado da nuvem!");
                    window.location.reload();
                };
            };
        };
    };
}

document.getElementById("restoreFile").addEventListener("change", function(event){
    const arquivo = event.target.files[0];
    if(!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = function(){
        try {
            const dados = JSON.parse(leitor.result);
            if(dados.jobs && dados.empresas) {
                const txClearJ = db.transaction("jobs", "readwrite");
                txClearJ.objectStore("jobs").clear().onsuccess = () => {
                    const txJ = db.transaction("jobs", "readwrite");
                    dados.jobs.forEach(item => txJ.objectStore("jobs").put(item));
                    txJ.oncomplete = function() {
                        const txClearE = db.transaction("empresas", "readwrite");
                        txClearE.objectStore("empresas").clear().onsuccess = () => {
                            const txE = db.transaction("empresas", "readwrite");
                            dados.empresas.forEach(item => txE.objectStore("empresas").put(item));
                            txE.oncomplete = function() {
                                alert("✅ Banco restaurado!");
                                window.location.reload();
                            };
                        };
                    };
                };
            }
        } catch(err) { alert("Arquivo inválido."); }
    };
    leitor.readAsText(arquivo);
});

function gerenciarAutocomplete(textoBusca) {

    const tx = db.transaction("empresas", "readonly");

function salvarEmpresa() {
    const nome = document.getElementById("cadNomeEmpresa").value.trim();
    const idExistente = document.getElementById("cadIdEmpresa").value;
    if(!nome) { alert("Nome da empresa é obrigatório."); return; }

    const txVerif = db.transaction("empresas", "readonly");
    txVerif.objectStore("empresas").getAll().onsuccess = function(ev) {
        const existentes = ev.target.result;
        const duplicado = existentes.find(e => 
            e.nome.toLowerCase().trim() === nome.toLowerCase().trim() && 
            (!idExistente || e.id !== parseInt(idExistente))
        );
        if (duplicado) { alert("Empresa já cadastrada."); return; }

        const tipo = document.getElementById("cadTipoPagamento").value;
        const payload = {
            nome: nome,
            cacheBase: parseFloat(document.getElementById("cadCacheBase").value || 0),
            diaria: parseFloat(document.getElementById("cadDiaria").value || 0),
            tipoPagamento: tipo,
            diasPagamento: parseInt(document.getElementById("cadDiasPagamento").value || 0),
            nfPercentual: parseFloat(document.getElementById("cadNfPercentual").value || 0)
        };

        // NOVO: Sistema de período melhorado
        if (tipo === "Semanal") {
            payload.inicioSemana = parseInt(document.getElementById("cadInicioSemana").value);
            payload.fimSemana = parseInt(document.getElementById("cadFimSemana").value);
        } else if (tipo === "Quinzenal") {
            payload.inicioCiclo1 = parseInt(document.getElementById("cadInicioCiclo1").value) || 11;
            payload.fimCiclo1 = parseInt(document.getElementById("cadFimCiclo1").value) || 25;
            payload.inicioCiclo2 = parseInt(document.getElementById("cadInicioCiclo2").value) || 26;
            payload.fimCiclo2 = parseInt(document.getElementById("cadFimCiclo2").value) || 10;
        } else {
            payload.fimPeriodo = parseInt(document.getElementById("cadFimPeriodo").value) || 30;
        }

        if(idExistente) payload.id = parseInt(idExistente);

        const tx = db.transaction("empresas", "readwrite");
        const req = idExistente ? tx.objectStore("empresas").put(payload) : tx.objectStore("empresas").add(payload);
        req.onsuccess = function() {
            alert("✅ Empresa salva!");
            executarBackupAutomatico();
            limparCamposEmpresa();
            atualizarListaEmpresas();
        };
    };
}

function carregarEmpresaParaEdicao(id) {
    const tx = db.transaction("empresas", "readonly");
    tx.objectStore("empresas").get(id).onsuccess = function(e) {
        const d = e.target.result;
        if(!d) return;
        document.getElementById("formEmpresaTitle").innerHTML = "Editando: " + d.nome;
        document.getElementById("cadIdEmpresa").value = d.id;
        document.getElementById("cadNomeEmpresa").value = d.nome;
        document.getElementById("cadCacheBase").value = d.cacheBase;
        document.getElementById("cadDiaria").value = d.diaria;
        document.getElementById("cadTipoPagamento").value = d.tipoPagamento;
        document.getElementById("cadDiasPagamento").value = d.diasPagamento || 0;
        document.getElementById("cadNfPercentual").value = d.nfPercentual || 0;
        document.getElementById("cadInicioCiclo1").value = d.inicioCiclo1 || 11;
        document.getElementById("cadFimCiclo1").value = d.fimCiclo1 || 25;
        document.getElementById("cadInicioCiclo2").value = d.inicioCiclo2 || 26;
        document.getElementById("cadFimCiclo2").value = d.fimCiclo2 || 10;
        document.getElementById("cadFimPeriodo").value = d.fimPeriodo || 30;
        document.getElementById("cadInicioSemana").value = d.inicioSemana || 1;
        document.getElementById("cadFimSemana").value = d.fimSemana || 0;
        alterarPeriodoPagamentoCadastro();
        
        // CORRIGIDO: Scroll até o formulário de edição
        document.getElementById("formEmpresaTitle").scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
}

function deletarEmpresa(id) {
    if(confirm("Remover permanentemente esta empresa?")) {
        db.transaction("empresas", "readwrite").objectStore("empresas").delete(id).onsuccess = () => {
            executarBackupAutomatico();
            atualizarListaEmpresas();
        };
    }
}

function atualizarListaEmpresas() {
    if(!db) return;
    const container = document.getElementById("listaEmpresasCadastradas");
    container.innerHTML = "";
    db.transaction("empresas", "readonly").objectStore("empresas").getAll().onsuccess = function(e) {
        const colecao = e.target.result;
        if(colecao.length === 0) {
            container.innerHTML = "<p style='color:var(--muted); padding:10px;'>Nenhuma empresa cadastrada.</p>";
            return;
        }
        colecao.forEach(emp => {
            const card = document.createElement("div");
            card.style = "background:var(--card); padding:15px; border-radius:20px; margin-bottom:10px; border:1px solid var(--border-color); position:relative;";
            
            let descCiclo = emp.tipoPagamento;
            if (emp.tipoPagamento === "Quinzenal") {
                descCiclo = `Quinzenal (${emp.inicioCiclo1||11} a ${emp.fimCiclo1||25} / ${emp.inicioCiclo2||26} a ${emp.fimCiclo2||10})`;
            }
            
            card.innerHTML = `
                <div class="empresa-title">${emp.nome}</div>
                <div class="meta-text">Cache: <b>R$ ${emp.cacheBase.toFixed(2)}</b> | Diaria: <b>R$ ${emp.diaria.toFixed(2)}</b></div>
                <div class="meta-text">Ciclo: <b>${descCiclo}</b> | NF: <b>${emp.nfPercentual}%</b></div>
                <button class="btn-edit-inline" onclick="carregarEmpresaParaEdicao(${emp.id})" title="Editar">
                    <svg class="icon-btn"><use href="#icon-edit"/></svg>
                </button>
                <button class="btn-del" onclick="deletarEmpresa(${emp.id})" title="Excluir">
                    <svg class="icon-btn"><use href="#icon-trash"/></svg>
                </button>
            `;
            container.appendChild(card);
        });
    };
}

// ==========================================
// CÁLCULO DE DATAS (DIAS ÚTEIS)
// ==========================================
function obterStatusPeriodo(job) {
    if (job.statusManual === "pago") return "pago";
    let dataAtual = new Date(); dataAtual.setHours(0,0,0,0);
    let dataFechamento = calcularDataFechamentoReal(job);
    let dataLiquidacao = adicionarDiasUteis(dataFechamento, job.diasPagamento);
    if (dataAtual > dataLiquidacao) return "pago";
    if (dataAtual > dataFechamento) return "arquivado";
    return "aberto";
}

function calcularDataFechamentoReal(job) {
    let objData = new Date(job.data + "T00:00:00");
    let objFechamento = new Date(objData);
    
    if (job.tipoPagamento === "Semanal") {
        let diaCorte = parseInt(job.fimSemana !== undefined ? job.fimSemana : 0);
        let diaJob = objData.getDay();
        let diasRestantes = (diaCorte - diaJob + 7) % 7;
        if (diasRestantes === 0) diasRestantes = 7;
        objFechamento.setDate(objData.getDate() + diasRestantes);
    } else if (job.tipoPagamento === "Quinzenal") {
        let dia = objData.getDate();
        let mes = objData.getMonth();
        let ano = objData.getFullYear();
        let ultimoDia = new Date(ano, mes + 1, 0).getDate();
        
        let c1i = parseInt(job.inicioCiclo1 || 11);
        let c1f = Math.min(parseInt(job.fimCiclo1 || 25), ultimoDia);
        let c2i = Math.min(parseInt(job.inicioCiclo2 || 26), ultimoDia);
        let c2f = Math.min(parseInt(job.fimCiclo2 || 10), ultimoDia);
        
        if (dia >= c1i && dia <= c1f) {
            objFechamento = new Date(ano, mes, c1f);
        } else if (dia >= c2i && dia <= c2f) {
            objFechamento = new Date(ano, mes, c2f);
        } else if (dia < c1i) {
            objFechamento = new Date(ano, mes, c1f);
        } else {
            objFechamento = new Date(ano, mes + 1, Math.min(c1f, new Date(ano, mes + 2, 0).getDate()));
        }
    } else {
        let dia = objData.getDate();
        let pFim = Math.min(parseInt(job.fimPeriodo || 30), new Date(objData.getFullYear(), objData.getMonth() + 1, 0).getDate());
        if (dia <= pFim) {
            objFechamento = new Date(objData.getFullYear(), objData.getMonth(), pFim);
        } else {
            objFechamento = new Date(objData.getFullYear(), objData.getMonth() + 1, Math.min(pFim, new Date(objData.getFullYear(), objData.getMonth() + 2, 0).getDate()));
        }
    }
    objFechamento.setHours(0,0,0,0);
    return objFechamento;
}

function calcularPrevisaoPagamento(job) {
    const dataFechamento = calcularDataFechamentoReal(job);
    return adicionarDiasUteis(dataFechamento, job.diasPagamento);
}

function checkAndRequestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
}

function verificarPagamentosHoje() {
    if (!db || Notification.permission !== "granted") return;
    const hoje = new Date();
    if (hoje.getHours() < 9) return;
    hoje.setHours(0,0,0,0);
    
    const tx = db.transaction("jobs", "readonly");
    tx.objectStore("jobs").getAll().onsuccess = function(event) {
        let totalHoje = 0;
        let notificados = JSON.parse(localStorage.getItem('notificados_hoje') || '{}');
        const hojeStr = new Date().toISOString().split('T')[0];
        
        event.target.result.forEach(job => {
            if (job.statusManual === "pago") return;
            const dataPag = calcularPrevisaoPagamento(job);
            if (dataPag.getTime() === hoje.getTime() && !notificados[job.id]) {
                totalHoje += job.total;
                notificados[job.id] = hojeStr;
            }
        });
        
        if (totalHoje > 0) {
            localStorage.setItem('notificados_hoje', JSON.stringify(notificados));
            if (Notification.permission === "granted") {
                new Notification("Pagamentos Hoje!", { body: `Total: ${formatarValor(totalHoje)}` });
            }
            mostrarToast(`Pagamentos previstos para hoje! Total: ${formatarValor(totalHoje)}`);
        }
    };
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') verificarPagamentosHoje();
});

// ==========================================
// CRUD JOBS
// ==========================================
function salvarJob(){
    const dataInput = document.getElementById("dataJob").value;
    const inputNomeEmpresa = document.getElementById("empresaJob").value.trim();
    const idEdicao = document.getElementById("editJobId").value;
    if(!dataInput || !inputNomeEmpresa) { alert("Data e Empresa são obrigatórios."); return; }

    const txEmp = db.transaction("empresas", "readonly");
    txEmp.objectStore("empresas").getAll().onsuccess = function(event) {
        const emp = event.target.result.find(e => e.nome.toLowerCase() === inputNomeEmpresa.toLowerCase());
        if(!emp) { alert("Empresa não encontrada."); return; }

        const BASE_HOURS = 12;
        const cacheBase = parseFloat(emp.cacheBase || 0);
        const diaria = parseFloat(emp.diaria || 0);
        const nfPerc = parseFloat(emp.nfPercentual || 0);

        const arrI = document.getElementById("inicio").value.split(":");
        const arrF = document.getElementById("fim").value.split(":");
        let difMin = (parseInt(arrF[0])*60 + parseInt(arrF[1])) - (parseInt(arrI[0])*60 + parseInt(arrI[1]));
        if(difMin < 0) difMin += 1440;
        
        const tHoras = difMin / 60;
        const vExtras = Math.max(0, tHoras - BASE_HOURS);
        const rExtras = vExtras * (cacheBase / BASE_HOURS);
        const fBruto = cacheBase + diaria + rExtras;
        const imposto = fBruto * (nfPerc / 100);

        const jobTemp = {
            data: dataInput,
            tipoPagamento: emp.tipoPagamento,
            diasPagamento: parseInt(emp.diasPagamento || 0),
            fimPeriodo: parseInt(emp.fimPeriodo || 30),
            inicioSemana: parseInt(emp.inicioSemana || 1),
            fimSemana: parseInt(emp.fimSemana || 0),
            inicioCiclo1: parseInt(emp.inicioCiclo1 || 11),
            fimCiclo1: parseInt(emp.fimCiclo1 || 25),
            inicioCiclo2: parseInt(emp.inicioCiclo2 || 26),
            fimCiclo2: parseInt(emp.fimCiclo2 || 10)
        };
        
        const dataPrev = calcularPrevisaoPagamento(jobTemp);
        const previsao = formatarDataExtenso(dataPrev.toISOString().split('T')[0]);

        const payloadJob = {
            data: dataInput, empresa: emp.nome,
            job: document.getElementById("nomeJob").value || "Job Operacional",
            cache: cacheBase, diaria: diaria, extra: rExtras, total: fBruto, valorNF: imposto,
            horas: tHoras, inicio: document.getElementById("inicio").value, fim: document.getElementById("fim").value,
            tipoPagamento: emp.tipoPagamento, diasPagamento: parseInt(emp.diasPagamento || 0),
            fimPeriodo: parseInt(emp.fimPeriodo || 30),
            inicioSemana: parseInt(emp.inicioSemana || 1), fimSemana: parseInt(emp.fimSemana || 0),
            inicioCiclo1: parseInt(emp.inicioCiclo1 || 11), fimCiclo1: parseInt(emp.fimCiclo1 || 25),
            inicioCiclo2: parseInt(emp.inicioCiclo2 || 26), fimCiclo2: parseInt(emp.fimCiclo2 || 10),
            previsaoPagamento: previsao,
            statusManual: idEdicao ? editStatusManual : null
        };
        if(idEdicao) payloadJob.id = parseInt(idEdicao);

        const txG = db.transaction("jobs", "readwrite");
        const req = idEdicao ? txG.objectStore("jobs").put(payloadJob) : txG.objectStore("jobs").add(payloadJob);
        req.onsuccess = function() {
            alert("✅ Lançamento salvo!");
            executarBackupAutomatico();
            atualizarTela();
            limparCampos();
        };
    };
}

function carregarJobParaEdicao(id) {
    db.transaction("jobs", "readonly").objectStore("jobs").get(id).onsuccess = function(event) {
        const item = event.target.result;
        if(!item) return;
        document.getElementById("formJobTitle").innerText = "Editando Lancamento";
        document.getElementById("editJobId").value = item.id;
        document.getElementById("empresaJob").value = item.empresa;
        document.getElementById("dataJob").value = item.data;
        document.getElementById("nomeJob").value = item.job;
        document.getElementById("inicio").value = item.inicio;
        document.getElementById("fim").value = item.fim;
        editStatusManual = item.statusManual || null;
        
        // CORRIGIDO: Scroll até o formulário de edição
        document.getElementById("formJobTitle").scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
}

function deletarJob(id) {
    if(confirm("Excluir definitivamente este lancamento?")) {
        db.transaction("jobs", "readwrite").objectStore("jobs").delete(id).onsuccess = () => {
            executarBackupAutomatico();
            atualizarTela();
        };
    }
}

function marcarComoPago(id) {
    if(confirm("Confirmar pagamento deste job?")) {
        db.transaction("jobs", "readwrite").objectStore("jobs").get(id).onsuccess = function(e) {
            const job = e.target.result;
            if (!job) return;
            job.statusManual = "pago";
            db.transaction("jobs", "readwrite").objectStore("jobs").put(job).onsuccess = () => {
                executarBackupAutomatico();
                atualizarTela();
                mostrarToast("✅ Job marcado como pago!");
            };
        };
    }
}

// CORRIGIDO: Função reabrir job
function reabrirJob(id) {
    if(confirm("Reabrir este job? Ele voltara para o status anterior.")) {
        db.transaction("jobs", "readwrite").objectStore("jobs").get(id).onsuccess = function(e) {
            const job = e.target.result;
            if (!job) return;
            job.statusManual = null; // Remove o status manual
            db.transaction("jobs", "readwrite").objectStore("jobs").put(job).onsuccess = () => {
                executarBackupAutomatico();
                atualizarTela();
                mostrarToast("✅ Job reaberto!");
            };
        };
    }
}

function limparCampos(){
    document.getElementById("formJobTitle").innerText = "Novo Job";
    document.getElementById("editJobId").value = "";
    document.getElementById("empresaJob").value = "";
    document.getElementById("nomeJob").value = "";
    document.getElementById("dataJob").value = new Date().toISOString().split('T')[0];
    document.getElementById("inicio").value = "08:00";
    document.getElementById("fim").value = "20:00";
    editStatusManual = null;
}

// ==========================================
// ATUALIZAÇÃO DA TELA
// ==========================================
function atualizarTela(){
    if(!db) return;
    const painel = document.getElementById("listaHistorico");
    painel.innerHTML = "";
    let tBruto = 0, tNF = 0, tHoras = 0;
    let dictGrafico = {};
    let dictMensal = {};

    const txE = db.transaction("empresas", "readonly");
    txE.objectStore("empresas").getAll().onsuccess = function(e_empresas) {
        const temNF = e_empresas.target.result.some(emp => emp.nfPercentual > 0);
        document.getElementById("dashboardNfCard").style.display = temNF ? 'block' : 'none';
        document.getElementById("dashboardLiquidoCard").style.display = temNF ? 'block' : 'none';

        const tx = db.transaction("jobs", "readonly");
        tx.objectStore("jobs").getAll().onsuccess = function(event) {
            // CORRIGIDO: Ordenado por data (mais recente primeiro)
            const matriz = event.target.result.sort((a, b) => new Date(b.data) - new Date(a.data));

            matriz.forEach(reg => {
                const status = obterStatusPeriodo(reg);
                
                if (status === "aberto") {
                    tBruto += reg.total || 0;
                    tNF += reg.valorNF || 0;
                    tHoras += parseFloat(reg.horas || 0);
                    dictGrafico[reg.empresa] = (dictGrafico[reg.empresa] || 0) + reg.total;
                }
                
                // Para gráfico mensal
                const mesAno = reg.data.substring(0, 7);
                dictMensal[mesAno] = (dictMensal[mesAno] || 0) + (reg.total || 0);

                if(!mapaCores[reg.empresa]) mapaCores[reg.empresa] = coresGrafico[Object.keys(mapaCores).length % coresGrafico.length];

                let check = (filtroVisualizacao === "aberto" && status === "aberto") || 
                           (filtroVisualizacao === "arquivado" && (status === "arquivado" || status === "pago"));

                if (check) {
                    const card = document.createElement("div");
                    card.className = "history-card";
                    card.style.borderLeft = "6px solid " + mapaCores[reg.empresa];

                    let badge = status === "aberto" ? '<span class="badge-status status-aberto">Aberto</span>' :
                                (status === "arquivado" ? '<span class="badge-status status-fechado">Aguardando</span>' :
                                '<span class="badge-status status-pago">Quitado</span>');

                    // CORRIGIDO: Sem emojis nas datas
                    let dFmt = formatarDataComDiaSemana(reg.data);
                    let horasFmt = formatarHoras(reg.horas);

                    card.innerHTML = `
                        <button class="btn-del" onclick="deletarJob(${reg.id})" title="Excluir">
                            <svg class="icon-btn"><use href="#icon-trash"/></svg>
                        </button>
                        <button class="btn-edit-inline" onclick="carregarJobParaEdicao(${reg.id})" title="Editar">
                            <svg class="icon-btn"><use href="#icon-edit"/></svg>
                        </button>
                        ${status === 'pago' ? 
                            `<button class="btn-reopen" onclick="reabrirJob(${reg.id})">Reabrir</button>` :
                            `<button class="btn-paid" onclick="marcarComoPago(${reg.id})">Marcar Pago</button>`
                        }
                        <div class="empresa-title">${reg.empresa}</div>
                        <div class="meta-text">Data: ${dFmt}</div>
                        <div class="meta-text">Job: ${reg.job}</div>
                        <div>${badge}</div>
                        <div class="meta-text" style="margin-top:8px;">Horarios: ${reg.inicio} as ${reg.fim} (${horasFmt})</div>
                        <div class="meta-text">Cache: ${formatarValor(reg.cache)}</div>
                        <div class="meta-text">Alimentacao: ${formatarValor(reg.diaria)}</div>
                        <div class="meta-text">Hora Extra: ${formatarValor(reg.extra)}</div>
                        <div class="meta-text">Previsao: <b>${reg.previsaoPagamento}</b></div>
                        <div style="margin-top:10px; font-weight:900;">Total Bruto: <span>${formatarValor(reg.total)}</span></div>
                    `;
                    painel.appendChild(card);
                }
            });

            document.getElementById("vTotalSemana").innerText = formatarValor(tBruto);
            document.getElementById("vTotalNF").innerText = "- " + formatarValor(tNF);
            document.getElementById("vTotalLiquido").innerText = formatarValor(tBruto - tNF);
            document.getElementById("vTotalHoras").innerText = formatarHoras(tHoras);

            renderGrafico(dictGrafico);
            renderGraficoMensal(dictMensal);

            if(document.getElementById("searchBox").style.display === "block") filtrarTabela();
        };
    };
}

// ==========================================
// GRÁFICOS
// ==========================================
function renderGrafico(dict){
    const ctx = document.getElementById("graficoEmpresas");
    if(!ctx) return;
    const labels = Object.keys(dict), values = Object.values(dict);
    const colors = labels.map(lbl => mapaCores[lbl] || '#38bdf8');

    if(window.chartInstance) {
        window.chartInstance.data.labels = labels;
        window.chartInstance.data.datasets[0].data = values;
        window.chartInstance.data.datasets[0].backgroundColor = colors;
        window.chartInstance.update();
    } else {
        if(labels.length === 0) return;
        window.chartInstance = new Chart(ctx, {
            type: "bar",
            data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 8, label: 'Faturamento por Empresa' }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { display: false }, x: { ticks: { color: "#94a3b8" } } }
            }
        });
    }
}

// NOVO: Gráfico mensal
function renderGraficoMensal(dict){
    const ctx = document.getElementById("graficoMensal");
    if(!ctx) return;
    
    const mesesOrdenados = Object.keys(dict).sort();
    const labels = mesesOrdenados.map(m => {
        const [ano, mes] = m.split('-');
        const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        return nomes[parseInt(mes)-1] + '/' + ano;
    });
    const values = mesesOrdenados.map(m => dict[m]);
    
    if(window.chartMensal) {
        window.chartMensal.data.labels = labels;
        window.chartMensal.data.datasets[0].data = values;
        window.chartMensal.update();
    } else {
        if(labels.length === 0) return;
        window.chartMensal = new Chart(ctx, {
            type: "line",
            data: { labels: labels, datasets: [{ data: values, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4, pointRadius: 5 }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { display: false }, x: { ticks: { color: "#94a3b8" } } }
            }
        });
    }
}

function abrirBusca(){ document.getElementById("searchBox").style.display = "block"; }
function limparBusca(){ document.getElementById("inputBusca").value = ""; document.getElementById("searchBox").style.display = "none"; filtrarTabela(); }
function filtrarTabela(){
    const termo = document.getElementById("inputBusca").value.toUpperCase().trim();
    document.querySelectorAll(".history-card").forEach(card => {
        card.style.display = card.innerText.toUpperCase().includes(termo) ? "block" : "none";
    });
}

// ==========================================
// WHATSAPP (FORMATO CORRIGIDO)
// ==========================================
function enviarRelatorioWhatsApp(){
    const tx = db.transaction("jobs", "readonly");
    tx.objectStore("jobs").getAll().onsuccess = function(event) {
        const termo = document.getElementById("inputBusca").value.toUpperCase().trim();
        const buscaAtiva = document.getElementById("searchBox").style.display === "block" && termo !== "";

        const filtrados = event.target.result.filter(job => {
            const status = obterStatusPeriodo(job);
            if (filtroVisualizacao === "aberto" && status !== "aberto") return false;
            if (filtroVisualizacao === "arquivado" && status === "aberto") return false;
            if (buscaAtiva) {
                const texto = `${job.empresa} ${job.job} ${job.data.split("-").reverse().join("/")}`.toUpperCase();
                return texto.includes(termo);
            }
            return true;
        }).sort((a, b) => new Date(b.data) - new Date(a.data));

        if(filtrados.length === 0) { alert("Nenhum registro encontrado."); return; }

        let msg = "FADER LIVRE - EXTRATO CACHE CONTROL\n";
        msg += "======================================\n\n";
        let totalCache = 0, totalDiaria = 0, totalExtra = 0, totalGeral = 0;

        filtrados.forEach(j => {
            msg += `Empresa: ${j.empresa}\n`;
            msg += `Data: ${formatarDataExtenso(j.data)}\n`;
            msg += `Job: ${j.job}\n`;
            msg += `Horarios: ${j.inicio}h as ${j.fim}h\n`;
            msg += `Cache: ${formatarValor(j.cache)}\n`;
            if (j.extra > 0) msg += `Horas Extras: ${formatarValor(j.extra)}\n`;
            msg += `Diaria/Logistica: ${formatarValor(j.diaria)}\n`;
            msg += `Total: ${formatarValor(j.total)}\n`;
            msg += `Previsao de pagamento: ${j.previsaoPagamento}\n\n`;
            totalCache += j.cache||0;
            totalDiaria += j.diaria||0;
            totalExtra += j.extra||0;
            totalGeral += j.total||0;
        });

        msg += "======================================\n";
        msg += `Total geral: ${formatarValor(totalGeral)}\n`;
        msg += `Emitido: ${new Date().toLocaleDateString("pt-BR")}`;

        window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg), "_blank");
    };
}

// ==========================================
// EXCEL (DETALHADO)
// ==========================================
function baixarExcelCompleto(){
    const tx = db.transaction("jobs", "readonly");
    tx.objectStore("jobs").getAll().onsuccess = function(event) {
        const ordenados = event.target.result.sort((a, b) => new Date(b.data) - new Date(a.data));
        let csv = "ID;Data;Empresa;Job;Cache;Alimentacao;Hora_Extra;Total_Bruto;Imposto_NF;Valor_Liquido;Horas;Previsao_Pagamento\n";
        ordenados.forEach(i => {
            const liquido = i.total - i.valorNF;
            const horasFmt = formatarHoras(i.horas);
            csv += `${i.id};${i.data};${i.empresa};${i.job};`;
            csv += `R$ ${(i.cache||0).toFixed(2)};R$ ${(i.diaria||0).toFixed(2)};R$ ${(i.extra||0).toFixed(2)};`;
            csv += `R$ ${(i.total||0).toFixed(2)};R$ ${(i.valorNF||0).toFixed(2)};R$ ${liquido.toFixed(2)};`;
            csv += `${horasFmt};${i.previsaoPagamento}\n`;
        });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `fader_livre_faturamento_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
        mostrarToast("✅ Planilha exportada!");
    };
}
