<!-- ADICIONE ESTE BLOCO logo abaixo do campo "Tipo de Pagamento" -->

<div id="periodoPersonalizado" style="display:none;">

    <div style="
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;">

        <div>

            <label>Início do Período</label>

            <input type="number"
            id="inicioPeriodo"
            min="1"
            max="31"
            placeholder="Ex: 5">

        </div>

        <div>

            <label>Fim do Período</label>

            <input type="number"
            id="fimPeriodo"
            min="1"
            max="31"
            placeholder="Ex: 20">

        </div>

    </div>

</div>
