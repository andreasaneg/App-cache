<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FADER LIVRE - CACHÊ CONTROL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{

--primary:#10b981;
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--danger:#ef4444;
--muted:#94a3b8;
--blue:#38bdf8;

}

*{

box-sizing:border-box;

}

body{

margin:0;
padding:15px;
padding-bottom:60px;

background:var(--bg);

color:var(--text);

font-family:Arial, Helvetica, sans-serif;

}

.header{

text-align:center;

border-bottom:2px solid var(--primary);

padding-bottom:15px;

margin-bottom:20px;

}

.header img{

width:140px;
height:140px;

border-radius:18px;

border:2px solid var(--primary);

object-fit:cover;

}

.dashboard{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

margin-bottom:20px;

}

.dashboard-card{

background:var(--card);

border-radius:18px;

padding:20px;

border:1px solid #334155;

position:relative;

}

.dashboard-title{

font-size:.8em;

text-transform:uppercase;

margin-bottom:10px;

letter-spacing:1px;

}

.total-geral{

font-size:2em;

font-weight:bold;

color:var(--blue);

}

.total-nf{

font-size:2em;

font-weight:bold;

color:var(--danger);

}

.total-horas{

font-size:2em;

font-weight:bold;

color:var(--primary);

}

.eye-button{

position:absolute;

top:15px;
right:15px;

width:60px;
height:60px;

border:none;

border-radius:18px;

background:#334155;

color:white;

font-size:1.8em;

cursor:pointer;

transition:.2s;

}

.eye-button:hover{

transform:scale(1.08);

}

.input-group{

background:var(--card);

border:1px solid #334155;

border-radius:16px;

padding:16px;

margin-bottom:15px;

position: relative;

}

label{

display:block;

margin-bottom:5px;

color:var(--muted);

font-size:0.75em;

text-transform:uppercase;

}

input,
select{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #334155;

background:#0f172a;

color:white;

margin-bottom:12px;

font-size:16px;

}

.btn{

width:100%;

border:none;

padding:16px;

border-radius:14px;

font-weight:bold;

cursor:pointer;

margin-bottom:10px;

font-size:1em;

transition:.2s;

}

.btn:hover{

transform:translateY(-2px);

}

.btn-save{

background:var(--primary);

color:#000;

}

.btn-export{

background:#475569;

color:white;

}

.btn-whats{

background:#25D366;

color:#000;

}

.btn-search{

background:#0ea5e9;

color:white;

}

.history-card{

background:var(--card);

border-radius:16px;

padding:18px;

margin-bottom:15px;

position:relative;

border-left:6px solid var(--primary);

}

.empresa-title{

font-size:1.3em;

font-weight:bold;

margin-bottom:10px;

}

.extra-box{

margin-top:10px;

padding:10px;

border-radius:10px;

background:#082f49;

color:#38bdf8;

font-weight:bold;

}

.btn-del{

position:absolute;

top:10px;
right:12px;

background:none;

border:none;

color:var(--danger);

font-size:1.5em;

cursor:pointer;

z-index: 10;

}

.btn-edit-inline{

position:absolute;

top:10px;
right:50px;

background:none;

border:none;

color:var(--blue);

font-size:1.3em;

cursor:pointer;

z-index: 10;

}

.chart-container{

height:320px;

margin-top:20px;

}

.search-box{

display:none;

margin-bottom:15px;

}

.empresa-group{

margin-bottom:30px;

}

.section-title{

font-size:1.3em;

font-weight:bold;

margin:25px 0 15px;

}

.tab-container {

display: flex;

gap: 10px;

margin-bottom: 20px;

}

.tab-button {

flex: 1;

padding: 12px;

background: var(--card);

color: var(--text);

border: 1px solid #334155;

border-radius: 10px;

cursor: pointer;

font-weight: bold;

}

.tab-button.active {

background: var(--primary);

color: #000;

}

.app-section {

display: none;

}

.app-section.active {

display: block;

}

.autocomplete-list {

position: absolute;

z-index: 100;

background: #1e293b;

border: 1px solid #334155;

border-radius: 10px;

width: calc(100% - 32px);

max-height: 200px;

overflow-y: auto;

margin-top: -10px;

margin-bottom: 15px;

box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);

}

.autocomplete-item {

padding: 12px;

cursor: pointer;

border-bottom: 1px solid #334155;

}

.autocomplete-item:hover {

background: #0f172a;

color: var(--primary);

}

.badge-status {

display: inline-block;

padding: 4px 8px;

border-radius: 6px;

font-size: 0.75em;

font-weight: bold;

text-transform: uppercase;

margin-top: 5px;

}

.status-aberto {

background: #0284c7;

color: #fff;

}

.status-fechado {

background: #ea580c;

color: #fff;

}

.status-pago {

background: #16a34a;

color: #fff;

}

.toggle-filter-container {

display: flex;

gap: 10px;

margin-bottom: 15px;

}

.btn-filter {

flex: 1;

padding: 10px;

border-radius: 10px;

border: 1px solid #334155;

background: #0f172a;

color: #fff;

font-weight: bold;

cursor: pointer;

}

.btn-filter.active {

background: #475569;

border-color: var(--primary);

}

@media print{

.btn,
.search-box,
.btn-del,
.tab-container,
.toggle-filter-container{

display:none !important;

}

}

</style>

</head>

<body>
<div id="loginScreen"
style="
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;">

<div style="
background:#1e293b;
padding:30px;
border-radius:20px;
width:90%;
max-width:360px;">

<div style="text-align:center;">

<img
src="FaderLivreIcon.png"
style="
width:120px;
height:120px;
border-radius:20px;
border:2px solid #10b981;
object-fit:cover;
margin-bottom:20px;">

</div>

<h2 style="
text-align:center;
margin-bottom:20px;">

🔒 Login

</h2>

<input
type="password"
id="senhaInput"
placeholder="Digite sua senha">

<div
id="novaSenhaBox"
style="
display:none;
margin-top:10px;">

<input
type="password"
id="novaSenha"
placeholder="Nova senha">

<input
type="email"
id="emailRecuperacao"
placeholder="Email para recuperação">

<button
class="btn btn-save"
onclick="cadastrarSenha()">

SALVAR SENHA

</button>

</div>

<button
class="btn btn-save"
onclick="login()">

ENTRAR

</button>

<button
class="btn btn-search"
onclick="toggleCadastroSenha()">

CADASTRAR SENHA

</button>

<button
class="btn btn-export"
onclick="recuperarSenha()">

RESTAURAR SENHA

</button>

</div>

</div>

<div class="header">

<img src="FaderLivreIcon.png">

<h2>
Cachê Control
</h2>

</div>

<div class="tab-container">

<button class="tab-button active" onclick="alternarAba('abaJobs')">💼 Lançar Jobs</button>

<button class="tab-button" onclick="alternarAba('abaEmpresas')">🏢 Cadastrar Empresas</button>

</div>

<div id="abaJobs" class="app-section active">

<div class="dashboard">

<div class="dashboard-card">

<button
class="eye-button"
id="eyeButton"
onclick="toggleValores()">

👁️

</button>

<div class="dashboard-title"
style="color:var(--blue)">

TOTAL GERAL

</div>

<div id="vTotalSemana"
class="total-geral">

R$ 0,00

</div>

</div>

<div class="dashboard-card">

<div class="dashboard-title"
style="color:var(--danger)">

NOTA FISCAL

</div>

<div id="vTotalNF"
class="total-nf">

- R$ 0,00

</div>

</div>

<div class="dashboard-card">

<div class="dashboard-title"
style="color:var(--primary)">

HORAS TRABALHADAS

</div>

<div id="vTotalHoras"
class="total-horas">

0h

</div>

</div>

</div>

<div class="input-group">

<label>Empresa</label>

<input type="text"
id="empresaJob"
placeholder="Ex: FADER LIVRE"
autocomplete="off"
oninput="gerenciarAutocomplete(this.value)">

<div id="autocompleteContainer"></div>

<label>Data</label>

<input type="date"
id="dataJob">

<label>Nome do Job</label>

<input type="text"
id="nomeJob"
placeholder="Ex: Comercial">

<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

<div>

<label>Início</label>

<input type="time"
id="inicio"
value="08:00">

</div>

<div>

<label>Fim</label>

<input type="time"
id="fim"
value="20:00">

</div>

</div>

<button
class="btn btn-save"
onclick="salvarJob()">

💾 SALVAR JOB

</button>

<button
class="btn btn-export"
onclick="limparCampos()">

🧹 LIMPAR

</button>

</div>

<div class="input-group">

<h2 style="margin-bottom:15px;">

Financeiro (Período Atual)

</h2>

<div class="chart-container">

<canvas id="graficoEmpresas"></canvas>

</div>

</div>

<div class="input-group">

<div class="section-title">

Visualizar Histórico

</div>

<div class="toggle-filter-container">

<button id="btnFiltroAberto" class="btn-filter active" onclick="definirFiltroVisualizacao('aberto')">Período Aberto</button>

<button id="btnFiltroArquivado" class="btn-filter" onclick="definirFiltroVisualizacao('arquivado')">Arquivados</button>

</div>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

<button
class="btn btn-search"
onclick="abrirBusca()">

🔍 BUSCAR

</button>

<button
class="btn btn-export"
onclick="limparBusca()">

❌ LIMPAR BUSCA

</button>

</div>

<div
id="searchBox"
class="search-box">

<input
type="text"
id="inputBusca"
onkeyup="filtrarTabela()"
placeholder="Buscar empresa, job ou data...">

</div>

<div id="listaHistorico"></div>

</div>

</div>

<div id="abaEmpresas" class="app-section">

<div class="input-group">

<h2>🏢 Cadastro de Condições da Empresa</h2>

<input type="hidden" id="cadIdEmpresa" value="">

<label>Nome da Empresa</label>

<input type="text" id="cadNomeEmpresa" placeholder="Ex: FADER LIVRE">

<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

<div>

<label>Valor do Cachê Padrão</label>

<input type="number" id="cadCacheBase" placeholder="Ex: 500">

</div>

<div>

<label>Valor da Diária Padrão</label>

<input type="number" id="cadDiaria" placeholder="Ex: 100">

</div>

</div>

<label>Tipo de Pagamento</label>

<select id="cadTipoPagamento" onchange="alterarPeriodoPagamentoCadastro()">

<option value="Semanal">Semanal</option>

<option value="Quinzenal">Quinzenal</option>

<option value="Mensal">Mensal</option>

</select>

<div id="cadPeriodoPersonalizado" style="display:none;">

<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

<div>

<label>Início do período (Dia do mês)</label>

<input type="number" id="cadInicioPeriodo" min="1" max="31" value="1">

</div>

<div>

<label>Fim do período (Dia do mês)</label>

<input type="number" id="cadFimPeriodo" min="1" max="31" value="15">

</div>

</div>

</div>

<div id="cadPeriodoSemanalBox" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">

<div>

<label>Dia Início Semana</label>

<select id="cadInicioSemana">

<option value="1">Segunda-feira</option>

<option value="2">Terça-feira</option>

<option value="3">Quarta-feira</option>

<option value="4">Quinta-feira</option>

<option value="5">Sexta-feira</option>

<option value="6">Sábado</option>

<option value="0">Domingo</option>

</select>

</div>

<div>

<label>Dia Fim Semana</label>

<select id="cadFimSemana">

<option value="0" selected>Domingo</option>

<option value="1">Segunda-feira</option>

<option value="2">Terça-feira</option>

<option value="3">Quarta-feira</option>

<option value="4">Quinta-feira</option>

<option value="5">Sexta-feira</option>

<option value="6">Sábado</option>

</select>

</div>

</div>

<label>Dias após o fechamento para Pagamento</label>

<input type="number" id="cadDiasPagamento" value="5">

<label>NF (%) padrão</label>

<input type="number" id="cadNfPercentual" value="0">

<button class="btn btn-save" onclick="salvarEmpresa()">💾 SALVAR CONFIGURAÇÃO</button>

</div>

<div class="input-group">

<h3>🏢 Empresas Cadastradas e Prazos</h3>

<div id="listaEmpresasCadastradas"></div>

</div>

</div>

<div class="input-group">

<h2>

Exportações e Backup

</h2>

<button
class="btn btn-whats"
onclick="enviarRelatorioWhatsApp()">

WHATSAPP

</button>

<button
class="btn btn-export"
onclick="baixarExcelCompleto()">

EXPORTAR CSV

</button>

<button
class="btn btn-export"
onclick="fazerBackup()">

BACKUP

</button>

<button
class="btn btn-export"
onclick="document.getElementById('restoreFile').click()">

RESTAURAR BACKUP

</button>

<input
type="file"
id="restoreFile"
accept=".json"
style="display:none;">

</div>

<script>

let db;
let ocultarValores = false;
let filtroVisualizacao = "aberto"; 
let mapaCores = {};
let empresaSelecionadaCache = null; 

let coresGrafico = [
'#38bdf8','#10b981','#f59e0b','#ef4444',
'#8b5cf6','#ec4899','#14b8a6','#f97316'
];

let senhaSalva = localStorage.getItem("senha_cache_control");
let emailRecuperacao = localStorage.getItem("email_cache_control");

if(!senhaSalva){
document.getElementById("senhaInput").placeholder =
"Defina sua senha (primeiro acesso)";
}

function toggleCadastroSenha(){

const box =
document.getElementById("novaSenhaBox");

box.style.display =
box.style.display === "none" ? "block" : "none";

}

function cadastrarSenha(){

const novaSenha =
document.getElementById("novaSenha").value;

const email =
document.getElementById("emailRecuperacao").value;

if(!novaSenha || !email){
alert("Preencha senha e email");
return;
}

localStorage.setItem("senha_cache_control", novaSenha);
localStorage.setItem("email_cache_control", email);

alert("Senha cadastrada com sucesso");
document.getElementById("novaSenhaBox").style.display="none";

}

function login(){

const senha =
document.getElementById("senhaInput").value;

if(!senhaSalva){

localStorage.setItem("senha_cache_control", senha);
document.getElementById("loginScreen").style.display="none";
return;

}

if(senha === senhaSalva){
document.getElementById("loginScreen").style.display="none";
}else{
alert("Senha incorreta");
}

}

function recuperarSenha(){

const email = localStorage.getItem("email_cache_control");

if(!email){
alert("Nenhum email cadastrado");
return;
}

alert("Senha enviada para: " + email);

}

const request = indexedDB.open("CacheFinal_V33",2);

request.onupgradeneeded = e=>{
let d = e.target.result;
if(!d.objectStoreNames.contains("jobs")){
d.createObjectStore("jobs",{keyPath:"id",autoIncrement:true});
}
if(!d.objectStoreNames.contains("empresas")){
d.createObjectStore("empresas",{keyPath:"id",autoIncrement:true});
}
};

request.onsuccess = e=>{
db = e.target.result;
atualizarTela();
atualizarListaEmpresas();
};

function toggleValores(){

ocultarValores = !ocultarValores;

document.getElementById("eyeButton").innerHTML =
ocultarValores ? "🙈" : "👁️";

atualizarTela();

}

function formatarValor(v){

if(ocultarValores) return "R$ •••••";

return Number(v).toLocaleString("pt-BR",{
style:"currency",currency:"BRL"
});

}

/* ================= BACKUP ================= */

function fazerBackup(){

db.transaction("jobs").objectStore("jobs").getAll().onsuccess = e=>{

const data = e.target.result;

const blob = new Blob([JSON.stringify(data,null,2)],{
type:"application/json"
});

const nome = "cache_control_backup_" +
new Date().toISOString().split("T")[0] + ".json";

const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = nome;
a.click();

};

}

document.getElementById("restoreFile").addEventListener("change",function(e){

const file = e.target.files[0];

const reader = new FileReader();

reader.onload = function(){

const data = JSON.parse(reader.result);

const tx = db.transaction("jobs","readwrite");
const store = tx.objectStore("jobs");

data.forEach(item=>{
store.put(item);
});

tx.oncomplete = ()=>{
alert("Backup restaurado");
atualizarTela();
};

};

reader.readAsText(file);

});

/* ================= ABAS ================= */

function alternarAba(abaId) {

document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));

document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

document.getElementById(abaId).classList.add('active');

if(event && event.currentTarget) {
    event.currentTarget.classList.add('active');
}

if(abaId === 'abaEmpresas') {

atualizarListaEmpresas();

}

}

function definirFiltroVisualizacao(tipo) {

filtroVisualizacao = tipo;

document.getElementById("btnFiltroAberto").classList.toggle("active", tipo === 'aberto');

document.getElementById("btnFiltroArquivado").classList.toggle("active", tipo === 'arquivado');

atualizarTela();

}

function alterarPeriodoPagamentoCadastro(){

const tipo = document.getElementById("cadTipoPagamento").value;

document.getElementById("cadPeriodoPersonalizado").style.display = (tipo==="Quinzenal"||tipo==="Mensal") ? "block" : "none";

document.getElementById("cadPeriodoSemanalBox").style.display = (tipo==="Semanal") ? "grid" : "none";

}

/* ================= AUTOCOMPLETE INTELIGENTE ================= */

function gerenciarAutocomplete(texto) {

const container = document.getElementById("autocompleteContainer");

container.innerHTML = "";

if(!db || !texto.trim()) {

empresaSelecionadaCache = null;

return;

}

const tx = db.transaction("empresas", "readonly");

tx.objectStore("empresas").getAll().onsuccess = e => {

const empresas = e.target.result;

const filtradas = empresas.filter(emp => emp.nome.toLowerCase().includes(texto.toLowerCase().trim()));

const buscaExata = empresas.find(emp => emp.nome.toLowerCase() === texto.toLowerCase().trim());

if(buscaExata) {

empresaSelecionadaCache = buscaExata;

} else {

empresaSelecionadaCache = null;

}

if(filtradas.length > 0) {

const listaDiv = document.createElement("div");

listaDiv.className = "autocomplete-list";

filtradas.forEach(emp => {

const item = document.createElement("div");

item.className = "autocomplete-item";

item.innerText = emp.nome;

item.onclick = () => {

document.getElementById("empresaJob").value = emp.nome;

container.innerHTML = "";

empresaSelecionadaCache = emp;

};

listaDiv.appendChild(item);

});

container.appendChild(listaDiv);

}

};

}

/* ================= FLUXO CADASTRO/EDIÇÃO EMPRESA ================= */

function salvarEmpresa() {

const nome = document.getElementById("cadNomeEmpresa").value.trim();

const idExistente = document.getElementById("cadIdEmpresa").value;

if(!nome) return alert("Digite o nome da empresa");

const item = {

nome: nome,

cacheBase: parseFloat(document.getElementById("cadCacheBase").value || 0),

diaria: parseFloat(document.getElementById("cadDiaria").value || 0),

tipoPagamento: document.getElementById("cadTipoPagamento").value,

inicioPeriodo: parseInt(document.getElementById("cadInicioPeriodo").value || 1),

fimPeriodo: parseInt(document.getElementById("cadFimPeriodo").value || 15),

inicioSemana: parseInt(document.getElementById("cadInicioSemana").value || 1),

fimSemana: parseInt(document.getElementById("cadFimSemana").value || 0),

diasPagamento: parseInt(document.getElementById("cadDiasPagamento").value || 0),

nfPercentual: parseFloat(document.getElementById("cadNfPercentual").value || 0)

};

if(idExistente) {

item.id = parseInt(idExistente);

}

const tx = db.transaction("empresas", "readwrite");

const store = tx.objectStore("empresas");

const requestSalvar = idExistente ? store.put(item) : store.add(item);

requestSalvar.onsuccess = () => {

alert(idExistente ? "Configurações atualizadas com sucesso!" : "Empresa cadastrada com sucesso!");

document.getElementById("cadIdEmpresa").value = "";

document.getElementById("cadNomeEmpresa").value = "";

document.getElementById("cadCacheBase").value = "";

document.getElementById("cadDiaria").value = "";

document.getElementById("cadNfPercentual").value = "0";

atualizarListaEmpresas();

};

}

function atualizarListaEmpresas() {

if(!db) return;

const container = document.getElementById("listaEmpresasCadastradas");

if(!container) return;

container.innerHTML = "";

const tx = db.transaction("empresas", "readonly");

tx.objectStore("empresas").getAll().onsuccess = e => {

const lista = e.target.result;

if(lista.length === 0) {

container.innerHTML = "<p style='color:var(--muted)'>Nenhuma empresa cadastrada ainda.</p>";

return;

}

lista.forEach(emp => {

const div = document.createElement("div");

div.style.background = "#1e293b";

div.style.padding = "15px";

div.style.borderRadius = "14px";

div.style.marginBottom = "10px";

div.style.border = "1px solid #334155";

div.style.position = "relative";

let detalhePeriodo = "";

if(emp.tipoPagamento === "Semanal") {

detalhePeriodo = `Semanal (Fechamento no Domingo)`;

} else {

detalhePeriodo = `${emp.tipoPagamento} (Dias ${emp.inicioPeriodo} a ${emp.fimPeriodo})`;

}

div.innerHTML = `

/* ================= LÓGICA DE PRAZOS E ARQUIVAMENTO ================= */

function obterStatusPeriodo(d) {

let dataJobObj = new Date(d.data + "T00:00:00");

let dataAtual = new Date();

dataAtual.setHours(0,0,0,0);

let dataFechamento = calcularDataFechamentoReal(d.data, d.tipoPagamento, d.inicioPeriodo, d.fimPeriodo, d.inicioSemana, d.fimSemana);

let dataPrevistaPag = calcularDataPagamentoReal(dataFechamento, d.diasPagamento);

if (dataAtual > dataPrevistaPag) {

return "pago";

} else if (dataAtual > dataFechamento) {

return "arquivado";

} else {

return "aberto";

}

}

function calcularDataFechamentoReal(dataBase, tipo, inicioPeriodo, fimPeriodo, inicioSemana, fimSemana) {

let data = new Date(dataBase + "T00:00:00");

let fechamento = new Date(data);

if (tipo === "Semanal") {

let alvoFim = parseInt(fimSemana !== undefined ? fimSemana : 0);

let diasAteFechamento = (alvoFim - data.getDay() + 7) % 7;

if (diasAteFechamento === 0) diasAteFechamento = 7;

fechamento.setDate(data.getDate() + diasAteFechamento);

} else {

let dia = data.getDate();

let iniP = parseInt(inicioPeriodo || 1);

let fimP = parseInt(fimPeriodo || 15);

if (dia >= iniP && dia <= fimP) {

fechamento = new Date(data.getFullYear(), data.getMonth(), fimP);

} else {

fechamento = new Date(data.getFullYear(), data.getMonth() + 1, fimP);

}

}

return fechamento;

}

function calcularDataPagamentoReal(dataFechamento, dias) {

let pagamento = new Date(dataFechamento);

pagamento.setDate(pagamento.getDate() + Number(dias));

return pagamento;

}

function calcularPagamento(dataBase,tipo,dias,inicioPeriodo,fimPeriodo,inicioSemana,fimSemana){

let fechamento = calcularDataFechamentoReal(dataBase, tipo, inicioPeriodo, fimPeriodo, inicioSemana, fimSemana);

let pagamento = calcularDataPagamentoReal(fechamento, dias);

return pagamento.toLocaleDateString("pt-BR");

}

/* ================= CRUD JOBS ================= */

function salvarJob(){

const dt = dataJob.value;

if(!dt) return alert("Selecione data");

const nomeEmpresaInput = empresaJob.value.trim();

if(!nomeEmpresaInput) return alert("Insira o nome de uma empresa");

if(!empresaSelecionadaCache || empresaSelecionadaCache.nome.toLowerCase() !== nomeEmpresaInput.toLowerCase()) {

alert("Por favor, selecione uma empresa cadastrada válida na lista de sugestões.");

return;

}

const cache = parseFloat(empresaSelecionadaCache.cacheBase || 0);

const diaria = parseFloat(empresaSelecionadaCache.diaria || 0);

const nf = parseFloat(empresaSelecionadaCache.nfPercentual || 0);

const campoInicio = document.getElementById("inicio").value;

const campoFim = document.getElementById("fim").value;

const ini = campoInicio.split(":");

const end = campoFim.split(":");

let min = (parseInt(end[0])*60+parseInt(end[1])) - (parseInt(ini[0])*60+parseInt(ini[1]));

if(min<0) min+=1440;

const horas = min/60;

const extraHoras = Math.max(0,horas-12);

const extra = extraHoras*(cache/12);

const total = cache+diaria+extra;

const item = {

data:dt,

empresa:empresaSelecionadaCache.nome,

job:nomeJob.value||"Sem Nome",

cache,diaria,extra,total,

valorNF: total*(nf/100),

horas:horas.toFixed(1),

inicio:campoInicio,fim:campoFim,

tipoPagamento:empresaSelecionadaCache.tipoPagamento,

diasPagamento:parseInt(empresaSelecionadaCache.diasPagamento||0),

inicioPeriodo:parseInt(empresaSelecionadaCache.inicioPeriodo||1),

fimPeriodo:parseInt(empresaSelecionadaCache.fimPeriodo||15),

inicioSemana:parseInt(empresaSelecionadaCache.inicioSemana||1),

fimSemana:parseInt(empresaSelecionadaCache.fimSemana||0),

previsaoPagamento: calcularPagamento(dt,empresaSelecionadaCache.tipoPagamento,empresaSelecionadaCache.diasPagamento,empresaSelecionadaCache.inicioPeriodo,empresaSelecionadaCache.fimPeriodo,empresaSelecionadaCache.inicioSemana,empresaSelecionadaCache.fimSemana)

};

db.transaction("jobs","readwrite")

.objectStore("jobs")

.add(item)

.onsuccess = ()=> {

atualizarTela();

limparCampos();

};

}

function enviarRelatorioWhatsApp(){

if(!db) return;

const tx = db.transaction("jobs", "readonly");

tx.objectStore("jobs").getAll().onsuccess = e => {

const todosJobs = e.target.result;

const abertosDoPeriodo = todosJobs.filter(d => obterStatusPeriodo(d) === "aberto");

if(abertosDoPeriodo.length === 0) {

alert("Não há registros no período em aberto para enviar.");

return;

}

let relatoriosPorEmpresa = {};

abertosDoPeriodo.forEach(j => {

if(!relatoriosPorEmpresa[j.empresa]) relatoriosPorEmpresa[j.empresa] = [];

relatoriosPorEmpresa[j.empresa].push(j);

});

let mensagemCompleta = "RELATÓRIO DE PRESTAÇÃO DE SERVIÇOS\n\n";

for(let emp in relatoriosPorEmpresa) {

mensagemCompleta += `EMPRESA: ${emp.toUpperCase()}\n`;

let totalGeralEmpresa = 0;

relatoriosPorEmpresa[emp].forEach(j => {

const dataFormatada = j.data.split("-").reverse().join("/");

mensagemCompleta += `Data: ${dataFormatada} - Job: ${j.job}\n`;

mensagemCompleta += `Horário: ${j.inicio} às ${j.fim} (${j.horas}h)\n`;

mensagemCompleta += `Valor Cache: R$ ${j.cache.toFixed(2)}\n`;

mensagemCompleta += `Valor Diaria: R$ ${j.diaria.toFixed(2)}\n`;

if(j.extra > 0) mensagemCompleta += `Hora Extra: R$ ${j.extra.toFixed(2)}\n`;

mensagemCompleta += `Subtotal: R$ ${j.total.toFixed(2)}\n`;

mensagemCompleta += "---------------------------\n";

totalGeralEmpresa += j.total;

});

mensagemCompleta += `VALOR TOTAL DO PERÍODO: R$ ${totalGeralEmpresa.toFixed(2)}\n\n`;

}

const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensagemCompleta);

window.open(url, "_blank");

};

}

function baixarExcelCompleto(){

if(!db) return;

});

const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });

const url = URL.createObjectURL(blob);

const a = document.createElement("a");

a.href = url;

a.download = "cache_control_relatorio_" + new Date().toISOString().split("T")[0] + ".csv";

a.click();

};

}

/* ================= GRÁFICO ================= */

function renderGrafico(empresas){

const ctx = document.getElementById("graficoEmpresas");

if(!ctx) return;

const labels = Object.keys(empresas);

const values = Object.values(empresas);

const colors = labels.map(e=>mapaCores[e]);

if(window.chartInstance){

window.chartInstance.destroy();

}

if(labels.length === 0) {

return; 

}

window.chartInstance = new Chart(ctx,{

type:"bar",

data:{

labels:labels,

datasets:[{

data:values,

backgroundColor:colors,

borderRadius:12

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{legend:{display:false}},

scales:{

y:{display:false},

x:{ticks:{color:"#fff"},grid:{display:false}}

}

},

plugins:[{

id:"values",

afterDatasetsDraw(chart){

if(ocultarValores) return;

const {ctx} = chart;

chart.data.datasets[0].data.forEach((v,i)=>{

const meta = chart.getDatasetMeta(0);

const x = meta.data[i].x;

const y = meta.data[i].y;

ctx.fillStyle = "#fff";

ctx.textAlign = "center";

ctx.font = "bold 13px Arial";

ctx.fillText(formatarValor(v),x,y-10);

});

}

}]

});

}
