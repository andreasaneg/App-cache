<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cachê Control Premium</title>

<link rel="manifest"
href="manifest.json">

<meta name="theme-color"
content="#10b981">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{

--primary:#10b981;
--secondary:#06b6d4;
--bg:#020617;
--card:rgba(15,23,42,.78);
--text:#f8fafc;
--muted:#94a3b8;
--danger:#ef4444;
--blue:#38bdf8;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;

background:
linear-gradient(
180deg,
#020617,
#0f172a
);

color:var(--text);

padding:18px;

min-height:100vh;

}

.login-screen{

position:fixed;
inset:0;

background:#020617;

display:flex;
justify-content:center;
align-items:center;

z-index:999999;

}

.login-card{

width:100%;
max-width:380px;

background:rgba(15,23,42,.95);

padding:30px;

border-radius:28px;

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(25px);

box-shadow:
0 0 50px rgba(16,185,129,.2);

}

.login-card h1{

text-align:center;
margin-bottom:25px;

}

input,
select{

width:100%;

padding:14px;

margin-top:8px;
margin-bottom:18px;

border-radius:14px;

border:1px solid #334155;

background:#0f172a;

color:white;

font-size:15px;

}

button{

border:none;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

}

.btn{

width:100%;

padding:15px;

border-radius:16px;

font-weight:bold;

margin-top:10px;

}

.btn-primary{

background:
linear-gradient(
135deg,
#10b981,
#06b6d4
);

color:white;

}

.btn-danger{

background:#ef4444;
color:white;

}

.btn-gray{

background:#334155;
color:white;

}

.header{

display:flex;
flex-direction:column;
align-items:center;

gap:10px;

margin-bottom:25px;

}

.header img{

width:130px;
height:130px;

object-fit:cover;

border-radius:30px;

border:3px solid rgba(16,185,129,.5);

box-shadow:
0 0 40px rgba(16,185,129,.35);

}

.glass{

background:var(--card);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.06);

border-radius:24px;

padding:22px;

margin-bottom:20px;

}

.dashboard{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:15px;

margin-bottom:20px;

}

.card-mini{

background:rgba(255,255,255,.03);

padding:18px;

border-radius:18px;

position:relative;

}

.card-mini h3{

font-size:.8em;

margin-bottom:10px;

}

.card-mini span{

font-size:1.5em;
font-weight:bold;

}

.eye-button{

position:absolute;

top:15px;
right:15px;

width:45px;
height:45px;

border-radius:14px;

background:#1e293b;

color:white;

font-size:1em;

}

.form-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.history-card{

background:rgba(255,255,255,.03);

border:1px solid rgba(255,255,255,.05);

padding:18px;

border-radius:20px;

margin-bottom:15px;

position:relative;

animation:fade .35s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:none;
}

}

.tag{

display:inline-block;

padding:6px 10px;

border-radius:999px;

background:rgba(16,185,129,.15);

font-size:.72em;

margin-top:10px;

}

.delete-btn,
.edit-btn{

position:absolute;

top:12px;

width:38px;
height:38px;

border-radius:12px;

font-size:1em;

}

.delete-btn{

right:12px;

background:#ef444422;

color:#ef4444;

}

.edit-btn{

right:58px;

background:#0ea5e922;

color:#0ea5e9;

}

.chart-container{

height:320px;

margin-top:15px;

}

.actions{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

margin-top:15px;

}

.empresa-group{

margin-bottom:30px;

}

.empresa-title{

font-size:1.5em;
font-weight:bold;

color:var(--primary);

margin-bottom:18px;

padding-left:8px;

border-left:5px solid var(--primary);

}

.search-box{

display:none;

margin-top:15px;

}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.actions{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="login-screen"
id="loginScreen">

<div class="login-card">

<h1>
🔒 Cachê Control
</h1>

<input
type="password"
id="senhaInput"
placeholder="Digite sua senha">

<button
class="btn btn-primary"
onclick="login()">

ENTRAR

</button>

</div>

</div>

<div class="header">

<img src="FaderLivreIcon.png">

<h1>
Cachê Control Premium
</h1>

</div>

<div class="dashboard">

<div class="card-mini">

<button
class="eye-button"
onclick="togglePrivacidade()">

👁️

</button>

<h3 style="color:var(--blue)">
TOTAL GERAL
</h3>

<span
id="totalGeral"
style="color:var(--blue)">

R$ 0,00

</span>

</div>

<div class="card-mini">

<h3 style="color:var(--danger)">
NOTA FISCAL
</h3>

<span
id="totalNF"
style="color:var(--danger)">

- R$ 0,00

</span>

</div>

<div class="card-mini">

<h3 style="color:var(--primary)">
HORAS
</h3>

<span
id="totalHoras"
style="color:var(--primary)">

0h

</span>

</div>

</div>
<div class="glass">

<h2 style="margin-bottom:18px">

Novo Job

</h2>

<input
type="date"
id="dataJob">

<input
type="text"
id="empresaJob"
placeholder="Empresa">

<input
type="text"
id="nomeJob"
placeholder="Nome do Job">

<div class="form-grid">

<input
type="number"
id="vCacheBase"
placeholder="Cachê">

<input
type="number"
id="vDiaria"
placeholder="Diária">

</div>

<div class="form-grid">

<input
type="time"
id="inicio"
value="08:00">

<input
type="time"
id="fim"
value="20:00">

</div>

<select
id="tipoPagamento"
onchange="togglePeriodo()">

<option value="Semanal">
Semanal
</option>

<option value="Quinzenal">
Quinzenal
</option>

<option value="Mensal">
Mensal
</option>

</select>

<div
id="boxPeriodo"
class="form-grid"
style="display:none;">

<div>

<label
style="
color:var(--muted);
font-size:.8em;">

Início do período

</label>

<input
type="number"
id="inicioPeriodo"
value="1"
min="1"
max="31">

</div>

<div>

<label
style="
color:var(--muted);
font-size:.8em;">

Fim do período

</label>

<input
type="number"
id="fimPeriodo"
value="15"
min="1"
max="31">

</div>

</div>

<label
style="
color:var(--muted);
font-size:.8em;">

Dias após fechamento

</label>

<input
type="number"
id="diasPagamento"
value="5">

<label
style="
color:var(--muted);
font-size:.8em;">

NF (%)

</label>

<input
type="number"
id="nfPercentual"
value="0">

<div class="actions">

<button
class="btn btn-primary"
onclick="salvarJob()">

💾 SALVAR

</button>

<button
class="btn btn-gray"
onclick="limparCampos()">

🧹 LIMPAR

</button>

</div>

</div>

<div class="glass">

<h2>

Financeiro

</h2>

<div class="chart-container">

<canvas
id="graficoEmpresas">

</canvas>

</div>

</div>

<div class="glass">

<h2
style="margin-bottom:18px;">

Todos os Jobs

</h2>

<div class="actions">

<button
class="btn btn-primary"
onclick="abrirBusca()">

BUSCAR

</button>

<button
class="btn btn-gray"
onclick="limparBusca()">

LIMPAR BUSCA

</button>

</div>

<div
id="searchBox"
class="search-box">

<input
type="text"
id="busca"
placeholder="Buscar empresa, job ou data..."
onkeyup="filtrar()">

</div>

<div id="listaHistorico"></div>

</div>

<div class="glass">

<h2
style="margin-bottom:15px;">

Exportações

</h2>

<div class="actions">

<button
class="btn btn-primary"
onclick="exportarCSV()">

📊 CSV

</button>

<button
class="btn btn-primary"
onclick="exportarWhats()">

WHATSAPP

</button>

<button
class="btn btn-gray"
onclick="backupJSON()">

💾 BACKUP

</button>

<button
class="btn btn-gray"
onclick="restaurarBackup()">

📂 RESTAURAR

</button>

</div>

<input
type="file"
id="inputRestore"
accept=".json"
style="display:none;">

</div>

<script>

let db;

let jobs=[];

let editandoId = null;

let ocultarValores = false;

const senhaPadrao='1234';

if(
localStorage.getItem(
'cache_auth'
)==='true'
){

document.getElementById(
'loginScreen'
).style.display='none';

}

function login(){

const senha =
document.getElementById(
'senhaInput'
).value;

if(senha === senhaPadrao){

localStorage.setItem(
'cache_auth',
'true'
);

document.getElementById(
'loginScreen'
).style.display='none';

}else{

alert('Senha inválida');

}

}

function abrirBusca(){

document.getElementById(
'searchBox'
).style.display='block';

}

function limparBusca(){

document.getElementById(
'busca'
).value='';

document.getElementById(
'searchBox'
).style.display='none';

filtrar();

}

function togglePrivacidade(){

ocultarValores =
!ocultarValores;

atualizarTela();

}

function formatarValor(v){

if(ocultarValores){

return 'R$ •••••';

}

return Number(v)
.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);

}

function togglePeriodo(){

const tipo =
document.getElementById(
'tipoPagamento'
).value;

document.getElementById(
'boxPeriodo'
).style.display =

(
tipo === 'Quinzenal'
||
tipo === 'Mensal'
)

? 'grid'

: 'none';

}

const request =
indexedDB.open(
'CachePremiumDB',
1
);

request.onupgradeneeded = e=>{

const db =
e.target.result;

if(
!db.objectStoreNames
.contains('jobs')
){

db.createObjectStore(
'jobs',
{
keyPath:'id',
autoIncrement:true
}
);

}

};

request.onsuccess = e=>{

db = e.target.result;

togglePeriodo();

atualizarTela();

};
 function calcularPagamento(
dataBase,
tipo,
dias,
inicioPeriodo,
fimPeriodo
){

let data =
new Date(
dataBase + "T00:00:00"
);

let fechamento;

if(tipo === 'Semanal'){

fechamento =
new Date(data);

fechamento.setDate(
data.getDate() +
(7 - data.getDay())
);

}else{

let dia =
data.getDate();

if(
dia >= inicioPeriodo
&&
dia <= fimPeriodo
){

fechamento =
new Date(
data.getFullYear(),
data.getMonth(),
fimPeriodo
);

}else{

fechamento =
new Date(
data.getFullYear(),
data.getMonth()+1,
fimPeriodo
);

}

}

fechamento.setDate(
fechamento.getDate() +
Number(dias)
);

return fechamento
.toLocaleDateString(
'pt-BR'
);

}

function salvarJob(){

if(!dataJob.value){

alert('Selecione uma data');

return;

}

const cache =
parseFloat(
vCacheBase.value
) || 0;

const diaria =
parseFloat(
vDiaria.value
) || 0;

const nf =
parseFloat(
nfPercentual.value
) || 0;

const inicioPeriodo =
parseInt(
document.getElementById(
'inicioPeriodo'
).value
) || 1;

const fimPeriodo =
parseInt(
document.getElementById(
'fimPeriodo'
).value
) || 15;

const diasPagamento =
parseInt(
document.getElementById(
'diasPagamento'
).value
) || 5;

const inicio =
document.getElementById(
'inicio'
).value;

const fim =
document.getElementById(
'fim'
).value;

const ini =
inicio.split(':');

const end =
fim.split(':');

let minutos =

(
parseInt(end[0])*60
+
parseInt(end[1])
)

-

(
parseInt(ini[0])*60
+
parseInt(ini[1])
);

if(minutos < 0){

minutos += 1440;

}

const horas =
(minutos / 60);

const extraHoras =
Math.max(
0,
horas - 12
);

const extra =
extraHoras *
(cache / 12);

const total =
cache +
diaria +
extra;

const previsao =
calcularPagamento(

dataJob.value,

tipoPagamento.value,

diasPagamento,

inicioPeriodo,

fimPeriodo

);

const item = {

data:dataJob.value,

empresa:
empresaJob.value || 'Sem empresa',

job:
nomeJob.value || 'Sem nome',

cache,
diaria,
extra,
total,

valorNF:
total * (nf / 100),

inicio,
fim,

horas:
horas.toFixed(1),

tipoPagamento:
tipoPagamento.value,

inicioPeriodo,
fimPeriodo,

diasPagamento,

previsaoPagamento:
previsao

};

const tx =
db.transaction(
'jobs',
'readwrite'
);

const store =
tx.objectStore(
'jobs'
);

if(editandoId){

item.id = editandoId;

store.put(item);

editandoId = null;

}else{

store.add(item);

}

tx.oncomplete = ()=>{

limparCampos();

atualizarTela();

};

}

function limparCampos(){

document.getElementById(
'dataJob'
).value='';

document.getElementById(
'empresaJob'
).value='';

document.getElementById(
'nomeJob'
).value='';

document.getElementById(
'vCacheBase'
).value='';

document.getElementById(
'vDiaria'
).value='';

document.getElementById(
'inicio'
).value='08:00';

document.getElementById(
'fim'
).value='20:00';

document.getElementById(
'tipoPagamento'
).value='Semanal';

document.getElementById(
'inicioPeriodo'
).value='1';

document.getElementById(
'fimPeriodo'
).value='15';

document.getElementById(
'diasPagamento'
).value='5';

document.getElementById(
'nfPercentual'
).value='0';

togglePeriodo();

}

function atualizarTela(){

const lista =
document.getElementById(
'listaHistorico'
);

lista.innerHTML='';

let total=0;
let totalNF=0;
let horas=0;

let empresas={};

db.transaction('jobs')
.objectStore('jobs')
.getAll()
.onsuccess = e=>{

jobs =
e.target.result.reverse();

const grupos = {};

jobs.forEach(item=>{

total += item.total;

totalNF +=
(item.valorNF || 0);

horas +=
parseFloat(
item.horas
);

if(
!empresas[item.empresa]
){

empresas[item.empresa]=0;

}

empresas[item.empresa]+=
item.total;

if(
!grupos[item.empresa]
){

grupos[item.empresa]=[];

}

grupos[item.empresa]
.push(item);

});
 Object.keys(grupos)
.forEach(empresa=>{

const bloco =
document.createElement('div');

bloco.className =
'empresa-group';

bloco.innerHTML =

`<div class="empresa-title">
${empresa}
</div>`;

grupos[empresa]
.forEach(item=>{

const card =
document.createElement('div');

card.className =
'history-card';

card.innerHTML = `

<button
class="delete-btn"
onclick="excluir(${item.id})">

🗑

</button>

<button
class="edit-btn"
onclick="editar(${item.id})">

✏️

</button>

<div
style="
font-size:1.3em;
font-weight:bold;
margin-bottom:10px;
color:#ffffff;">

${item.empresa}

</div>

<h3>

${item.job}

</h3>

<p>

${item.data
.split('-')
.reverse()
.join('/')}

</p>

<p>

${item.inicio}
às
${item.fim}

•
${item.horas}h

</p>

<div class="tag">

${item.tipoPagamento}

</div>

<p
style="
margin-top:12px;
color:var(--muted);">

Pagamento:
${item.previsaoPagamento}

</p>

<h2
style="
margin-top:12px;">

${formatarValor(item.total)}

</h2>

<p
style="
color:#ef4444;">

NF:
- ${formatarValor(item.valorNF)}

</p>

`;

bloco.appendChild(card);

});

lista.appendChild(bloco);

});

document.getElementById(
'totalGeral'
).innerText =
formatarValor(total);

document.getElementById(
'totalNF'
).innerText =
'- ' + formatarValor(totalNF);

document.getElementById(
'totalHoras'
).innerText =
horas.toFixed(1)+'h';

renderGrafico(empresas);

};

}

function renderGrafico(empresas){

const ctx =
document.getElementById(
'graficoEmpresas'
);

const existing =
Chart.getChart(ctx);

if(existing){

existing.destroy();

}

const labels =
Object.keys(empresas);

const valores =
Object.values(empresas);

new Chart(ctx,{

type:'bar',

data:{

labels,

datasets:[{

data:valores,

borderRadius:14

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{

legend:{
display:false
}

},

scales:{

y:{
display:false
},

x:{

ticks:{
color:'#fff'
},

grid:{
display:false
}

}

}

},

plugins:[{

id:'valorTopo',

afterDatasetsDraw(chart){

if(ocultarValores)
return;

const {ctx} = chart;

ctx.save();

chart.data.datasets[0]
.data
.forEach((valor,index)=>{

const meta =
chart.getDatasetMeta(0);

const x =
meta.data[index].x;

const y =
meta.data[index].y;

ctx.fillStyle =
'#ffffff';

ctx.font =
'bold 14px Arial';

ctx.textAlign =
'center';

ctx.fillText(

formatarValor(valor),

x,

y - 10

);

});

}

}]

});

}

function excluir(id){

if(
confirm(
'Deseja excluir este job?'
)
){

db.transaction(
'jobs',
'readwrite'
)
.objectStore('jobs')
.delete(id)
.onsuccess = ()=>{

atualizarTela();

};

}

}

function editar(id){

const item =
jobs.find(
v=>v.id===id
);

if(!item) return;

editandoId = id;

dataJob.value =
item.data;

empresaJob.value =
item.empresa;

nomeJob.value =
item.job;

vCacheBase.value =
item.cache;

vDiaria.value =
item.diaria;

inicio.value =
item.inicio;

fim.value =
item.fim;

tipoPagamento.value =
item.tipoPagamento;

inicioPeriodo.value =
item.inicioPeriodo;

fimPeriodo.value =
item.fimPeriodo;

diasPagamento.value =
item.diasPagamento;

nfPercentual.value =
(
item.valorNF /
item.total
) * 100;

togglePeriodo();

window.scrollTo({
top:0,
behavior:'smooth'
});

}

function filtrar(){

const filtro =
document.getElementById(
'busca'
)
.value
.toUpperCase();

const grupos =
document.querySelectorAll(
'.empresa-group'
);

grupos.forEach(grupo=>{

grupo.style.display =

grupo.innerText
.toUpperCase()
.includes(filtro)

? 'block'

: 'none';

});

}

function exportarCSV(){

let csv =
"\ufeffEmpresa;Data;Job;Pagamento;Previsão;Cache;Diária;Extra;NF;Total\n";

const filtro =
document.getElementById(
'busca'
)
.value
.toUpperCase();

db.transaction('jobs')
.objectStore('jobs')
.getAll()
.onsuccess = e=>{

const dados =
e.target.result;

dados.forEach(v=>{

const texto =

(
v.empresa +
' ' +
v.job +
' ' +
v.data
)
.toUpperCase();

if(
filtro &&
!texto.includes(filtro)
){
return;
}

csv +=

`${v.empresa};${v.data};${v.job};${v.tipoPagamento};${v.previsaoPagamento};${v.cache};${v.diaria};${v.extra};${v.valorNF};${v.total}\n`;

});

const blob =
new Blob(
[csv],
{
type:'text/csv;charset=utf-8;'
}
);

const link =
document.createElement('a');

link.href =
URL.createObjectURL(blob);

link.download =

`cache-control-backup-${new Date()
.toLocaleDateString('pt-BR')
.replace(/\//g,'-')
}.csv`;

link.click();

};

}

function exportarWhats(){

const filtro =
document.getElementById(
'busca'
)
.value
.toUpperCase();

db.transaction('jobs')
.objectStore('jobs')
.getAll()
.onsuccess = e=>{

const dados =
e.target.result;

let total = 0;

let msg =

`RELATÓRIO FINANCEIRO

`;

dados.forEach(item=>{

const texto =

(
item.empresa +
' ' +
item.job +
' ' +
item.data
)
.toUpperCase();

if(
filtro &&
!texto.includes(filtro)
){
return;
}

total += item.total;

msg +=

`EMPRESA: ${item.empresa}

DATA: ${item.data
.split('-')
.reverse()
.join('/')}

JOB: ${item.job}

VALOR:
R$ ${item.total.toFixed(2)}

PAGAMENTO:
${item.previsaoPagamento}

--------------------------------

`;

});

msg +=

`TOTAL DO PERÍODO:
R$ ${total.toFixed(2)}`;

window.open(

`https://wa.me/?text=${encodeURIComponent(msg)}`

);

};

}

function backupJSON(){

db.transaction('jobs')
.objectStore('jobs')
.getAll()
.onsuccess = e=>{

const dados =
e.target.result;

const blob =
new Blob(

[
JSON.stringify(
dados,
null,
2
)
],

{
type:'application/json'
}

);

const link =
document.createElement('a');

link.href =
URL.createObjectURL(blob);

link.download =

`cache-control-backup-${new Date()
.toLocaleDateString('pt-BR')
.replace(/\//g,'-')}.json`;

link.click();

};

}

function restaurarBackup(){

document.getElementById(
'inputRestore'
).click();

}

document.getElementById(
'inputRestore'
)
.addEventListener(
'change',
function(e){

const file =
e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(event){

const dados =
JSON.parse(
event.target.result
);

const tx =
db.transaction(
'jobs',
'readwrite'
);

const store =
tx.objectStore(
'jobs'
);

dados.forEach(item=>{

delete item.id;

store.add(item);

});

tx.oncomplete = ()=>{

alert(
'Backup restaurado!'
);

atualizarTela();

};

};

reader.readAsText(file);

}
);

if(
'serviceWorker'
in navigator
){

navigator
.serviceWorker
.register(
'service-worker.js'
);

}

</script>
