<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FADER LIVRE - CACHÊ CONTROL</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--primary:#10b981;
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--danger:#ef4444;
--muted:#94a3b8;
}

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
padding-bottom:80px;
background:var(--bg);
color:var(--text);
font-family:Arial, Helvetica, sans-serif;
}

.header{

padding-bottom:20px;
margin-bottom:20px;
border-bottom:2px solid var(--primary);
}

.header img{
width:130px;
height:130px;
border-radius:22px;
border:3px solid var(--primary);
object-fit:cover;
box-shadow:0 0 25px rgba(16,185,129,0.3);
}

margin-top:15px;
font-size:2em;
letter-spacing:1px;
}

.dashboard,
.input-group,
.history-card{
background:var(--card);
border:1px solid #334155;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.dashboard{
padding:20px;
margin-bottom:20px;
text-align:center;
}

.total-semana{
font-size:2.5em;
font-weight:bold;
color:var(--primary);
}

.total-nf{
margin-top:8px;
font-size:1.1em;
font-weight:bold;
color:var(--danger);
}

.input-group{
padding:18px;
margin-bottom:15px;
}

label{
display:block;
margin-bottom:6px;
font-size:0.75em;
text-transform:uppercase;
color:var(--muted);
font-weight:bold;
}

input,
select{
width:100%;
padding:13px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #334155;
background:#0f172a;
color:white;

}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:1em;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
transition:0.2s;
}

.btn:hover{
transform:scale(1.01);
}

.btn-save{
background:var(--primary);
color:#000;
}

.btn-export{
background:#475569;
color:#fff;
}

.btn-whats{

color:#000;
}

margin-bottom:14px;
position:relative;
border-left:5px solid var(--primary);
}

.empresa-title{

margin-bottom:8px;
}

.card-info{

}

.valor-total{

</head>

<body>

<div class="header">
<img src="FaderLivreIcon.png">
<h1>CACHÊ CONTROL</h1>
</div>

<div class="dashboard">
<div id="vTotalSemana" class="total-semana">R$ 0,00</div>
<div id="vTotalNF" class="total-nf">NF: R$ 0,00</div>

<button onclick="toggleValores()" style="margin-top:15px;width:55px;height:55px;border:none;border-radius:14px;background:#334155;color:white;font-size:1.2em;">
👁️
</button>

<div class="chart-container">
<canvas id="graficoEmpresas"></canvas>
</div>
</div>

<div class="input-group">
<label>Data</label>
<input type="date" id="dataJob">

<label>Empresa</label>
<input type="text" id="empresaJob" placeholder="Fader Livre">

<label>Nome do Job</label>
<input type="text" id="nomeJob" placeholder="Ex: Comercial">

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
<div>
<label>Cachê</label>
<input type="number" id="vCacheBase">
</div>
<div>
<label>Diária</label>
<input type="number" id="vDiaria">
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
<div>
<label>Início</label>
<input type="time" id="inicio" value="08:00">
</div>
<div>
<label>Fim</label>
<input type="time" id="fim" value="20:00">
</div>
</div>

<label>Tipo de Pagamento</label>
<select id="tipoPagamento">
<option value="Semanal">Semanal</option>
<option value="Quinzenal">Quinzenal</option>
<option value="Mensal">Mensal</option>
</select>

<label>Dias após fechamento</label>
<input type="number" id="diasPagamento" value="5">

<label>NF (%)</label>
<input type="number" id="nfPercentual" value="0">
</div>

<button class="btn btn-save" onclick="salvarJob()">SALVAR JOB</button>
<button class="btn btn-whats" onclick="enviarRelatorioWhatsApp()">ENVIAR WHATSAPP</button>
<button class="btn btn-export" onclick="baixarExcelCompleto()">EXPORTAR EXCEL</button>

<input type="text" id="inputBusca" onkeyup="filtrarTabela()" placeholder="Buscar empresa, job ou data...">

<div id="listaHistorico"></div>

<script>

let db;
let ocultarValores=false;

const request=indexedDB.open('CacheFinal_V40',1);

request.onupgradeneeded=(e)=>{
let d=e.target.result;
if(!d.objectStoreNames.contains('jobs')){
d.createObjectStore('jobs',{keyPath:'id',autoIncrement:true});
}
};

request.onsuccess=(e)=>{
db=e.target.result;
atualizarTela();
};

function toggleValores(){
ocultarValores=!ocultarValores;
atualizarTela();
}

function formatarValor(v){
if(ocultarValores){
return 'R$ •••••';
}

return Number(v).toLocaleString('pt-BR',{
style:'currency',
currency:'BRL'
});
}

function calcularPagamento(dataBase,dias){
let data=new Date(dataBase+'T00:00:00');
data.setDate(data.getDate()+Number(dias));
return data.toLocaleDateString('pt-BR');
}

function salvarJob(){

let dt=document.getElementById('dataJob').value;
if(!dt){
alert('Selecione a data');
return;
}

let empresa=document.getElementById('empresaJob').value || 'Fader Livre';
let job=document.getElementById('nomeJob').value || 'Sem nome';

let cache=parseFloat(document.getElementById('vCacheBase').value)||0;
let diaria=parseFloat(document.getElementById('vDiaria').value)||0;
let nf=parseFloat(document.getElementById('nfPercentual').value)||0;
let diasPagamento=parseInt(document.getElementById('diasPagamento').value)||0;

let inicio=document.getElementById('inicio').value;
let fim=document.getElementById('fim').value;

let ini=inicio.split(':');
let end=fim.split(':');

let min=(parseInt(end[0])*60+parseInt(end[1]))-(parseInt(ini[0])*60+parseInt(ini[1]));

if(min<0){
min+=1440;
}

let horas=min/60;
let extraHoras=Math.max(0,horas-12);
let extra=extraHoras*(cache/12);

let total=cache+diaria+extra;
let valorNF=total*(nf/100);

const registro={
data:dt,
empresa,
job,
cache,
diaria,
extra,
total,
valorNF,
inicio,
fim,
horas:horas.toFixed(1),
previsaoPagamento:calcularPagamento(dt,diasPagamento)
};

 db.transaction('jobs','readwrite')
 .objectStore('jobs')
 .add(registro)
 .onsuccess=()=>{
 atualizarTela();
 };
}

function atualizarTela(){

if(!db)return;

let total=0;
let totalNF=0;
let empresas={};

const lista=document.getElementById('listaHistorico');
lista.innerHTML='';

 db.transaction('jobs')
 .objectStore('jobs')
 .openCursor(null,'prev')
 .onsuccess=(e)=>{

 const cursor=e.target.result;

 if(cursor){

 const d=cursor.value;

 total+=d.total;
 totalNF+=d.valorNF;

 if(!empresas[d.empresa]){
 empresas[d.empresa]=0;
 }

 empresas[d.empresa]+=d.total;

 const card=document.createElement('div');
 card.className='history-card';

 card.innerHTML=`
 <button class="btn-del" onclick="excluir(${d.id})">×</button>

 <div class="empresa-title">${d.empresa}</div>

 <div class="card-info">
 <b>${d.data.split('-').reverse().join('/')}</b>
 — ${d.job}
 <br><br>
 ${d.inicio} às ${d.fim}
 • ${d.horas}h
 <br>
 Pagamento previsto:
 ${d.previsaoPagamento}
 </div>

 <div class="valor-total">
 ${formatarValor(d.total)}
 </div>

 <div class="valor-nf">
 NF: ${formatarValor(d.valorNF)}
 </div>
 `;

 lista.appendChild(card);

 cursor.continue();

 }else{

 document.getElementById('vTotalSemana').innerText=formatarValor(total);
 document.getElementById('vTotalNF').innerText='NF: '+formatarValor(totalNF);
 renderGrafico(empresas);
 }
 };
}

function excluir(id){
if(confirm('Deseja excluir este registro?')){
 db.transaction('jobs','readwrite')
 .objectStore('jobs')
 .delete(id)
 .onsuccess=()=>{
 atualizarTela();
 };
}
}

function filtrarTabela(){
let filtro=document.getElementById('inputBusca').value.toUpperCase();
let cards=document.getElementsByClassName('history-card');

for(let i=0;i<cards.length;i++){
let texto=cards[i].innerText.toUpperCase();
cards[i].style.display=texto.includes(filtro)?'':'none';
}
}

function renderGrafico(empresas){

const ctx=document.getElementById('graficoEmpresas');
const existente=Chart.getChart(ctx);
if(existente){existente.destroy();}

new Chart(ctx,{
type:'bar',
data:{
labels:Object.keys(empresas),
datasets:[{
data:Object.values(empresas),
borderRadius:12
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{legend:{display:false}},
scales:{
y:{display:false},
x:{ticks:{color:'#fff'}}
}
}
});
}

function baixarExcelCompleto(){

let csv='\ufeffEmpresa;Data;Job;Pagamento;Total\n';

 db.transaction('jobs')
 .objectStore('jobs')
 .getAll()
 .onsuccess=(e)=>{

 let total=0;

 e.target.result.forEach(v=>{
 total+=v.total;
 csv+=`${v.empresa};${v.data};${v.job};${v.previsaoPagamento};${v.total}\n`;
 });

 csv+=`;;;;${total}`;

 const link=document.createElement('a');
 link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 link.download='relatorio_cache.csv';
 link.click();
 };
}

function enviarRelatorioWhatsApp(){

 db.transaction('jobs')
 .objectStore('jobs')
 .getAll()
 .onsuccess=(e)=>{

 let total=0;

 let msg='FADER LIVRE - RELATÓRIO\n\n';

 e.target.result.forEach(item=>{

 total+=item.total;

 msg+=`${item.empresa}\n`;
 msg+=`${item.data.split('-').reverse().join('/')}\n`;
 msg+=`${item.job}\n`;
 msg+=`Pagamento: ${item.previsaoPagamento}\n`;
 msg+=`Total: R$ ${item.total.toFixed(2)}\n\n`;

 });

 msg+=`TOTAL GERAL: R$ ${total.toFixed(2)}`;

 window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
 };
}

</script>

</body>
</html>
```
