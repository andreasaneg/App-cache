<!-- SUBSTITUA A FUNÇÃO renderizarGraficos() -->
<!-- ========================================= -->

<script>

function renderizarGraficos(
    semanal,
    quinzenal,
    mensal
){

    atualizarTotaisGrafico(
        'Semanal',
        semanal
    );

    atualizarTotaisGrafico(
        'Quinzenal',
        quinzenal
    );

    atualizarTotaisGrafico(
        'Mensal',
        mensal
    );

    criarGrafico(
        'graficoSemanal',
        'boxGraficoSemanal',
        semanal
    );

    criarGrafico(
        'graficoQuinzenal',
        'boxGraficoQuinzenal',
        quinzenal
    );

    criarGrafico(
        'graficoMensal',
        'boxGraficoMensal',
        mensal
    );

}

</script>

<!-- ========================================= -->
<!-- NOVA FUNÇÃO -->
<!-- ========================================= -->

<script>

function atualizarTotaisGrafico(
    tipo,
    dados
){

    document.getElementById(
        `totalCache${tipo}`
    ).innerText =

        dados.cache.toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );

    document.getElementById(
        `totalDiaria${tipo}`
    ).innerText =

        dados.diaria.toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );

    document.getElementById(
        `totalExtra${tipo}`
    ).innerText =

        dados.extra.toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );

    document.getElementById(
        `totalNF${tipo}`
    ).innerText =

        dados.nf.toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );

}

</script>

<!-- ========================================= -->
<!-- SUBSTITUA COMPLETAMENTE -->
<!-- A FUNÇÃO criarGrafico() -->
<!-- ========================================= -->

<script>

function criarGrafico(
    idCanvas,
    idBox,
    dados
){

    const totalPrincipal =
        dados.cache
        +
        dados.diaria
        +
        dados.extra;

    /* ========= NF NÃO ENTRA ========= */

    if(totalPrincipal <= 0){

        document.getElementById(
            idBox
        ).style.display = 'none';

        return;

    }

    document.getElementById(
        idBox
    ).style.display = 'block';

    const ctx =
        document.getElementById(
            idCanvas
        );

    const chartExistente =
        Chart.getChart(ctx);

    if(chartExistente){

        chartExistente.destroy();

    }

    new Chart(ctx, {

        type:'bar',

        data:{

            labels:[
                'Cachê',
                'Diária',
                'Extras',
                'NF'
            ],

            datasets:[{

                label:'Valores',

                data:[
                    dados.cache,
                    dados.diaria,
                    dados.extra,
                    dados.nf
                ],

                backgroundColor:[
                    '#10b981',
                    '#0ea5e9',
                    '#f59e0b',
                    '#ef4444'
                ],

                borderRadius:10,

                borderWidth:0

            }]

        },

        options:{

            responsive:true,

            maintainAspectRatio:false,

            plugins:{

                legend:{
                    display:false
                }

            },

            scales:{

                y:{

                    ticks:{
                        color:'#ffffff'
                    },

                    grid:{
                        color:'rgba(255,255,255,0.08)'
                    }

                },

                x:{

                    ticks:{
                        color:'#ffffff'
                    },

                    grid:{
                        display:false
                    }

                }

            }

        }

    });

}

</script>
