<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FADER LIVRE CACHÊ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --primary:#10b981;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --extra:#f59e0b;
    --diaria:#0ea5e9;
    --danger:#ef4444;
}

body{
    font-family:sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:15px;
    padding-bottom:50px;
}

.header{
    text-align:center;
    border-bottom:2px solid var(--primary);
    padding-bottom:10px;
    margin-bottom:15px;
}

.semana-selector{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    padding:8px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid var(--primary);
}

.btn-nav{
    background:var(--primary);
    border:none;
    color:#0f172a;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    font-size:1.2em;
}

.semana-label{
    font-weight:bold;
    font-size:0.85em;
    text-align:center;
    flex:1;
}

.dashboard{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
    border:1px solid #334155;
    text-align:center;
}

.total-semana{
    font-size:2.2em;
    font-weight:bold;
    color:var(--primary);
    margin-bottom:5px;
}

.pgto-info{
    font-size:0.9em;
    color:#94a3b8;
    margin-bottom:15px;
    display:block;
}

.chart-container{
    position:relative;
    height:180px;
    margin-bottom:15px;
    display:flex;
    justify-content:center;
}

.custom-legend{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    gap:4px;
    flex-wrap:nowrap;
    overflow-x:auto;
}

.legend-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:70px;
}

.legend-color{
    width:12px;
    height:12px;
    border-radius:3px;
    margin-bottom:5px;
}

.legend-label{
    font-size:0.65em;
    color:#94a3b8;
    text-transform:uppercase;
}

.legend-value{
    font-size:0.8em;
    font-weight:bold;
}

.input-group{
    background:var(--card);
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #334155;
}

label{
    display:block;
    margin-bottom:5px;
    color:#94a3b8;
    font-size:0.7em;
    text-transform:uppercase;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    font-size:16px;
    box-sizing:border-box;
    margin-bottom:12px;
}

.btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
    font-size:1em;
}

.btn-export{
    background:#475569;
    color:white;
}

.history-card{
    background:#1e293b;
    padding:15px;
    border-radius:8px;
    margin-bottom:8px;
    border-left:4px solid var(--primary);
    position:relative;
}

.btn-del{
    position:absolute;
    top:12px;
    right:12px;
    color:var(--danger);
    background:none;
    border:none;
    font-size:1.6em;
}

#modalExcluir{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:var(--card);
    padding:25px;
    border-radius:16px;
    width:80%;
    max-width:300px;
    text-align:center;
    border:1px solid var(--danger);
}

.modal-btns{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn-confirm{
    background:var(--danger);
    color:white;
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-weight:bold;
}

.btn-cancel{
    background:#475569;
    color:white;
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="telaBloqueio" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:10000; padding:30px; box-sizing:border-box; text-align:center; flex-direction:column; justify-content:center;">

<h2 style="color:var(--primary)">FADER LIVRE</h2>

<p style="color:#94a3b8;">Aplicativo Não Ativado</p>

<div style="background:var(--card); padding:20px; border-radius:12px; margin:20px 0; border:1px solid #334155;">

<label style="font-size:0.7em; color:#94a3b8;">ID DO APARELHO</label>

<div id="displayID" style="font-size:1.8em; font-weight:bold; color:var(--extra); margin:10px 0;"></div>

</div>

<input type="text" id="inputSerial" placeholder="Digite o Serial de Ativação">

<button class="btn" style="background:var(--primary); color:#0f172a;" onclick="verificarSerial()">
ATIVAR AGORA
</button>

</div>

<div class="header">

<img src="FaderLivreIcon.png"
style="width:160px;height:160px;border-radius:15px;margin-bottom:10px;border:2px solid #10b981;object-fit:cover;">

<h3>Cachê Control</h3>

</div>

<div id="modalExcluir">

<div class="modal-content">

<h4 style="margin:0 0 15px 0">Deseja mesmo apagar?</h4>

<div class="modal-btns">

<button class="btn-cancel" onclick="fecharModal()">CANCELAR</button>

<button class="btn-confirm" id="confirmarBtn">EXCLUIR</button>

</div>
</div>
</div>

<div class="semana-selector">

<button class="btn-nav" onclick="mudarSemana(-1)">❮</button>

<div class="semana-label" id="labelSemana">Carregando...</div>

<button class="btn-nav" onclick="mudarSemana(1)">❯</button>

</div>

<div class="dashboard">

<div id="vTotalSemana" class="total-semana">R$ 0,00</div>

<span id="vPgto" class="pgto-info">Pgto previsto: --/--</span>

<div class="chart-container">
<canvas id="graficoPizza"></canvas>
</div>

<div class="custom-legend">

<div class="legend-item">
<div class="legend-color" style="background:#10b981"></div>
<div class="legend-label">Cachê</div>
<div id="legCache" class="legend-value">R$ 0,00</div>
</div>

<div class="legend-item">
<div class="legend-color" style="background:#0ea5e9"></div>
<div class="legend-label">Diária</div>
<div id="legDiaria" class="legend-value">R$ 0,00</div>
</div>

<div class="legend-item">
<div class="legend-color" style="background:#f59e0b"></div>
<div class="legend-label">Extras</div>
<div id="legExtra" class="legend-value">R$ 0,00</div>
</div>

<div class="legend-item">
<div class="legend-color" style="background:#ef4444"></div>
<div class="legend-label">Imposto</div>
<div id="legImposto" class="legend-value">R$ 0,00</div>
</div>

</div>
</div>

<div class="input-group">

<h3 style="margin-top:0;color:#10b981;">⚙️ Configurações</h3>

<label>Tipo de Fechamento</label>

<select id="tipoFechamento">
<option value="semanal">Semanal</option>
<option value="quinzenal">Quinzenal</option>
<option value="mensal">Mensal</option>
</select>

<label>Início da Semana</label>

<select id="inicioSemana">
<option value="1">Segunda-feira</option>
<option value="0">Domingo</option>
</select>

<label>Prazo após fechamento</label>

<select id="prazoPagamento">
<option value="7">7 dias</option>
<option value="15">15 dias</option>
<option value="30">30 dias</option>
</select>

<label>% NF / Imposto</label>

<input type="number" id="percentualNF" placeholder="0" step="0.1">

</div>

<div class="input-group">

<label for="dataJob">Data</label>
<input type="date" id="dataJob">

<label>Nome do Job</label>
<input type="text" id="nomeJob" placeholder="Ex: Comercial">

<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

<div>
<label>Cachê</label>
<input type="number" id="vCacheBase">
</div>

<div>
<label>Diária</label>
<input type="number" id="vDiaria">
</div>

</div>

<div style="display:flex; gap:10px;">

<div style="flex:1">
<label>Início</label>
<input type="time" id="inicio" value="08:00">
</div>

<div style="flex:1">
<label>Fim</label>
<input type="time" id="fim" value="20:00">
</div>

</div>
</div>

<button class="btn" style="background:#f59e0b;color:#000;" onclick="salvarJob()">
💾 SALVAR JOB
</button>

<button class="btn" style="background:#25D366;color:#000;" onclick="enviarRelatorioWhatsApp()">
🟢 ENVIAR PARA WHATSAPP
</button>

<button class="btn btn-export" onclick="baixarExcelCompleto()">
📊 EXPORTAR TUDO (EXCEL)
</button>

<div style="margin-top:20px;">

<input type="text"
id="inputBusca"
onkeyup="filtrarTabela()"
placeholder="🔍 Buscar por job ou data...">

</div>

<div id="listaHistorico"></div>

<script>

var db, meuGrafico, dataReferencia = new Date(), idParaExcluir = null;

// CONFIGS

if(!localStorage.getItem('inicioSemana')){
    localStorage.setItem('inicioSemana','1');
}

if(!localStorage.getItem('tipoFechamento')){
    localStorage.setItem('tipoFechamento','semanal');
}

if(!localStorage.getItem('prazoPagamento')){
    localStorage.setItem('prazoPagamento','7');
}

if(!localStorage.getItem('percentualNF')){
    localStorage.setItem('percentualNF','');
}

window.addEventListener('load', () => {

    document.getElementById('tipoFechamento').value =
        localStorage.getItem('tipoFechamento');

    document.getElementById('inicioSemana').value =
        localStorage.getItem('inicioSemana');

    document.getElementById('prazoPagamento').value =
        localStorage.getItem('prazoPagamento');

    document.getElementById('percentualNF').value =
        localStorage.getItem('percentualNF');

    document.getElementById('tipoFechamento').onchange = salvarConfigs;
    document.getElementById('inicioSemana').onchange = salvarConfigs;
    document.getElementById('prazoPagamento').onchange = salvarConfigs;
    document.getElementById('percentualNF').oninput = salvarConfigs;
});

function salvarConfigs(){

    localStorage.setItem(
        'tipoFechamento',
        document.getElementById('tipoFechamento').value
    );

    localStorage.setItem(
        'inicioSemana',
        document.getElementById('inicioSemana').value
    );

    localStorage.setItem(
        'prazoPagamento',
        document.getElementById('prazoPagamento').value
    );

    localStorage.setItem(
        'percentualNF',
        document.getElementById('percentualNF').value
    );

    atualizarTela();
}

// SISTEMA DE LICENÇA

if(!localStorage.getItem('fader_device_id')) {
    localStorage.setItem('fader_device_id', Math.floor(1000 + Math.random() * 8999));
}

const ID_APARELHO = localStorage.getItem('fader_device_id');

function verificarAtivacao() {

    const licenca = localStorage.getItem('fader_license');

    const chaveCorreta =
        (parseInt(ID_APARELHO) * 7 + 123).toString();

    if (licenca !== chaveCorreta) {

        document.getElementById('telaBloqueio').style.display = 'flex';

        document.getElementById('displayID').innerText =
            "FL-" + ID_APARELHO;

    } else {

        document.getElementById('telaBloqueio').style.display = 'none';
    }
}

function verificarSerial() {

    const input = document.getElementById('inputSerial').value;

    const chaveCorreta =
        (parseInt(ID_APARELHO) * 7 + 123).toString();

    if (input === chaveCorreta) {

        localStorage.setItem('fader_license', input);

        alert("Fader Livre Ativado com Sucesso!");

        location.reload();

    } else {

        alert("Serial Inválido!");
    }
}

var request = indexedDB.open("CacheFinal_V12", 1);

request.onupgradeneeded = (e) => {

    var d = e.target.result;

    if (!d.objectStoreNames.contains("jobs")) {

        d.createObjectStore("jobs", {
            keyPath: "id",
            autoIncrement: true
        });
    }
};

request.onsuccess = (e) => {

    db = e.target.result;

    verificarAtivacao();

    atualizarTela();
};

function mudarSemana(valor){

    const tipo =
        localStorage.getItem('tipoFechamento') || 'semanal';

    if(tipo === 'semanal'){
        dataReferencia.setDate(dataReferencia.getDate() + (valor * 7));
    }

    else if(tipo === 'quinzenal'){
        dataReferencia.setDate(dataReferencia.getDate() + (valor * 15));
    }

    else{
        dataReferencia.setMonth(dataReferencia.getMonth() + valor);
    }

    atualizarTela();
}

function getLimitesSemana(dt) {

    let inicioSemana =
        parseInt(localStorage.getItem('inicioSemana')) || 1;

    let prazoPagamento =
        parseInt(localStorage.getItem('prazoPagamento')) || 7;

    let tipoFechamento =
        localStorage.getItem('tipoFechamento') || 'semanal';

    var d = new Date(dt);

    d.setHours(0,0,0,0);

    let inicio;
    let fim;

    // SEMANAL

    if(tipoFechamento === 'semanal'){

        var dia = d.getDay();

        var diff;

        if(inicioSemana === 1){
            diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
        } else {
            diff = d.getDate() - dia;
        }

        inicio = new Date(d.setDate(diff));

        fim = new Date(inicio);

        fim.setDate(inicio.getDate() + 6);
    }

    // QUINZENAL

    else if(tipoFechamento === 'quinzenal'){

        if(d.getDate() <= 15){

            inicio = new Date(d.getFullYear(), d.getMonth(), 1);

            fim = new Date(d.getFullYear(), d.getMonth(), 15);

        } else {

            inicio = new Date(d.getFullYear(), d.getMonth(), 16);

            fim = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        }
    }

    // MENSAL

    else {

        inicio = new Date(d.getFullYear(), d.getMonth(), 1);

        fim = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    }

    fim.setHours(23,59,59);

    var pgto = new Date(fim);

    pgto.setDate(pgto.getDate() + prazoPagamento);

    return {
        seg: inicio,
        dom: fim,
        pgto: pgto
    };
}

function salvarJob() {

    var dt = document.getElementById('dataJob').value;

    if(!dt) return alert("Selecione a data!");

    var c =
        parseFloat(document.getElementById('vCacheBase').value) || 0;

    var dV =
        parseFloat(document.getElementById('vDiaria').value) || 0;

    var job =
        document.getElementById('nomeJob').value || "Sem Nome";

    var t1 =
        document.getElementById('inicio').value.split(':');

    var t2 =
        document.getElementById('fim').value.split(':');

    var min =
        (parseInt(t2[0])*60 + parseInt(t2[1])) -
        (parseInt(t1[0])*60 + parseInt(t1[1]));

    if(min < 0) min += 1440;

    var exH = Math.max(0, (min/60) - 12);

    var vEx = exH * (c/12);

    var percentualNF =
        parseFloat(localStorage.getItem('percentualNF')) || 0;

    var subtotal = c + dV + vEx;

    var imposto = subtotal * (percentualNF / 100);

    var totalFinal = subtotal - imposto;

    var registro = {
        data: dt,
        job: job,
        cache: c,
        diaria: dV,
        extra: vEx,
        imposto: imposto,
        total: totalFinal
    };

    var tx = db.transaction("jobs", "readwrite");

    tx.objectStore("jobs").add(registro).onsuccess = () => {

        document.getElementById('nomeJob').value = "";
        document.getElementById('dataJob').value = "";
        document.getElementById('vCacheBase').value = "";
        document.getElementById('vDiaria').value = "";
        document.getElementById('inicio').value = "08:00";
        document.getElementById('fim').value = "20:00";

        atualizarTela();
    };
}

function atualizarTela() {

    if(!db) return;

    var limites = getLimitesSemana(dataReferencia);

    document.getElementById('labelSemana').innerHTML =
        limites.seg.toLocaleDateString('pt-BR') +
        " até " +
        limites.dom.toLocaleDateString('pt-BR');

    document.getElementById('vPgto').innerText =
        "Pgto previsto: " +
        limites.pgto.toLocaleDateString('pt-BR');

    var sC=0, sD=0, sE=0, sI=0, totalS=0;

    var lista = document.getElementById('listaHistorico');

    lista.innerHTML = "";

    db.transaction("jobs")
    .objectStore("jobs")
    .openCursor(null, 'prev')
    .onsuccess = (e) => {

        var cursor = e.target.result;

        if(cursor){

            var d = cursor.value;

            var dataJ = new Date(d.data + "T00:00:00");

            if(dataJ >= limites.seg && dataJ <= limites.dom){

                sC += d.cache;
                sD += d.diaria;
                sE += d.extra;
                sI += d.imposto || 0;
                totalS += d.total;

                var card = document.createElement('div');

                card.className = 'history-card';

                card.innerHTML = `
                    <b>${d.data.split('-').reverse().join('/')}</b>
                    - ${d.job}
                    <br>
                    R$ ${d.total.toFixed(2)}
                    <button class="btn-del"
                    onclick="abrirModal(${d.id})">×</button>
                `;

                lista.appendChild(card);
            }

            cursor.continue();

        } else {

            document.getElementById('vTotalSemana').innerText =
                totalS.toLocaleString('pt-BR',{
                    style:'currency',
                    currency:'BRL'
                });

            document.getElementById('legCache').innerText =
                sC.toLocaleString('pt-BR',{
                    style:'currency',
                    currency:'BRL'
                });

            document.getElementById('legDiaria').innerText =
                sD.toLocaleString('pt-BR',{
                    style:'currency',
                    currency:'BRL'
                });

            document.getElementById('legExtra').innerText =
                sE.toLocaleString('pt-BR',{
                    style:'currency',
                    currency:'BRL'
                });

            document.getElementById('legImposto').innerText =
                sI.toLocaleString('pt-BR',{
                    style:'currency',
                    currency:'BRL'
                });

            setTimeout(() => renderGrafico(sC,sD,sE,sI),100);
        }
    };
}

function renderGrafico(c,d,e,i){

    var ctx = document.getElementById('graficoPizza');

    if(!ctx) return;

    if(meuGrafico) meuGrafico.destroy();

    let dados = [c || 1, d || 0, e || 0];

    let cores = ['#10b981','#0ea5e9','#f59e0b'];

    if(i > 0){
        dados.push(i);
        cores.push('#ef4444');
    }

    meuGrafico = new Chart(ctx, {

        type:'doughnut',

        data:{
            datasets:[{
                data:dados,
                backgroundColor:cores,
                borderWidth:0
            }]
        },

        options:{
            cutout:'75%',
            responsive:true,
            maintainAspectRatio:false,
            plugins:{
                legend:{display:false}
            }
        }
    });
}

function abrirModal(id){

    idParaExcluir = id;

    document.getElementById('modalExcluir').style.display = 'flex';
}

function fecharModal(){

    document.getElementById('modalExcluir').style.display = 'none';

    idParaExcluir = null;
}

document.getElementById('confirmarBtn').onclick = function() {

    if(idParaExcluir){

        db.transaction("jobs","readwrite")
        .objectStore("jobs")
        .delete(idParaExcluir)
        .onsuccess = () => {

            fecharModal();

            atualizarTela();
        };
    }
};

function baixarExcelCompleto() {

    var csv =
        "\ufeffData;Job;Cache;Diária;Extra;Imposto;Total geral de cachês\n";

    var totalGeral = 0;

    db.transaction("jobs")
    .objectStore("jobs")
    .openCursor()
    .onsuccess = (e) => {

        var c = e.target.result;

        if (c) {

            csv +=
                `${c.value.data.split('-').reverse().join('/')};` +
                `${c.value.job};` +
                `${c.value.cache.toFixed(2)};` +
                `${c.value.diaria.toFixed(2)};` +
                `${c.value.extra.toFixed(2)};` +
                `${(c.value.imposto || 0).toFixed(2)};` +
                `${c.value.total.toFixed(2)}\n`;

            totalGeral += c.value.total;

            c.continue();

        } else {

            csv +=
                `\n;;;;;TOTAL GERAL;${totalGeral.toFixed(2)}\n`;

            var link = document.createElement("a");

            link.href = URL.createObjectURL(
                new Blob([csv], {
                    type:'text/csv;charset=utf-8;'
                })
            );

            link.download =
                `Relatorio_FaderLivre_${
                    new Date()
                    .toLocaleDateString('pt-BR')
                    .replace(/\//g,'-')
                }.csv`;

            link.click();
        }
    };
}

function filtrarTabela() {

    let input = document.getElementById("inputBusca");

    let filter = input.value.toUpperCase();

    let cards = document.getElementsByClassName("history-card");

    for (let i = 0; i < cards.length; i++) {

        let textoCard = cards[i].innerText.toUpperCase();

        cards[i].style.display =
            textoCard.indexOf(filter) > -1 ? "" : "none";
    }
}

function enviarRelatorioWhatsApp() {

    db.transaction("jobs")
    .objectStore("jobs")
    .getAll()
    .onsuccess = (e) => {

        const dados = e.target.result;

        if (dados.length === 0)
            return alert("Não há dados para exportar!");

        dados.sort((a, b) => new Date(a.data) - new Date(b.data));

        let msg =
            "⭐ *FADER LIVRE - CACHÊ CONTROL* ⭐\n" +
            "==============================\n\n";

        let totalGeral = 0;

        dados.forEach(item => {

            const dt =
                item.data.split('-').reverse().join('/');

            msg +=
                `📅 *DATA:* ${dt}\n` +
                `🎬 *JOB:* ${item.job.toUpperCase()}\n` +
                `💰 *VALOR:* R$ ${item.total.toFixed(2)}\n` +
                `------------------------------\n`;

            totalGeral += item.total;
        });

        msg +=
            `\n✅ *TOTAL ACUMULADO:* R$ ${totalGeral.toFixed(2)}\n\n` +
            `_Relatório gerado em: ${
                new Date().toLocaleString('pt-BR')
            }_`;

        window.open(
            `https://wa.me/?text=${encodeURIComponent(msg)}`
        );
    };
}

</script>
