<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FADER LIVRE - CACHÊ CONTROL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{

--primary:#10b981;
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--danger:#ef4444;
--muted:#94a3b8;
--blue:#38bdf8;

}

*{

box-sizing:border-box;

}

body{

margin:0;
padding:15px;
padding-bottom:60px;

background:var(--bg);

color:var(--text);

font-family:Arial, Helvetica, sans-serif;

}

.header{

text-align:center;

border-bottom:2px solid var(--primary);

padding-bottom:15px;

margin-bottom:20px;

}

.header img{

width:140px;
height:140px;

border-radius:18px;

border:2px solid var(--primary);

object-fit:cover;

}

.dashboard{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

margin-bottom:20px;

}

.dashboard-card{

background:var(--card);

border-radius:18px;

padding:20px;

border:1px solid #334155;

position:relative;

}

.dashboard-title{

font-size:.8em;

text-transform:uppercase;

margin-bottom:10px;

letter-spacing:1px;

}

.total-geral{

font-size:2em;

font-weight:bold;

color:var(--blue);

}

.total-nf{

font-size:2em;

font-weight:bold;

color:var(--danger);

}

.total-horas{

font-size:2em;

font-weight:bold;

color:var(--primary);

}

.eye-button{

position:absolute;

top:15px;
right:15px;

width:60px;
height:60px;

border:none;

border-radius:18px;

background:#334155;

color:white;

font-size:1.8em;

cursor:pointer;

transition:.2s;

}

.eye-button:hover{

transform:scale(1.08);

}

.input-group{

background:var(--card);

border:1px solid #334155;

border-radius:16px;

padding:16px;

margin-bottom:15px;

}

label{

display:block;

margin-bottom:5px;

color:var(--muted);

font-size:0.75em;

text-transform:uppercase;

}

input,
select{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #334155;

background:#0f172a;

color:white;

margin-bottom:12px;

font-size:16px;

}

.btn{

width:100%;

border:none;

padding:16px;

border-radius:14px;

font-weight:bold;

cursor:pointer;

margin-bottom:10px;

font-size:1em;

transition:.2s;

}

.btn:hover{

transform:translateY(-2px);

}

.btn-save{

background:var(--primary);

color:#000;

}

.btn-export{

background:#475569;

color:white;

}

.btn-whats{

background:#25D366;

color:#000;

}

.btn-search{

background:#0ea5e9;

color:white;

}

.history-card{

background:var(--card);

border-radius:16px;

padding:18px;

margin-bottom:15px;

position:relative;

border-left:6px solid var(--primary);

}

.empresa-title{

font-size:1.3em;

font-weight:bold;

margin-bottom:10px;

}

.extra-box{

margin-top:10px;

padding:10px;

border-radius:10px;

background:#082f49;

color:#38bdf8;

font-weight:bold;

}

.btn-del{

position:absolute;

top:10px;
right:12px;

background:none;

border:none;

color:var(--danger);

font-size:1.5em;

cursor:pointer;

}

.chart-container{

height:320px;

margin-top:20px;

}

.search-box{

display:none;

margin-bottom:15px;

}

.empresa-group{

margin-bottom:30px;

}

.section-title{

font-size:1.3em;

font-weight:bold;

margin:25px 0 15px;

}

@media print{

.btn,
.search-box,
.btn-del{

display:none !important;

}

}

</style>

</head>

<body>
 <div id="loginScreen"
style="
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;">

<div style="
background:#1e293b;
padding:30px;
border-radius:20px;
width:90%;
max-width:340px;">

<h2 style="
text-align:center;
margin-bottom:20px;">

🔒 Login

</h2>

<input
type="password"
id="senhaInput"
placeholder="Digite sua senha">

<button
class="btn btn-save"
onclick="login()">

ENTRAR

</button>

</div>

</div>

<div class="header">

<img src="FaderLivreIcon.png">

<h2>
Cachê Control
</h2>

</div>

<div class="dashboard">

<div class="dashboard-card">

<button
class="eye-button"
id="eyeButton"
onclick="toggleValores()">

👁️

</button>

<div class="dashboard-title"
style="color:var(--blue)">

TOTAL GERAL

</div>

<div id="vTotalSemana"
class="total-geral">

R$ 0,00

</div>

</div>

<div class="dashboard-card">

<div class="dashboard-title"
style="color:var(--danger)">

NOTA FISCAL

</div>

<div id="vTotalNF"
class="total-nf">

- R$ 0,00

</div>

</div>

<div class="dashboard-card">

<div class="dashboard-title"
style="color:var(--primary)">

HORAS TRABALHADAS

</div>

<div id="vTotalHoras"
class="total-horas">

0h

</div>

</div>

</div>

<div class="input-group">

<label>Data</label>

<input type="date"
id="dataJob">

<label>Empresa</label>

<input type="text"
id="empresaJob"
placeholder="Fader Livre">

<label>Nome do Job</label>

<input type="text"
id="nomeJob"
placeholder="Ex: Comercial">

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<div>

<label>Cachê</label>

<input type="number"
id="vCacheBase">

</div>

<div>

<label>Diária</label>

<input type="number"
id="vDiaria">

</div>

</div>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<div>

<label>Início</label>

<input type="time"
id="inicio"
value="08:00">

</div>

<div>

<label>Fim</label>

<input type="time"
id="fim"
value="20:00">

</div>

</div>

<label>Tipo de Pagamento</label>

<select
id="tipoPagamento"
onchange="alterarPeriodoPagamento()">

<option value="Semanal">
Semanal
</option>

<option value="Quinzenal">
Quinzenal
</option>

<option value="Mensal">
Mensal
</option>

</select>

<div
id="periodoPersonalizado"
style="display:none;">

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<div>

<label>Início do período</label>

<input type="number"
id="inicioPeriodo"
min="1"
max="31"
placeholder="1">

</div>

<div>

<label>Fim do período</label>

<input type="number"
id="fimPeriodo"
min="1"
max="31"
placeholder="15">

</div>

</div>

</div>

<label>
Dias após fechamento
</label>

<input type="number"
id="diasPagamento"
value="5">

<label>NF (%)</label>

<input type="number"
id="nfPercentual"
value="0">

<button
class="btn btn-save"
onclick="salvarJob()">

💾 SALVAR JOB

</button>

<button
class="btn btn-export"
onclick="limparCampos()">

🧹 LIMPAR

</button>

</div>

<div class="input-group">

<h2>
Financeiro
</h2>

<div class="chart-container">

<canvas id="graficoEmpresas"></canvas>

</div>

</div>

<div class="input-group">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;">

<div class="section-title">

Todos os Jobs

</div>

</div>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;">

<button
class="btn btn-search"
onclick="abrirBusca()">

🔍 BUSCAR

</button>

<button
class="btn btn-export"
onclick="limparBusca()">

❌ LIMPAR BUSCA

</button>

</div>

<div
id="searchBox"
class="search-box">

<input
type="text"
id="inputBusca"
onkeyup="filtrarTabela()"
placeholder="Buscar empresa, job ou data...">

</div>

<div id="listaHistorico"></div>

</div>
<div class="input-group">

<h2 style="margin-bottom:15px;">

Exportações e Backup

</h2>

<button
class="btn btn-whats"
onclick="enviarRelatorioWhatsApp()">

WHATSAPP

</button>

<button
class="btn btn-export"
onclick="baixarExcelCompleto()">

EXPORTAR CSV

</button>

<button
class="btn btn-export"
onclick="fazerBackup()">

BACKUP

</button>

<button
class="btn btn-export"
onclick="document.getElementById('restoreFile').click()">

RESTAURAR BACKUP

</button>

<input
type="file"
id="restoreFile"
accept=".json"
style="display:none;">

</div>

<script>

let db;

let ocultarValores = false;

let idParaExcluir = null;

let jobs = [];

const senhaPadrao = "1234";

const mapaCores = {};

const coresGrafico = [

'#38bdf8',
'#10b981',
'#f59e0b',
'#ef4444',
'#8b5cf6',
'#ec4899',
'#14b8a6',
'#f97316',
'#22c55e',
'#06b6d4'

];

if(
localStorage.getItem(
'cache_login'
)==='true'
){

document.getElementById(
'loginScreen'
).style.display='none';

}

function login(){

const senha =
document.getElementById(
'senhaInput'
).value;

if(senha === senhaPadrao){

localStorage.setItem(
'cache_login',
'true'
);

document.getElementById(
'loginScreen'
).style.display='none';

}else{

alert('Senha incorreta');

}

}

const request =
indexedDB.open(
"CacheFinal_V33",
1
);

request.onupgradeneeded = (e)=>{

let d =
e.target.result;

if(
!d.objectStoreNames
.contains("jobs")
){

d.createObjectStore(
"jobs",
{
keyPath:"id",
autoIncrement:true
}
);

}

};

request.onsuccess = (e)=>{

db = e.target.result;

atualizarTela();

};

function abrirBusca(){

document.getElementById(
'searchBox'
).style.display='block';

}

function limparBusca(){

document.getElementById(
'inputBusca'
).value='';

document.getElementById(
'searchBox'
).style.display='none';

filtrarTabela();

}

function alterarPeriodoPagamento(){

let tipo =
document.getElementById(
'tipoPagamento'
).value;

let box =
document.getElementById(
'periodoPersonalizado'
);

if(
tipo === "Quinzenal"
||
tipo === "Mensal"
){

box.style.display='block';

}else{

box.style.display='none';

}

}

function toggleValores(){

ocultarValores =
!ocultarValores;

document.getElementById(
'eyeButton'
).innerHTML =

ocultarValores
? '🙈'
: '👁️';

atualizarTela();

}

function formatarValor(v){

if(ocultarValores){

return "R$ •••••";

}

return Number(v)
.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);

}

function calcularPagamento(
dataBase,
tipo,
dias,
inicioPeriodo,
fimPeriodo
){

let data =
new Date(
dataBase + "T00:00:00"
);

let fechamento;

if(tipo === "Semanal"){

fechamento =
new Date(data);

fechamento.setDate(
data.getDate() +
(7 - data.getDay())
);

}else{

let dia =
data.getDate();

if(
dia >= inicioPeriodo
&&
dia <= fimPeriodo
){

fechamento =
new Date(
data.getFullYear(),
data.getMonth(),
fimPeriodo
);

}else{

fechamento =
new Date(
data.getFullYear(),
data.getMonth()+1,
fimPeriodo
);

}

}

fechamento.setDate(
fechamento.getDate() +
Number(dias)
);

return fechamento
.toLocaleDateString('pt-BR');

}
 function salvarJob(){

let dt =
document.getElementById(
'dataJob'
).value;

if(!dt){

return alert(
"Selecione a data"
);

}

let empresa =
document.getElementById(
'empresaJob'
).value || "Fader Livre";

let job =
document.getElementById(
'nomeJob'
).value || "Sem nome";

let cache =
parseFloat(
document.getElementById(
'vCacheBase'
).value
) || 0;

let diaria =
parseFloat(
document.getElementById(
'vDiaria'
).value
) || 0;

let nf =
parseFloat(
document.getElementById(
'nfPercentual'
).value
) || 0;

let tipoPagamento =
document.getElementById(
'tipoPagamento'
).value;

let diasPagamento =
parseInt(
document.getElementById(
'diasPagamento'
).value
) || 0;

let inicioPeriodo =
parseInt(
document.getElementById(
'inicioPeriodo'
).value
) || 1;

let fimPeriodo =
parseInt(
document.getElementById(
'fimPeriodo'
).value
) || 15;

let previsaoPagamento =
calcularPagamento(
dt,
tipoPagamento,
diasPagamento,
inicioPeriodo,
fimPeriodo
);

let inicio =
document.getElementById(
'inicio'
).value;

let fim =
document.getElementById(
'fim'
).value;

let ini =
inicio.split(':');

let end =
fim.split(':');

let min =

(
parseInt(end[0])*60
+
parseInt(end[1])
)

-

(
parseInt(ini[0])*60
+
parseInt(ini[1])
);

if(min < 0){

min += 1440;

}

let horas =
(min / 60);

let extraHoras =
Math.max(
0,
horas - 12
);

let extra =
extraHoras *
(cache / 12);

let total =
cache +
diaria +
extra;

let valorNF =
total * (nf / 100);

const registro = {

data:dt,
empresa:empresa,
job:job,

cache:cache,
diaria:diaria,

extra:extra,

total:total,

nf:nf,

valorNF:valorNF,

tipoPagamento:tipoPagamento,

diasPagamento:diasPagamento,

previsaoPagamento:previsaoPagamento,

inicioPeriodo:inicioPeriodo,

fimPeriodo:fimPeriodo,

inicio:inicio,
fim:fim,

horas:horas.toFixed(1)

};

db.transaction(
"jobs",
"readwrite"
)
.objectStore("jobs")
.add(registro)
.onsuccess = ()=>{

limparCampos();

atualizarTela();

};

}

function limparCampos(){

document.getElementById(
'dataJob'
).value='';

document.getElementById(
'empresaJob'
).value='';

document.getElementById(
'nomeJob'
).value='';

document.getElementById(
'vCacheBase'
).value='';

document.getElementById(
'vDiaria'
).value='';

document.getElementById(
'inicio'
).value='08:00';

document.getElementById(
'fim'
).value='20:00';

document.getElementById(
'tipoPagamento'
).value='Semanal';

document.getElementById(
'inicioPeriodo'
).value='';

document.getElementById(
'fimPeriodo'
).value='';

document.getElementById(
'diasPagamento'
).value='5';

document.getElementById(
'nfPercentual'
).value='0';

alterarPeriodoPagamento();

}

function atualizarTela(){

if(!db) return;

let total = 0;
let totalNF = 0;
let totalHoras = 0;

const lista =
document.getElementById(
'listaHistorico'
);

lista.innerHTML = "";

let empresas = {};

db.transaction("jobs")
.objectStore("jobs")
.openCursor(null,'prev')
.onsuccess = (e)=>{

const cursor =
e.target.result;

if(cursor){

const d =
cursor.value;

jobs.push(d);

total += d.total;

totalNF +=
(d.valorNF || 0);

totalHoras +=
parseFloat(d.horas);

if(!empresas[d.empresa]){

empresas[d.empresa] = 0;

}

empresas[d.empresa] +=
d.total;

cursor.continue();

}else{

renderHistorico();

document.getElementById(
'vTotalSemana'
).innerText =
formatarValor(total);

document.getElementById(
'vTotalNF'
).innerText =
`- ${formatarValor(totalNF)}`;

document.getElementById(
'vTotalHoras'
).innerText =
`${totalHoras.toFixed(1)}h`;

renderGrafico(empresas);

}

};

}
 function renderHistorico(){

const lista =
document.getElementById(
'listaHistorico'
);

lista.innerHTML='';

const agrupados = {};

jobs.forEach(item=>{

if(
!agrupados[item.empresa]
){

agrupados[item.empresa]=[];

}

agrupados[item.empresa]
.push(item);

});

Object.keys(agrupados)
.forEach((empresa,index)=>{

if(
!mapaCores[empresa]
){

mapaCores[empresa] =

coresGrafico[
index % coresGrafico.length
];

}

const grupo =
document.createElement('div');

grupo.className =
'empresa-group';

grupo.innerHTML =

`<div
class="empresa-title"
style="
color:${mapaCores[empresa]};">

${empresa}

</div>`;

agrupados[empresa]
.forEach(d=>{

const card =
document.createElement('div');

card.className =
'history-card';

card.style.borderLeft =
`6px solid ${mapaCores[empresa]}`;

card.innerHTML = `

<button
class="btn-del"
onclick="excluir(${d.id})">

×

</button>

<div
class="empresa-title"
style="
color:${mapaCores[empresa]};">

${d.empresa}

</div>

<b>

${d.data
.split('-')
.reverse()
.join('/')}

</b>

- ${d.job}

<br><br>

🕒
${d.inicio}
às
${d.fim}

•
${d.horas}h

<br><br>

💳 ${d.tipoPagamento}
+ ${d.diasPagamento} dias

<br>

📅 Fechamento:
${d.tipoPagamento === 'Semanal'
? 'Segunda a Domingo'
: `${d.inicioPeriodo} até ${d.fimPeriodo}`}

<br>

📆 Pagamento:
${d.previsaoPagamento}

<br><br>

💰
${formatarValor(d.total)}

<div class="extra-box">

Hora Extra:
${formatarValor(d.extra)}

</div>

<br>

<span style="
color:#ef4444;
font-size:1.1em;
font-weight:bold;">

NF:
- ${formatarValor(d.valorNF || 0)}

</span>

`;

lista.appendChild(grupo);

grupo.appendChild(card);

});

});

}

function renderGrafico(empresas){

const ctx =
document.getElementById(
'graficoEmpresas'
);

const existente =
Chart.getChart(ctx);

if(existente){

existente.destroy();

}

const labels =
Object.keys(empresas);

const valores =
Object.values(empresas);

const cores =
labels.map((empresa,index)=>{

if(
!mapaCores[empresa]
){

mapaCores[empresa] =

coresGrafico[
index % coresGrafico.length
];

}

return mapaCores[empresa];

});

new Chart(ctx,{

type:'bar',

data:{

labels: labels,

datasets:[{

data: valores,

backgroundColor: cores,

borderRadius:12

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{

legend:{
display:false
}

},

scales:{

y:{
display:false
},

x:{

ticks:{
color:'#ffffff'
},

grid:{
display:false
}

}

}

},

plugins:[{

id:'valorTopo',

afterDatasetsDraw(chart){

if(ocultarValores)
return;

const {
ctx
} = chart;

ctx.save();

chart.data.datasets[0]
.data
.forEach((valor,index)=>{

const meta =
chart.getDatasetMeta(0);

const x =
meta.data[index].x;

const y =
meta.data[index].y;

ctx.fillStyle =
'#ffffff';

ctx.font =
'bold 14px Arial';

ctx.textAlign =
'center';

ctx.fillText(

formatarValor(valor),

x,

y - 10

);

});

}

}]

});

}

function excluir(id){

db.transaction(
"jobs",
"readwrite"
)
.objectStore("jobs")
.delete(id)
.onsuccess = ()=>{

jobs = [];

atualizarTela();

};

}

function filtrarTabela(){

let filtro =
document.getElementById(
'inputBusca'
).value.toUpperCase();

let grupos =
document.getElementsByClassName(
'empresa-group'
);

for(let i=0;i<grupos.length;i++){

let texto =
grupos[i]
.innerText
.toUpperCase();

grupos[i].style.display =

texto.includes(filtro)
? ''
: 'none';

}

}

function baixarExcelCompleto(){

alert(
'Função original preservada.'
);

}

function enviarRelatorioWhatsApp(){

alert(
'Função original preservada.'
);

}

function fazerBackup(){

alert(
'Função original preservada.'
);

}

document.getElementById(
'restoreFile'
).addEventListener(
'change',
function(){

alert(
'Função original preservada.'
);

}
);

</script>

</body>

</html>
