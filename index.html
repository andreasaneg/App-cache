<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FADER LIVRE - CACHÊ CONTROL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --primary:#10b981;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --extra:#f59e0b;
    --diaria:#0ea5e9;
    --danger:#ef4444;
    --muted:#94a3b8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    padding-bottom:60px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
}

.header{
    text-align:center;
    border-bottom:2px solid var(--primary);
    padding-bottom:15px;
    margin-bottom:20px;
}

.header img{
    width:140px;
    height:140px;
    border-radius:18px;
    border:2px solid var(--primary);
    object-fit:cover;
}

.header h2{
    margin:10px 0 0 0;
}

.semana-selector{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--primary);
    padding:10px;
    border-radius:14px;
    margin-bottom:18px;
}

.btn-nav{
    background:var(--primary);
    border:none;
    color:#000;
    font-size:1.2em;
    font-weight:bold;
    padding:10px 18px;
    border-radius:10px;
}

.semana-label{
    text-align:center;
    flex:1;
    font-weight:bold;
    font-size:0.9em;
}

.dashboard{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    border:1px solid #334155;
    text-align:center;
}

.total-semana{
    font-size:2.4em;
    font-weight:bold;
    color:var(--primary);
}

.pgto-info{
    display:block;
    margin-top:8px;
    color:var(--muted);
    font-size:0.95em;
}

.chart-container{
    height:220px;
    margin-top:15px;
}

.custom-legend{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.legend-item{
    text-align:center;
}

.legend-color{
    width:14px;
    height:14px;
    border-radius:4px;
    margin:auto;
    margin-bottom:6px;
}

.legend-label{
    font-size:0.7em;
    color:var(--muted);
    text-transform:uppercase;
}

.legend-value{
    font-weight:bold;
    font-size:0.9em;
}

.input-group{
    background:var(--card);
    border:1px solid #334155;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    color:var(--muted);
    font-size:0.75em;
    text-transform:uppercase;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    margin-bottom:12px;
    font-size:16px;
}

.btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
    font-size:1em;
}

.btn-save{
    background:var(--primary);
    color:#000;
}

.btn-export{
    background:#475569;
    color:white;
}

.btn-whats{
    background:#25D366;
    color:#000;
}

.history-card{
    background:var(--card);
    border-left:4px solid var(--primary);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
    position:relative;
}

.btn-del{
    position:absolute;
    top:10px;
    right:12px;
    background:none;
    border:none;
    color:var(--danger);
    font-size:1.5em;
}

#modalExcluir{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:var(--card);
    border:1px solid var(--danger);
    border-radius:18px;
    padding:25px;
    width:90%;
    max-width:320px;
    text-align:center;
}

.modal-btns{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn-confirm,
.btn-cancel{
    flex:1;
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:bold;
}

.btn-confirm{
    background:var(--danger);
    color:white;
}

.btn-cancel{
    background:#475569;
    color:white;
}

#telaBloqueio{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:var(--bg);
    z-index:10000;
    padding:30px;
    text-align:center;
    flex-direction:column;
    justify-content:center;
}

@media print{

    body{
        background:white;
        color:black;
    }

    .btn,
    .btn-nav,
    #inputBusca,
    #modalExcluir{
        display:none !important;
    }

    .dashboard,
    .input-group,
    .history-card{
        border:1px solid #ccc;
        background:white;
        color:black;
    }

}

</style>

</head>

<body>

<div id="telaBloqueio">

    <h2 style="color:var(--primary)">
        FADER LIVRE
    </h2>

    <p style="color:var(--muted)">
        Aplicativo não ativado
    </p>

    <div style="background:var(--card);
    padding:20px;
    border-radius:14px;
    border:1px solid #334155;
    margin:20px 0;">

        <label>ID DO APARELHO</label>

        <div id="displayID"
        style="font-size:2em;
        font-weight:bold;
        color:var(--extra);
        margin-top:10px;">
        </div>

    </div>

    <input type="text"
    id="inputSerial"
    placeholder="Digite o serial de ativação">

    <button class="btn btn-save"
    onclick="verificarSerial()">
        ATIVAR AGORA
    </button>

</div>

<div class="header">

    <img src="FaderLivreIcon.png">

    <h2>Cachê Control</h2>

</div>

<div id="modalExcluir">

    <div class="modal-content">

        <h3>Deseja apagar este registro?</h3>

        <div class="modal-btns">

            <button class="btn-cancel"
            onclick="fecharModal()">
                CANCELAR
            </button>

            <button class="btn-confirm"
            id="confirmarBtn">
                EXCLUIR
            </button>

        </div>

    </div>

</div>

<div class="semana-selector">

    <button class="btn-nav"
    onclick="mudarSemana(-7)">
        ❮
    </button>

    <div class="semana-label"
    id="labelSemana">
        Carregando...
    </div>

    <button class="btn-nav"
    onclick="mudarSemana(7)">
        ❯
    </button>

</div>

<div class="dashboard">

    <div id="vTotalSemana"
    class="total-semana">
        R$ 0,00
    </div>

    <span id="vPgto"
    class="pgto-info">
        Pagamento previsto: --
    </span>

    <div class="chart-container">
        <canvas id="graficoPizza"></canvas>
    </div>

    <div class="custom-legend">

        <div class="legend-item">
            <div class="legend-color"
            style="background:var(--primary)">
            </div>

            <div class="legend-label">
                Cachê
            </div>

            <div id="legCache"
            class="legend-value">
                R$ 0,00
            </div>
        </div>

        <div class="legend-item">

            <div class="legend-color"
            style="background:var(--diaria)">
            </div>

            <div class="legend-label">
                Diária
            </div>

            <div id="legDiaria"
            class="legend-value">
                R$ 0,00
            </div>

        </div>

        <div class="legend-item">

            <div class="legend-color"
            style="background:var(--extra)">
            </div>

            <div class="legend-label">
                Extras
            </div>

            <div id="legExtra"
            class="legend-value">
                R$ 0,00
            </div>

        </div>

        <div class="legend-item">

            <div class="legend-color"
            style="background:#ef4444">
            </div>

            <div class="legend-label">
                NF
            </div>

            <div id="legNF"
            class="legend-value"
            style="color:#ef4444;">
                R$ 0,00
            </div>

        </div>

    </div>

</div>

<div class="input-group">

    <label>Data</label>

    <input type="date"
    id="dataJob">

    <label>Nome do Job</label>

    <input type="text"
    id="nomeJob"
    placeholder="Ex: Comercial">

    <div style="display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;">

        <div>

            <label>Cachê</label>

            <input type="number"
            id="vCacheBase">

        </div>

        <div>

            <label>Diária</label>

            <input type="number"
            id="vDiaria">

        </div>

    </div>

    <div style="display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;">

        <div>

            <label>Início</label>

            <input type="time"
            id="inicio"
            value="08:00">

        </div>

        <div>

            <label>Fim</label>

            <input type="time"
            id="fim"
            value="20:00">

        </div>

    </div>

    <label>Tipo de Pagamento</label>

    <select id="tipoPagamento"
    onchange="toggleQuinzena()">

        <option value="semanal">
            Semanal
        </option>

        <option value="quinzenal">
            Quinzenal
        </option>

        <option value="mensal">
            Mensal
        </option>

    </select>

    <div id="boxQuinzena"
    style="display:none;">

        <label>Período Quinzenal</label>

        <div style="display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;">

            <div>

                <input type="date"
                id="quinzenaInicio">

            </div>

            <div>

                <input type="date"
                id="quinzenaFim">

            </div>

        </div>

        <label>Prazo em dias</label>

        <input type="number"
        id="prazoQuinzena"
        value="15">

    </div>

    <label>NF (%)</label>

    <input type="number"
    id="nfPercentual"
    value="0">

</div>

<button class="btn btn-save"
onclick="salvarJob()">

💾 SALVAR JOB

</button>

<button class="btn btn-whats"
onclick="enviarRelatorioWhatsApp()">

🟢 ENVIAR PARA WHATSAPP

</button>

<button class="btn btn-export"
onclick="baixarExcelCompleto()">

📊 EXPORTAR EXCEL

</button>

<div style="margin-top:20px;">

    <input
    type="text"
    id="inputBusca"
    onkeyup="filtrarTabela()"
    placeholder="🔍 Buscar por job ou data..."
    style="border:2px solid var(--primary)">

</div>

<div id="listaHistorico"></div>

<script>

let db;
let meuGrafico;
let dataReferencia = new Date();
let idParaExcluir = null;

/* ========= LICENÇA ========= */

if(!localStorage.getItem('fader_device_id')){

    const novoID =
        Date.now().toString(36)
        +
        Math.random()
        .toString(36)
        .substring(2,8);

    localStorage.setItem(
        'fader_device_id',
        novoID
    );

}

const ID_APARELHO =
    localStorage.getItem(
        'fader_device_id'
    );

function gerarChave(id){

    return btoa(id + "_FADER_2026")
    .replace(/=/g,'');

}

function verificarAtivacao(){

    const licenca =
        localStorage.getItem(
            'fader_license'
        );

    const chaveCorreta =
        gerarChave(ID_APARELHO);

    if(licenca !== chaveCorreta){

        document.getElementById(
            'telaBloqueio'
        ).style.display = 'flex';

        document.getElementById(
            'displayID'
        ).innerText =
            "FL-"
            +
            ID_APARELHO
            .substring(0,10);

    }

}

function verificarSerial(){

    const input =
        document.getElementById(
            'inputSerial'
        ).value.trim();

    const chaveCorreta =
        gerarChave(ID_APARELHO);

    if(input === chaveCorreta){

        localStorage.setItem(
            'fader_license',
            input
        );

        alert("Aplicativo ativado!");

        location.reload();

    }else{

        alert("Serial inválido!");

    }

}

/* ========= DATABASE ========= */

const request =
    indexedDB.open(
        "CacheFinal_V16",
        1
    );

request.onupgradeneeded = (e)=>{

    let d = e.target.result;

    if(!d.objectStoreNames.contains("jobs")){

        d.createObjectStore(
            "jobs",
            {
                keyPath:"id",
                autoIncrement:true
            }
        );

    }

};

request.onsuccess = (e)=>{

    db = e.target.result;

    verificarAtivacao();

    atualizarTela();

};

/* ========= QUINZENA ========= */

function toggleQuinzena(){

    const tipo =
        document.getElementById(
            'tipoPagamento'
        ).value;

    document.getElementById(
        'boxQuinzena'
    ).style.display =
        tipo === 'quinzenal'
        ? 'block'
        : 'none';

}

/* ========= SEMANA ========= */

function mudarSemana(dias){

    dataReferencia.setDate(
        dataReferencia.getDate()
        + dias
    );

    atualizarTela();

}

function getLimitesSemana(data){

    let d = new Date(data);

    d.setHours(0,0,0,0);

    let dia = d.getDay();

    let diff =
        d.getDate()
        - dia
        + (dia === 0 ? -6 : 1);

    let segunda =
        new Date(
            d.setDate(diff)
        );

    let domingo =
        new Date(segunda);

    domingo.setDate(
        segunda.getDate() + 6
    );

    domingo.setHours(23,59,59);

    return {
        seg:segunda,
        dom:domingo
    };

}

/* ========= PAGAMENTO ========= */

function calcularPagamento(dataStr, tipo){

    const data =
        new Date(dataStr + "T00:00:00");

    /* ========= SEMANAL ========= */

    if(tipo === "semanal"){

        let inicioSemana =
            new Date(data);

        let dia =
            inicioSemana.getDay();

        let diff =
            inicioSemana.getDate()
            - dia
            + (dia === 0 ? -6 : 1);

        inicioSemana.setDate(diff);

        let domingo =
            new Date(inicioSemana);

        domingo.setDate(
            inicioSemana.getDate() + 6
        );

        let pagamento =
            new Date(domingo);

        pagamento.setDate(
            domingo.getDate() + 5
        );

        return pagamento;

    }

    /* ========= QUINZENAL ========= */

    if(tipo === "quinzenal"){

        const fim =
            document.getElementById(
                'quinzenaFim'
            ).value;

        const prazo =
            parseInt(
                document.getElementById(
                    'prazoQuinzena'
                ).value
            ) || 15;

        if(!fim){

            return data;

        }

        let pagamento =
            new Date(fim + "T00:00:00");

        pagamento.setDate(
            pagamento.getDate()
            + prazo
        );

        return pagamento;

    }

    /* ========= MENSAL ========= */

    if(tipo === "mensal"){

        let ano =
            data.getFullYear();

        let mes =
            data.getMonth() + 1;

        let contador = 0;

        let dia = 1;

        while(contador < 5){

            let d =
                new Date(
                    ano,
                    mes,
                    dia
                );

            let semana =
                d.getDay();

            if(semana !== 0
            && semana !== 6){

                contador++;

            }

            dia++;

        }

        return new Date(
            ano,
            mes,
            dia - 1
        );

    }

}

/* ========= SALVAR ========= */

function salvarJob(){

    let dt =
        document.getElementById(
            'dataJob'
        ).value;

    if(!dt){

        return alert(
            "Selecione a data!"
        );

    }

    let cache =
        parseFloat(
            document.getElementById(
                'vCacheBase'
            ).value
        ) || 0;

    let diaria =
        parseFloat(
            document.getElementById(
                'vDiaria'
            ).value
        ) || 0;

    let nf =
        parseFloat(
            document.getElementById(
                'nfPercentual'
            ).value
        ) || 0;

    let job =
        document.getElementById(
            'nomeJob'
        ).value
        || "Sem nome";

    let tipoPagamento =
        document.getElementById(
            'tipoPagamento'
        ).value;

    let inicio =
        document.getElementById(
            'inicio'
        ).value
        .split(':');

    let fim =
        document.getElementById(
            'fim'
        ).value
        .split(':');

    let min =
        (parseInt(fim[0])*60
        + parseInt(fim[1]))
        -
        (parseInt(inicio[0])*60
        + parseInt(inicio[1]));

    if(min < 0){

        min += 1440;

    }

    let extraHoras =
        Math.max(
            0,
            (min/60) - 12
        );

    let extra =
        extraHoras * (cache / 12);

    let total =
        cache + diaria + extra;

    let valorNF =
        total * (nf / 100);

    let pagamento =
        calcularPagamento(
            dt,
            tipoPagamento
        );

    const registro = {

        data:dt,
        job:job,
        cache:cache,
        diaria:diaria,
        extra:extra,
        total:total,
        nf:nf,
        valorNF:valorNF,
        pagamento:pagamento.toISOString(),
        tipoPagamento:tipoPagamento

    };

    let tx =
        db.transaction(
            "jobs",
            "readwrite"
        );

    tx.objectStore("jobs")
    .add(registro)
    .onsuccess = ()=>{

        document.getElementById(
            'nomeJob'
        ).value = "";

        atualizarTela();

    };

}

/* ========= TELA ========= */

function atualizarTela(){

    if(!db) return;

    const limites =
        getLimitesSemana(
            dataReferencia
        );

    document.getElementById(
        'labelSemana'
    ).innerHTML =

        limites.seg
        .toLocaleDateString('pt-BR')

        +

        " até "

        +

        limites.dom
        .toLocaleDateString('pt-BR');

    let sC=0;
    let sD=0;
    let sE=0;
    let sNF=0;
    let total=0;

    const lista =
        document.getElementById(
            'listaHistorico'
        );

    lista.innerHTML = "";

    db.transaction("jobs")
    .objectStore("jobs")
    .openCursor(null,'prev')
    .onsuccess = (e)=>{

        const cursor =
            e.target.result;

        if(cursor){

            const d =
                cursor.value;

            const dataJ =
                new Date(
                    d.data
                    + "T00:00:00"
                );

            if(dataJ >= limites.seg
            && dataJ <= limites.dom){

                sC += d.cache;
                sD += d.diaria;
                sE += d.extra;
                sNF += d.valorNF || 0;

                total += d.total;

                const card =
                    document.createElement('div');

                card.className =
                    'history-card';

                card.innerHTML = `

                    <b>
                    ${d.data
                    .split('-')
                    .reverse()
                    .join('/')}
                    </b>

                    - ${d.job}

                    <br><br>

                    💰 Total:
                    <b>

                    ${d.total
                    .toLocaleString(
                        'pt-BR',
                        {
                            style:'currency',
                            currency:'BRL'
                        }
                    )}

                    </b>

                    <br>

                    📄 NF:
                    <b style="color:#ef4444;">

                    ${d.valorNF
                    .toLocaleString(
                        'pt-BR',
                        {
                            style:'currency',
                            currency:'BRL'
                        }
                    )}

                    </b>

                    <br>

                    📅 Previsão:
                    <b style="color:#10b981;">

                    ${new Date(d.pagamento)
                    .toLocaleDateString('pt-BR')}

                    </b>

                    <button
                    class="btn-del"
                    onclick="abrirModal(${d.id})">
                    ×
                    </button>

                `;

                lista.appendChild(card);

            }

            cursor.continue();

        }else{

            document.getElementById(
                'vTotalSemana'
            ).innerText =

                total.toLocaleString(
                    'pt-BR',
                    {
                        style:'currency',
                        currency:'BRL'
                    }
                );

            document.getElementById(
                'legCache'
            ).innerText =

                sC.toLocaleString(
                    'pt-BR',
                    {
                        style:'currency',
                        currency:'BRL'
                    }
                );

            document.getElementById(
                'legDiaria'
            ).innerText =

                sD.toLocaleString(
                    'pt-BR',
                    {
                        style:'currency',
                        currency:'BRL'
                    }
                );

            document.getElementById(
                'legExtra'
            ).innerText =

                sE.toLocaleString(
                    'pt-BR',
                    {
                        style:'currency',
                        currency:'BRL'
                    }
                );

            document.getElementById(
                'legNF'
            ).innerText =

                sNF.toLocaleString(
                    'pt-BR',
                    {
                        style:'currency',
                        currency:'BRL'
                    }
                );

            renderGrafico(
                sC,
                sD,
                sE,
                sNF
            );

        }

    };

}

/* ========= GRÁFICO ========= */

function renderGrafico(c,d,e,nf){

    const ctx =
        document.getElementById(
            'graficoPizza'
        );

    if(meuGrafico){

        meuGrafico.destroy();

    }

    meuGrafico = new Chart(ctx, {

        type:'doughnut',

        data:{

            labels:[
                'Cachê',
                'Diária',
                'Extras',
                'NF'
            ],

            datasets:[{

                data:[
                    c || 0,
                    d || 0,
                    e || 0,
                    nf || 0
                ],

                backgroundColor:[
                    '#10b981',
                    '#0ea5e9',
                    '#f59e0b',
                    '#ef4444'
                ],

                borderWidth:0

            }]

        },

        options:{

            cutout:'72%',

            responsive:true,

            maintainAspectRatio:false,

            plugins:{
                legend:{
                    display:false
                }
            }

        }

    });

}

/* ========= MODAL ========= */

function abrirModal(id){

    idParaExcluir = id;

    document.getElementById(
        'modalExcluir'
    ).style.display = 'flex';

}

function fecharModal(){

    idParaExcluir = null;

    document.getElementById(
        'modalExcluir'
    ).style.display = 'none';

}

document.getElementById(
    'confirmarBtn'
).onclick = function(){

    if(!idParaExcluir)
    return;

    db.transaction(
        "jobs",
        "readwrite"
    )
    .objectStore("jobs")
    .delete(idParaExcluir)
    .onsuccess = ()=>{

        fecharModal();

        atualizarTela();

    };

};

/* ========= EXCEL ========= */

function baixarExcelCompleto(){

    let csv =
    "\ufeffData;Job;Cache;Diária;Extra;NF;Total\n";

    let totalGeral = 0;

    db.transaction("jobs")
    .objectStore("jobs")
    .openCursor()
    .onsuccess = (e)=>{

        const c =
            e.target.result;

        if(c){

            const v =
                c.value;

            csv +=

            `${v.data
            .split('-')
            .reverse()
            .join('/')};`

            +

            `${v.job};`

            +

            `${v.cache.toFixed(2)};`

            +

            `${v.diaria.toFixed(2)};`

            +

            `${v.extra.toFixed(2)};`

            +

            `${(v.valorNF || 0)
            .toFixed(2)};`

            +

            `${v.total.toFixed(2)}\n`;

            totalGeral +=
                v.total;

            c.continue();

        }else{

            csv +=
            `\n;;;;TOTAL GERAL;${totalGeral.toFixed(2)}\n`;

            const link =
                document.createElement('a');

            link.href =
                URL.createObjectURL(
                    new Blob(
                        [csv],
                        {
                            type:'text/csv;charset=utf-8;'
                        }
                    )
                );

            link.download =
                "Total geral de caches.csv";

            link.click();

        }

    };

}

/* ========= BUSCA ========= */

function filtrarTabela(){

    let input =
        document.getElementById(
            "inputBusca"
        );

    let filter =
        input.value.toUpperCase();

    let cards =
        document.getElementsByClassName(
            "history-card"
        );

    for(let i=0; i<cards.length; i++){

        let texto =
            cards[i]
            .innerText
            .toUpperCase();

        cards[i].style.display =

            texto.indexOf(filter) > -1
            ? ""
            : "none";

    }

}

/* ========= WHATSAPP ========= */

function enviarRelatorioWhatsApp(){

    db.transaction("jobs")
    .objectStore("jobs")
    .getAll()
    .onsuccess = (e)=>{

        const dados =
            e.target.result;

        if(dados.length === 0){

            return alert(
                "Sem dados!"
            );

        }

        let total = 0;
        let totalNF = 0;

        let msg =
`⭐ *FADER LIVRE - RELATÓRIO* ⭐

============================

`;

        dados.forEach(item=>{

            total += item.total;

            totalNF += item.valorNF || 0;

            msg +=

`📅 ${item.data
.split('-')
.reverse()
.join('/')}

🎬 ${item.job}

💰 ${item.total.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
)}

📄 NF:
${(item.valorNF || 0)
.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
)}

📅 Pgto:
${new Date(item.pagamento)
.toLocaleDateString('pt-BR')}

============================

`;

        });

        msg +=

`
✅ TOTAL BRUTO:
${total.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
)}

📄 TOTAL NF:
${totalNF.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
)}

🕒 Gerado em:
${new Date()
.toLocaleString('pt-BR')}
`;

        window.open(
            `https://wa.me/?text=${encodeURIComponent(msg)}`
        );

    };

}
