<style>
:root{

    --bg:#0f172a;

* { box-sizing: border-box; }

body{

.header{

.header img{

.semana-label{

.dashboard{

    margin-bottom:25px;

    text-align:center;

}

.total-semana{

    text-shadow:0 0 20px rgba(16,185,129,0.5);
}

.pgto-info{

    color:#94a3b8;

}

.chart-container{
    position:relative;

    margin-bottom:20px;
}

.custom-legend{
    display:flex;
    justify-content:space-around;
    align-items:center;

    flex-wrap:wrap;
}

.legend-item{

    flex-direction:column;

}

.legend-color{
    width:14px;
    height:14px;
    border-radius:4px;
    margin-bottom:6px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.legend-label{
    font-size:0.7em;
    color:#94a3b8;

    font-weight:500;
    margin-bottom:2px;
}

.legend-value{

}

.input-group{
    background:var(--card);

label{

@media print {

@media (max-width: 480px) {

    .total-semana { font-size:2em; }

</style>

<script>
var db, meuGrafico, dataReferencia = new Date(), idParaExcluir = null;

// CONFIGS PADRÃO
['tipoFechamento','percentualNF'].forEach(key => {
    if(!localStorage.getItem(key)) localStorage.setItem(key, key === 'tipoFechamento' ? 'semanal' : '0');
});

// INÍCIO SEMANA FIXO SEGUNDA
localStorage.setItem('inicioSemana', '1');

window.addEventListener('load', () => {
    ['tipoFechamento','percentualNF'].forEach(id => {
        document.getElementById(id).value = localStorage.getItem(id);
    });
    
    document.getElementById('tipoFechamento').onchange = 
    document.getElementById('percentualNF').oninput = salvarConfigs;
    
    setTimeout(() => document.getElementById('dataJob').focus(), 800);
    
    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        deferredPrompt = e;
    });
});

// SISTEMA DE LICENÇA MELHORADO
if(!localStorage.getItem('fader_device_id')) {
    localStorage.setItem('fader_device_id', Math.floor(1000 + Math.random() * 8999));
}
const ID_APARELHO = localStorage.getItem('fader_device_id');

function verificarAtivacao() {
    const licenca = localStorage.getItem('fader_license');
    const chaveCorreta = (parseInt(ID_APARELHO) * 7 + 123).toString();
    
    if (licenca !== chaveCorreta) {
        document.getElementById('telaBloqueio').style.display = 'flex';
        document.getElementById('displayID').innerText = "FL-" + ID_APARELHO;
        document.getElementById('inputSerial').focus();
    }
}

function verificarSerial() {
    const input = document.getElementById('inputSerial').value.replace(/\D/g,'');
    const chaveCorreta = (parseInt(ID_APARELHO) * 7 + 123).toString();
    
    if (input === chaveCorreta) {
        localStorage.setItem('fader_license', input);
        localStorage.setItem('fader_ativado_em', new Date().toISOString());
        alert(`✅ Fader Livre Ativado!\n\nID: FL-${ID_APARELHO}\nSerial: ${input}\n\n✅ Licença vitalícia neste dispositivo!`);
        location.reload();
    } else {
        alert(`❌ Serial inválido!\n\nID: FL-${ID_APARELHO}\nSerial correto: ${chaveCorreta}`);
        document.getElementById('inputSerial').value = '';
        document.getElementById('inputSerial').focus();
    }
}

function salvarConfigs(){
    ['tipoFechamento','percentualNF'].forEach(id => {
        localStorage.setItem(id, document.getElementById(id).value);
    });
    atualizarTela();
}

var request = indexedDB.open("FaderLivreCache_V2", 2);
request.onupgradeneeded = (e) => {
    var d = e.target.result;
    if (!d.objectStoreNames.contains("jobs")) {
        d.createObjectStore("jobs", { keyPath: "id", autoIncrement: true });
    }
};

request.onsuccess = (e) => {
    db = e.target.result;
    verificarAtivacao();
    if(localStorage.getItem('fader_license')) atualizarTela();
};

function mudarSemana(valor){
    const tipo = localStorage.getItem('tipoFechamento') || 'semanal';
    if(tipo === 'semanal') dataReferencia.setDate(dataReferencia.getDate() + (valor * 7));
    else if(tipo === 'quinzenal') dataReferencia.setDate(dataReferencia.getDate() + (valor * 15));
    else dataReferencia.setMonth(dataReferencia.getMonth() + valor);
    atualizarTela();
}

function getLimitesSemana(dt) {
    var d = new Date(dt); d.setHours(0,0,0,0);
    let inicio, fim, pgto;
    const tipo = localStorage.getItem('tipoFechamento') || 'semanal';
    
    if(tipo === 'semanal'){
        let dia = d.getDay();
        let diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
        inicio = new Date(d.setDate(diff));
        fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
        pgto = new Date(fim);
        pgto.setDate(fim.getDate() + (5 - fim.getDay() + 7) % 7); // Sexta
    }
    else if(tipo === 'quinzenal'){
        if(d.getDate() <= 15){
            inicio = new Date(d.getFullYear(), d.getMonth(), 1);
            fim = new Date(d.getFullYear(), d.getMonth(), 15);
            pgto = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        } else {
            inicio = new Date(d.getFullYear(), d.getMonth(), 16);
            fim = new Date(d.getFullYear(), d.getMonth() + 1, 0);
            pgto = new Date(d.getFullYear(), d.getMonth() + 1, 15);
        }
    }
    else {
        inicio = new Date(d.getFullYear(), d.getMonth(), 1);
        fim = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        pgto = new Date(d.getFullYear(), d.getMonth() + 1, 1);
        let diasUteis = 0;
        while(diasUteis < 5){
            pgto.setDate(pgto.getDate() + 1);
            const diaSemana = pgto.getDay();
            if(diaSemana !== 0 && diaSemana !== 6) diasUteis++;
        }
    }
    
    fim.setHours(23,59,59,999);
    return { seg: inicio, dom: fim, pgto };
}

function salvarJob() {
    var dt = document.getElementById('dataJob').value;
    if(!dt) return alert("❌ Selecione a data primeiro!");
    
    var c = parseFloat(document.getElementById('vCacheBase').value) || 0;
    var dV = parseFloat(document.getElementById('vDiaria').value) || 0;
    var job = document.getElementById('nomeJob').value.trim() || "Job sem nome";
    
    var t1 = document.getElementById('inicio').value.split(':');
    var t2 = document.getElementById('fim').value.split(':');
    var min = (parseInt(t2[0])*60 + parseInt(t2[1])) - (parseInt(t1[0])*60 + parseInt(t1[1]));
    if(min < 0) min += 1440;
    
    var exH = Math.max(0, (min/60) - 12);
    var vEx = exH * (c/12);
    var totalBruto = c + dV + vEx;
    
    var percentualNF = parseFloat(localStorage.getItem('percentualNF')) || 0;
    var valorNF = totalBruto * (percentualNF / 100);
    
    var registro = {
        data: dt,
        job: job.substring(0,50),
        cache: c,
        diaria: dV,
        extra: vEx,
        nf: valorNF,
        total: totalBruto,
        criado_em: new Date().toISOString()
    };
    
    db.transaction("jobs", "readwrite").objectStore("jobs").add(registro).onsuccess = () => {
        document.querySelectorAll('#dataJob, #nomeJob, #vCacheBase, #vDiaria, #inicio, #fim')
            .forEach(el => el.value = el.id === 'inicio' ? '08:00' : el.id === 'fim' ? '20:00' : '');
        document.getElementById('dataJob').focus();
        atualizarTela();
        // Feedback visual
        event.target.innerText = '✅ SALVO!';
        setTimeout(() => event.target.innerText = '💾 SALVAR JOB', 1500);
    };
}

function atualizarTela() {
    if(!db) return;
    
    var limites = getLimitesSemana(dataReferencia);
    document.getElementById('labelSemana').innerHTML = 
        limites.seg.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'}) + 
        " → " + 
        limites.dom.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
    
    document.getElementById('vPgto').innerText = 
        "💳 Pgto previsto: " + limites.pgto.toLocaleDateString('pt-BR');
    
    var sC=0, sD=0, sE=0, sNF=0, totalS=0;
    var lista = document.getElementById('listaHistorico');
    lista.innerHTML = "";
    
    var tx = db.transaction("jobs").objectStore("jobs").openCursor(null, 'prev');
    tx.onsuccess = (e) => {
        var cursor = e.target.result;
        if(cursor){
            var d = cursor.value;
            var dataJ = new Date(d.data + "T00:00:00");
            
            if(dataJ >= limites.seg && dataJ <= limites.dom){
                sC += d.cache;
                sD += d.diaria;
                sE += d.extra;
                sNF += d.nf || 0;
                totalS += d.total;
                
                var card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div style="font-weight:700; font-size:1.1em; margin-bottom:5px;">
                        ${d.data.split('-').reverse().join('/')}
                    </div>
                    <div style="color:#94a3b8; font-size:0.9em;">${d.job}</div>
                    <div style="font-size:1.3em; font-weight:700; color:var(--primary); margin-top:8px;">
                        R$ ${d.total.toLocaleString('pt-BR', {minimumFractionDigits:2})}
                    </div>
                    <button class="btn-del" onclick="abrirModal(${d.id})">×</button>
                `;
                lista.appendChild(card);
            }
            cursor.continue();
        } else {
            document.getElementById('vTotalSemana').innerText = 
                'R$ ' + totalS.toLocaleString('pt-BR', {minimumFractionDigits:2});
            
            ['Cache','Diaria','Extra','NF'].forEach((leg, i) => {
                const valor = i === 0 ? sC : i === 1 ? sD : i === 2 ? sE : sNF;
                document.getElementById('leg' + leg).innerText = 
                    'R$ ' + valor.toLocaleString('pt-BR', {minimumFractionDigits:2});
            });
            
            setTimeout(() => renderGrafico(sC,sD,sE,sNF), 150);
        }
    };
}

function renderGrafico(c,d,e,nf){
    var ctx = document.getElementById('graficoPizza');
    if(!ctx || !Chart) return;
    if(meuGrafico) meuGrafico.destroy();
    
    let dados = [c || 1, d || 0, e || 0];
    let cores = ['#10b981','#0ea5e9','#f59e0b'];
    let labels = ['Cachê', 'Diária', 'Extra'];
    
    if(nf > 0){
        dados.push(nf);
        cores.push('#ef4444');
        labels.push('NF');
    }
    
    meuGrafico = new Chart(ctx.getContext('2d'), {
        type:'doughnut',
        data:{
            labels:labels,
            datasets:[{
                data:dados,
                backgroundColor:cores,
                borderWidth:0,
                borderRadius:10,
                hoverOffset:8
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            cutout:'70%',
            plugins:{
                legend:{display:false},
                tooltip:{
                    backgroundColor:'rgba(15,23,42,0.95)',
                    titleColor:'white',
                    bodyColor:'white',
                    cornerRadius:8
                }
            },
            animation:{
                animateRotate:true,
                duration:1500
            }
        }
    });
}

function abrirModal(id){
    idParaExcluir = id;
    document.getElementById('modalExcluir').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function fecharModal(){
    document.getElementById('modalExcluir').style.display = 'none';
    document.body.style.overflow = '';
    idParaExcluir = null;
}

document.getElementById('confirmarBtn').onclick = function() {
    if(idParaExcluir){
        db.transaction("jobs","readwrite").objectStore("jobs")
            .delete(idParaExcluir).onsuccess = () => {
                fecharModal();
                atualizarTela();
            };
    }
};

document.addEventListener('click', (e) => {
    if(e.target.id === 'modalExcluir') fecharModal();
});

function baixarExcelCompleto() {
    if(!db) return alert('❌ Banco de dados não carregado!');
    
    var csv = "\ufeffData;Job;Cachê;Diária;Extra;NF;Total geral de cachês\n";
    var totalGeral = 0;
    var count = 0;
    
    db.transaction("jobs").objectStore("jobs").openCursor().onsuccess = (e) => {
        var c = e.target.result;
        if (c) {
            const d = c.value;
            csv += `${d.data.split('-').reverse().join('/')};` +
                   `"${d.job.replace(/"/g,'""')}";` +
                   `${d.cache.toFixed(2).replace('.',',')};` +
                   `${d.diaria.toFixed(2).replace('.',',')};` +
                   `${d.extra.toFixed(2).replace('.',',')};` +
                   `${(d.nf||0).toFixed(2).replace('.',',')};` +
                   `${d.total.toFixed(2).replace('.',',')}\n`;
            totalGeral += d.total;
            count++;
            c.continue();
        } else {
            csv += `\n\n;Total de registros:;${count};;;;\n;;;;;TOTAL GERAL;R$ ${totalGeral.toFixed(2).replace('.',',')}`;
            
            var link = document.createElement("a");
            var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
            link.href = URL.createObjectURL(blob);
            link.download = `Total geral de cachês_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    };
}

function filtrarTabela() {
    let input = document.getElementById("inputBusca");
    let filter = input.value.toUpperCase();
    let cards = document.getElementsByClassName("history-card");
    for (let i = 0; i < cards.length; i++) {
        let textoCard = cards[i].innerText.toUpperCase();
        cards[i].style.display = textoCard.indexOf(filter) > -1 ? "" : "none";
    }
}

function enviarRelatorioWhatsApp() {
    db.transaction("jobs").objectStore("jobs").getAll().onsuccess = (e) => {
        const dados = e.target.result;
        if (!dados.length) return alert("❌ Cadastre jobs primeiro!");
        
        dados.sort((a, b) => new Date(a.data) - new Date(b.data));
        
        let msg = "*🎵 FADER LIVRE - CACHÊ CONTROL PRO* 🎵\n" +
                  "═══════════════════════════════════════\n\n";
        
        let totalGeral = 0;
        dados.slice(-15).forEach(item => { // Últimos 15
            const dt = item.data.split('-').reverse().join('/');
            msg += `📅 *${dt}*\n🎬 *${item.job.toUpperCase()}*\n💰 *R$ ${item.total.toFixed(2)}*\n` +
                   "───────────────────────────────\n";
            totalGeral += item.total;
        });
        
        msg += `\n💎 *TOTAL ACUMULADO:* R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}\n\n` +
               `_Relatório Fader Livre Pro_\n` +
               `*Gerado: ${new Date().toLocaleString('pt-BR')}*`;
        
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    };
}

    if(e.ctrlKey && e.key === 'Enter') salvarJob();
    if(e.ctrlKey && e.key === 'p') window.print();
});
