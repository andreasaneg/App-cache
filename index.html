<script>

<!-- ========================= -->
<!-- SUBSTITUA COMPLETAMENTE -->
<!-- A FUNÇÃO atualizarTela() -->
<!-- ========================= -->

<script>

function atualizarTela(){

    if(!db) return;

    const limites =
        getLimitesSemana(dataReferencia);

    document.getElementById(
        'labelSemana'
    ).innerHTML =

        limites.seg.toLocaleDateString('pt-BR')
        +
        " até "
        +
        limites.dom.toLocaleDateString('pt-BR');

    let total = 0;

    let semanal = {
        cache:0,
        diaria:0,
        extra:0,
        nf:0
    };

    let quinzenal = {
        cache:0,
        diaria:0,
        extra:0,
        nf:0
    };

    let mensal = {
        cache:0,
        diaria:0,
        extra:0,
        nf:0
    };

    const lista =
        document.getElementById(
            'listaHistorico'
        );

    lista.innerHTML = "";

    db.transaction("jobs")
    .objectStore("jobs")
    .openCursor(null,'prev')
    .onsuccess = (e)=>{

        const cursor =
            e.target.result;

        if(cursor){

            const d =
                cursor.value;

            const dataJ =
                new Date(
                    d.data + "T00:00:00"
                );

            if(dataJ >= limites.seg
            && dataJ <= limites.dom){

                total += d.total;

                /* ========= SOMAS ========= */

                if(d.tipoPagamento === "semanal"){

                    semanal.cache += d.cache;
                    semanal.diaria += d.diaria;
                    semanal.extra += d.extra;
                    semanal.nf += d.valorNF || 0;

                }

                if(d.tipoPagamento === "quinzenal"){

                    quinzenal.cache += d.cache;
                    quinzenal.diaria += d.diaria;
                    quinzenal.extra += d.extra;
                    quinzenal.nf += d.valorNF || 0;

                }

                if(d.tipoPagamento === "mensal"){

                    mensal.cache += d.cache;
                    mensal.diaria += d.diaria;
                    mensal.extra += d.extra;
                    mensal.nf += d.valorNF || 0;

                }

                /* ========= CARD ========= */

                const card =
                    document.createElement('div');

                card.className =
                    'history-card';

                card.innerHTML = `

                    <b>
                    ${d.data
                    .split('-')
                    .reverse()
                    .join('/')}
                    </b>

                    - ${d.job}

                    <br><br>

                    💰 Total:
                    <b>

                    ${d.total.toLocaleString(
                        'pt-BR',
                        {
                            style:'currency',
                            currency:'BRL'
                        }
                    )}

                    </b>

                    <br>

                    📅 Previsão:
                    <b style="color:#10b981;">

                    ${new Date(d.pagamento)
                    .toLocaleDateString('pt-BR')}

                    </b>

                    <button
                    class="btn-del"
                    onclick="abrirModal(${d.id})">
                    ×
                    </button>

                `;

                lista.appendChild(card);

            }

            cursor.continue();

        }else{

            document.getElementById(
                'vTotalSemana'
            ).innerText =

                total.toLocaleString(
                    'pt-BR',
                    {
                        style:'currency',
                        currency:'BRL'
                    }
                );

            /* ========= GRAFICO SEMANAL ========= */

            if(
                semanal.cache > 0
                ||
                semanal.diaria > 0
                ||
                semanal.extra > 0
            ){

                document.getElementById(
                    'boxGraficoSemanal'
                ).style.display = 'block';

                renderGrafico(
                    'graficoSemanal',
                    semanal
                );

            }else{

                document.getElementById(
                    'boxGraficoSemanal'
                ).style.display = 'none';

            }

            /* ========= GRAFICO QUINZENAL ========= */

            if(
                quinzenal.cache > 0
                ||
                quinzenal.diaria > 0
                ||
                quinzenal.extra > 0
            ){

                document.getElementById(
                    'boxGraficoQuinzenal'
                ).style.display = 'block';

                renderGrafico(
                    'graficoQuinzenal',
                    quinzenal
                );

            }else{

                document.getElementById(
                    'boxGraficoQuinzenal'
                ).style.display = 'none';

            }

            /* ========= GRAFICO MENSAL ========= */

            if(
                mensal.cache > 0
                ||
                mensal.diaria > 0
                ||
                mensal.extra > 0
            ){

                document.getElementById(
                    'boxGraficoMensal'
                ).style.display = 'block';

                renderGrafico(
                    'graficoMensal',
                    mensal
                );

            }else{

                document.getElementById(
                    'boxGraficoMensal'
                ).style.display = 'none';

            }

        }

    };

}

</script>

<!-- ========================= -->
<!-- SUBSTITUA A renderGrafico -->
<!-- ========================= -->

<script>

function renderGrafico(id, dados){

    const ctx =
        document.getElementById(id);

    if(!ctx) return;

    const chartExistente =
        Chart.getChart(ctx);

    if(chartExistente){

        chartExistente.destroy();

    }

    new Chart(ctx, {

        type:'doughnut',

        data:{

            labels:[
                'Cachê',
                'Diária',
                'Extras',
                'NF'
            ],

            datasets:[{

                data:[
                    dados.cache || 0,
                    dados.diaria || 0,
                    dados.extra || 0,
                    dados.nf || 0
                ],

                backgroundColor:[
                    '#10b981',
                    '#0ea5e9',
                    '#f59e0b',
                    '#ef4444'
                ],

                borderWidth:0

            }]

        },

        options:{

            cutout:'70%',

            responsive:true,

            maintainAspectRatio:false,

            plugins:{

                legend:{
                    display:true,
                    position:'bottom',
                    labels:{
                        color:'#ffffff'
                    }
                }

            }

        }

    });

}

</script>

<!-- ========================= -->

<script>

function enviarRelatorioWhatsApp(){

    db.transaction("jobs")
    .objectStore("jobs")
    .getAll()
    .onsuccess = (e)=>{

        const dados =
            e.target.result;

        if(dados.length === 0){

            return alert(
                "Sem dados!"
            );

        }

        let total = 0;

        let msg =
`⭐ *FADER LIVRE - RELATÓRIO* ⭐

============================

`;

        dados.forEach(item=>{

            total += item.total;

            msg +=

`📅 ${item.data
.split('-')
.reverse()
.join('/')}

🎬 ${item.job}

💰 ${item.total.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
)}

📅 Pgto:
${new Date(item.pagamento)
.toLocaleDateString('pt-BR')}

============================

`;

        });

        msg +=

`
✅ TOTAL BRUTO:
${total.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
)}

🕒 Gerado em:
${new Date()
.toLocaleString('pt-BR')}
`;

        window.open(
            `https://wa.me/?text=${encodeURIComponent(msg)}`
        );

    };

}

</script>
