<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Gerador Fader Livre - Serial Oficial</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #10b981;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            background: linear-gradient(45deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.2em;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 18px;
            font-size: 1.8em;
            font-weight: 700;
            border: 2px solid #475569;
            border-radius: 16px;
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16,185,129,0.2);
        }
        .btn-gerar {
            background: linear-gradient(45deg, #10b981, #059669);
            color: #0f172a;
            border: none;
            padding: 20px 40px;
            font-size: 1.3em;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(16,185,129,0.3);
            transition: all 0.2s;
        }
        .btn-gerar:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(16,185,129,0.4); }
        .btn-gerar:active { transform: translateY(0); }
        .resultado {
            display: none;
            background: linear-gradient(145deg, #f59e0b, #d97706);
            padding: 30px;
            border-radius: 20px;
            margin: 25px 0;
            box-shadow: 0 15px 35px rgba(245,158,11,0.4);
        }
        .id-display {
            font-size: 1.4em;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(15,23,42,0.3);
            border-radius: 12px;
        }
        .serial {
            font-size: 3.5em;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin: 15px 0;
        }
        .btn-copiar {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }
        .btn-copiar:hover { transform: scale(1.05); }
        .instrucao {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            font-size: 0.95em;
            color: #94a3b8;
        }
        .instrucao ol {
            text-align: left;
            margin-top: 15px;
        }
        .instrucao li {
            margin: 8px 0;
            padding-left: 20px;
            position: relative;
        }
        .instrucao li:before {
            content: "✅";
            position: absolute;
            left: 0;
        }
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
            .serial { font-size: 2.8em; letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 FADER LIVRE</h1>
        <p class="subtitle">Gerador Oficial de Serial</p>
        
        <input type="text" id="idAparelho" placeholder="Digite 4 números do ID (ex: 1234)" maxlength="4" pattern="[0-9]*">
        
        <button class="btn-gerar" onclick="gerarSerial()">🎵 GERAR SERIAL</button>
        
        <div id="resultado" class="resultado">
            <div class="id-display">
                📱 <strong>ID do Cliente:</strong><br>
                <span id="displayID"></span>
            </div>
            <div class="serial" id="serialGerado"></div>
            <button class="btn-copiar" onclick="copiarSerial()">📋 COPIAR SERIAL</button>
            <p style="color:#0f172a; font-weight:700; margin-top:15px;">
                Este serial ativa o app PRA SEMPRE neste celular!
            </p>
        </div>
        
        <div class="instrucao">
            <strong>📖 Como usar:</strong>
            <ol>
                <li>Cliente abre app Fader Livre</li>
                <li>Clique em "ID DO APARELHO" (FL-XXXX)</li>
                <li>Digite os 4 números aqui 👆</li>
                <li>Copie o serial gerado</li>
                <li>Envie pro cliente ativar</li>
            </ol>
        </div>
    </div>

    <script>
        // Foco automático
        document.getElementById('idAparelho').focus();
        
        // Enter para gerar
        document.getElementById('idAparelho').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') gerarSerial();
        });
        
        function gerarSerial() {
            const idInput = document.getElementById('idAparelho').value.trim();
            
            if (!idInput || idInput.length !== 4 || !/^\d{4}$/.test(idInput)) {
                alert('❌ Digite EXATAMENTE 4 números!\n\nExemplo: 1234');
                document.getElementById('idAparelho').focus();
                document.getElementById('idAparelho').select();
                return;
            }
            
            const idNumerico = parseInt(idInput);
            const serial = (idNumerico * 7 + 123).toString();
            
            document.getElementById('displayID').innerText = 'FL-' + idInput;
            document.getElementById('serialGerado').innerText = serial;
            document.getElementById('resultado').style.display = 'block';
            
            // Scroll suave + foco no botão copiar
            document.getElementById('resultado').scrollIntoView({behavior: 'smooth'});
        }
        
        function copiarSerial() {
            const serial = document.getElementById('serialGerado').innerText;
            navigator.clipboard.writeText(serial).then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = '✅ COPIADO!';
                btn.style.background = 'linear-gradient(45deg, #10b981, #059669)';
                btn.style.color = '#0f172a';
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = 'linear-gradient(45deg, #ef4444, #dc2626)';
                    btn.style.color = 'white';
                }, 2500);
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = serial;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('✅ Serial copiado!');
            });
        }
        
        // Validação em tempo real
        document.getElementById('idAparelho').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0,4);
        });
    </script>
</body>
</html>
