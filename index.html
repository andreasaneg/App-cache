<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FADER LIVRE - CACHÊ CONTROL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --danger: #ef4444;
            --muted: #94a3b8;
            --blue: #38bdf8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 15px; padding-bottom: 60px;
            background: var(--bg); color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }
        .header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .header img { width: 140px; height: 140px; border-radius: 18px; border: 2px solid var(--primary); object-fit: cover; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .dashboard-card { background: var(--card); border-radius: 18px; padding: 20px; border: 1px solid #334155; position: relative; }
        .dashboard-title { font-size: .8em; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .total-geral { font-size: 2em; font-weight: bold; color: var(--blue); }
        .total-nf { font-size: 2em; font-weight: bold; color: var(--danger); }
        .total-horas { font-size: 2em; font-weight: bold; color: var(--primary); }
        .eye-button { position: absolute; top: 15px; right: 15px; width: 60px; height: 60px; border: none; border-radius: 18px; background: #334155; color: white; font-size: 1.8em; cursor: pointer; transition: .2s; }
        .eye-button:hover { transform: scale(1.08); }
        .input-group { background: var(--card); border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 0.75em; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 12px; font-size: 16px; }
        .btn { width: 100%; border: none; padding: 16px; border-radius: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 1em; transition: .2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn-save { background: var(--primary); color: #000; }
        .btn-export { background: #475569; color: white; }
        .btn-whats { background: #25D366; color: #000; }
        .btn-search { background: #0ea5e9; color: white; }
        .history-card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 15px; position: relative; border-left: 6px solid var(--primary); }
        .empresa-title { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; }
        .extra-box { margin-top: 10px; padding: 10px; border-radius: 10px; background: #082f49; color: #38bdf8; font-weight: bold; }
        .btn-del { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--danger); font-size: 1.5em; cursor: pointer; z-index: 10; }
        .btn-edit-inline { position: absolute; top: 10px; right: 50px; background: none; border: none; color: var(--blue); font-size: 1.3em; cursor: pointer; z-index: 10; }
        .chart-container { height: 320px; margin-top: 20px; }
        .search-box { display: none; margin-bottom: 15px; }
        .section-title { font-size: 1.3em; font-weight: bold; margin: 25px 0 15px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-button { flex: 1; padding: 12px; background: var(--card); color: var(--text); border: 1px solid #334155; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .tab-button.active { background: var(--primary); color: #000; }
        .app-section { display: none; }
        .app-section.active { display: block; }
        .autocomplete-list { position: absolute; z-index: 100; background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: calc(100% - 32px); max-height: 200px; overflow-y: auto; margin-top: -10px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5); }
        .autocomplete-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #334155; }
        .autocomplete-item:hover { background: #0f172a; color: var(--primary); }
        .badge-status { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin-top: 5px; }
        .status-aberto { background: #0284c7; color: #fff; }
        .status-fechado { background: #ea580c; color: #fff; }
        .status-pago { background: #16a34a; color: #fff; }
        .toggle-filter-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-filter { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-filter.active { background: #475569; border-color: var(--primary); }
        @media print { .btn, .search-box, .btn-del, .tab-container, .toggle-filter-container { display: none !important; } }
    </style>
</head>
